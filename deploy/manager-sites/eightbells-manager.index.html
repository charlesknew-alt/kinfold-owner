<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager – The Eight Bells</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --ink:#1c1610;--ink-soft:#5c5346;--cream:#f6f0e6;--paper:#fbf7f0;--rule:#e5dccf;
      --forest:#24362c;--brass:#b68a3a;--eightbells:#6b2d5b;--eightbells-glow:#f5eef3;
      --serif:'Fraunces',Georgia,serif;--sans:'Source Sans 3',system-ui,sans-serif;
    }
    html,body{min-height:100%;margin:0;font-family:var(--sans);background:var(--cream);color:var(--ink);-webkit-overflow-scrolling:touch}
    .login{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#2a1e28 0%,#1c1610 100%);display:flex;align-items:center;justify-content:center;transition:opacity .4s}
    .login.hidden{opacity:0;pointer-events:none}
    .login-card{background:var(--paper);border:1px solid rgba(246,240,230,.2);border-radius:20px;padding:36px 28px;width:90%;max-width:360px;text-align:center}
    .login-card .icon{font-size:44px;margin-bottom:10px}
    .login-card h1{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:4px}
    .login-card h2{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--eightbells);margin-bottom:22px}
    .login-card input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--rule);background:#fff;font-size:16px;text-align:center;letter-spacing:3px;outline:none}
    .login-btn{width:100%;padding:14px;border:none;border-radius:999px;background:var(--forest);color:var(--cream);font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;font-family:inherit}
    .error{color:#b42318;font-size:13px;margin-top:12px;display:none}
    .error.show{display:block}

    .home{display:none;min-height:100vh;padding:28px 18px 40px;position:relative}
    .home.show{display:block}
    .home::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(800px 360px at 100% 0%,#b68a3a22,transparent 55%)}
    .home-inner{max-width:480px;margin:0 auto;position:relative}
    .brand{text-align:center;margin-bottom:26px}
    .brand .icon{font-size:40px;margin-bottom:8px}
    .brand h1{font-family:var(--serif);font-size:36px;font-weight:600}
    .brand p{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
    .card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:18px;box-shadow:0 16px 40px rgba(28,22,16,.06)}
    .links{display:flex;flex-direction:column;gap:10px}
    .link{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);text-decoration:none;color:var(--ink);cursor:pointer;font:inherit;text-align:left;width:100%}
    .link:hover{border-color:var(--brass);background:#fff}
    .link-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--eightbells-glow);flex-shrink:0}
    .link-label{flex:1;font-size:14px;font-weight:700}
    .link-label small{display:block;font-size:12px;font-weight:400;color:var(--ink-soft);margin-top:2px}
    .link-arrow{color:var(--ink-soft);font-size:20px}
    .note{margin-top:16px;text-align:center;font-size:12.5px;color:var(--ink-soft)}
    .note a{color:var(--ink);font-weight:600}
    .signout{display:block;margin:18px auto 0;background:none;border:1px solid var(--rule);border-radius:999px;padding:8px 16px;font:600 13px var(--sans);cursor:pointer;color:var(--ink-soft)}

    .app{display:none;position:fixed;inset:0;z-index:50;flex-direction:column;background:var(--cream)}
    .app.show{display:flex}
    .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(246,240,230,.94);border-bottom:1px solid var(--rule);flex-shrink:0}
    .bar button{background:none;border:1px solid var(--rule);border-radius:999px;padding:8px 14px;font:600 13px var(--sans);cursor:pointer}
    .bar .title{font-weight:700;font-size:14px}
    iframe{flex:1;width:100%;border:0;background:#fff}
    .loader{position:absolute;inset:48px 0 0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:10;transition:opacity .4s}
    .loader.hidden{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div class="login" id="login">
    <div class="login-card">
      <div class="icon">🔔</div>
      <h1>The Eight Bells</h1>
      <h2>Manager Portal</h2>
      <input type="password" id="pw" placeholder="Enter PIN" maxlength="6" inputmode="numeric" autocomplete="off">
      <button class="login-btn" onclick="checkPw()">Sign In</button>
      <div class="error" id="err">Incorrect PIN</div>
    </div>
  </div>

  <div class="home" id="home">
    <div class="home-inner">
      <div class="brand">
        <div class="icon">🔔</div>
        <h1>Eight Bells</h1>
        <p>Manager · Bolney</p>
      </div>
      <div class="card">
        <div class="links">
          <button type="button" class="link" onclick="openTool('paperwork','Daily & weekly paperwork')">
            <span class="link-icon">📋</span>
            <span class="link-label">Daily &amp; weekly paperwork<small>Cash-up, tabs, week submit</small></span>
            <span class="link-arrow">›</span>
          </button>
          <button type="button" class="link" onclick="openTool('menus','Menus')">
            <span class="link-icon">🍽️</span>
            <span class="link-label">Menus<small>Specials, Main, print sheets</small></span>
            <span class="link-arrow">›</span>
          </button>
          <button type="button" class="link" onclick="openTool('pricing','Drink pricing')">
            <span class="link-icon">💷</span>
            <span class="link-label">Drink pricing<small>Bar sell / Price Query</small></span>
            <span class="link-arrow">›</span>
          </button>
          <button type="button" class="link" onclick="openTool('cards','Card takings')">
            <span class="link-icon">💳</span>
            <span class="link-label">Card takings<small>Card day figures</small></span>
            <span class="link-arrow">›</span>
          </button>
        </div>
      </div>
      <p class="note"><a href="https://owner.kinfoldinns.co.uk/menus-guide.html" target="_blank" rel="noopener">Menus quick guide</a></p>
      <button type="button" class="signout" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="app" id="app">
    <div class="bar">
      <button type="button" onclick="closeTool()">← Home</button>
      <span class="title" id="appTitle">Tool</span>
    </div>
    <div class="loader" id="loader"><span>Loading…</span></div>
    <iframe id="f" src="about:blank" allow="clipboard-write"></iframe>
  </div>

  <script>
    var PIN = '1106';
    var HUB = 'https://script.google.com/macros/s/AKfycbz4Q-UMy3o8Z6bjYrQMsWbRB4mSs1iHqz2CHAgYhT9QvakBY0pnutRbyQ2YUwpFnYtIww/exec';
    var TOOLS = {
      paperwork: HUB,
      menus: 'https://owner.kinfoldinns.co.uk/menus.html?mode=staff&v=20260926-flow73',
      pricing: HUB + '?page=kegcosting',
      cards: HUB + '?page=cardday'
    };

    if (sessionStorage.getItem('eightbells_auth') === 'yes') {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('home').classList.add('show');
    }
    document.getElementById('pw').addEventListener('keydown', function(e) { if (e.key === 'Enter') checkPw(); });
    document.getElementById('pw').focus();

    function checkPw() {
      if (document.getElementById('pw').value.trim() === PIN) {
        sessionStorage.setItem('eightbells_auth', 'yes');
        document.getElementById('login').classList.add('hidden');
        document.getElementById('home').classList.add('show');
      } else {
        document.getElementById('err').classList.add('show');
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }

    function signOut() {
      sessionStorage.removeItem('eightbells_auth');
      document.getElementById('home').classList.remove('show');
      document.getElementById('app').classList.remove('show');
      document.getElementById('f').src = 'about:blank';
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }

    function openTool(id, title) {
      var url = TOOLS[id];
      if (!url) return;
      document.getElementById('home').classList.remove('show');
      document.getElementById('app').classList.add('show');
      document.getElementById('appTitle').textContent = title || id;
      document.getElementById('loader').classList.remove('hidden');
      var f = document.getElementById('f');
      f.src = url;
      f.onload = function() { setTimeout(function(){ document.getElementById('loader').classList.add('hidden'); }, 600); };
      setTimeout(function(){ document.getElementById('loader').classList.add('hidden'); }, 15000);
    }

    function closeTool() {
      document.getElementById('app').classList.remove('show');
      document.getElementById('f').src = 'about:blank';
      document.getElementById('home').classList.add('show');
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'navigate' && e.data.url) {
        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('f').src = e.data.url;
        document.getElementById('f').onload = function() {
          setTimeout(function(){ document.getElementById('loader').classList.add('hidden'); }, 600);
        };
        setTimeout(function(){ document.getElementById('loader').classList.add('hidden'); }, 15000);
      }
    });
  </script>
</body>
</html>
