<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varlo · Eight Bells — Menus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paint: #DFC2AF; --paint-deep: #A79283; --paint-wash: #F4EAE3;
      --ink: #1A1814; --ink-soft: #4a4640; --line: #e5e0d4;
      --white-warm: #FBF8F2; --green: #538135;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Source Sans 3', sans-serif;
    }
    body { font-family: var(--sans); background: var(--white-warm); color: var(--ink); line-height: 1.45; }
    .ps-header { background: var(--paint); border-bottom: 1px solid var(--paint-deep); padding: 14px 20px; }
    .ps-header-inner { max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .ps-venue-eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
    .ps-venue-name { font-family: var(--serif); font-size: 22px; font-weight: 500; }
    html.iframed .ps-header { display: none; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }
    h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; }
    .lede { color: var(--ink-soft); max-width: 720px; margin: 6px 0 18px; font-size: 15px; }
    .menus, .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .menus button, .modes button, button.go, button.ghost {
      font-family: var(--sans); cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); padding: 8px 14px; font-weight: 600; font-size: 13px;
    }
    .menus button.on, .modes button.on { background: var(--ink); color: var(--paint); border-color: var(--ink); }
    button.go { background: var(--ink); color: var(--paint); border-color: var(--ink); }
    button.link { background: transparent; border: 0; color: var(--ink-soft); text-decoration: underline; padding: 0; font-weight: 600; cursor: pointer; font-family: var(--sans); }
    .top-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: 1.25fr 0.85fr; gap: 18px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    label.field { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin: 10px 0 4px; }
    input[type=text], select, textarea {
      width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--white-warm); color: var(--ink);
    }
    textarea { min-height: 140px; }
    .plan { border-radius: 12px; padding: 12px 14px; background: var(--paint-wash); margin-bottom: 12px; }
    .plan strong { font-family: var(--serif); font-weight: 500; font-size: 18px; display: block; }
    .plan.over { background: #fbeae6; }
    .plan.one, .plan.two-up { background: #e8f0e4; }
    .note { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
    .include-box { background: var(--paint-wash); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .include-box h3 { font-family: var(--serif); font-weight: 500; font-size: 17px; margin-bottom: 6px; }
    .include-row { display: flex; flex-wrap: wrap; gap: 10px 16px; }
    .include-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .complete-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: end; margin: 8px 0; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
    .ticks-head { display: grid; grid-template-columns: repeat(4, 52px); gap: 4px; text-align: center; }
    .dish-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .dish-row .name { font-weight: 700; }
    .dish-row .meta { font-size: 13px; color: var(--ink-soft); }
    .dish-row .tag { color: var(--green); font-style: italic; }
    .ticks { display: grid; grid-template-columns: repeat(4, 52px); gap: 4px; justify-items: center; padding-top: 2px; }
    .ticks label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
    .ticks .letter { color: var(--green); font-style: italic; font-size: 12px; }
    .section-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 12px; font-weight: 700; }
    .mark { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
    .opt-row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
    .opt-row label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-soft); font-weight: 600; cursor: pointer; }
    ul.dishes { list-style: none; }
    ul.dishes li { padding: 8px 0; border-bottom: 1px solid var(--line); }
    ul.dishes .name { font-weight: 700; }
    .from { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
    @media print {
      .ps-header, .lede, .menus, .modes, .top-actions, #editor, .no-print { display: none !important; }
      .grid { display: block; }
      .card { border: 0; padding: 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <header class="ps-header">
    <div class="ps-header-inner">
      <div>
        <div class="ps-venue-eyebrow">The Eight Bells · Bolney</div>
        <div class="ps-venue-name">Menus</div>
      </div>
    </div>
  </header>
  <main>
    <h1>Menus</h1>
    <p class="lede">Build each menu — <strong>upload a PDF or image</strong>, paste a list, or add/adjust dishes. Keep a <strong>wording bank</strong> for Stay a While, pub quizzes and events (with dates). Tick what to print, or leave unticked and Generate auto-picks — never past dates.</p>
    <div class="menus" id="menuPicker"></div>
    <div class="top-actions no-print">
      <button type="button" class="go" id="doGenerate">Generate menu</button>
      <button type="button" class="ghost" id="doPrintHint">Print / save as PDF from the generated sheet</button>
    </div>
    <div class="grid">
      <section class="card" id="editor"></section>
      <section class="card" id="preview"></section>
    </div>
  </main>
  <script src="menus.js"></script>
  <script src="menus-print.js"></script>
  <script src="menus-ingest.js"></script>
  <script>
    var STORAGE = 'eb-menus-v2';
    var META_STORAGE = 'eb-menus-meta-v1';
    var PROMO_STORAGE = 'eb-menu-promo-bank-v1';
    var PROMO_TICKS = 'eb-menu-promo-ticks-v1';
    var book = load();
    var metaBook = loadMeta();
    var promoBank = loadPromoBank();
    var promoTicks = loadPromoTicks();
    var menuId = 'main';
    var mode = 'complete';
    var dishId = '';
    var includes = loadIncludes();
    var pendingReview = null;
    var editingPromoId = '';

    if (window.parent !== window) document.documentElement.classList.add('iframed');

    function loadPromoBank() {
      try {
        var raw = JSON.parse(localStorage.getItem(PROMO_STORAGE) || 'null');
        return EBMenus.normalizePromoBank(raw);
      } catch (e) {
        return EBMenus.seedPromoBank();
      }
    }
    function savePromoBank() {
      localStorage.setItem(PROMO_STORAGE, JSON.stringify(promoBank));
    }
    function loadPromoTicks() {
      try { return JSON.parse(localStorage.getItem(PROMO_TICKS) || '{}') || {}; }
      catch (e) { return {}; }
    }
    function savePromoTicks() {
      localStorage.setItem(PROMO_TICKS, JSON.stringify(promoTicks));
    }
    function hostPromoTicks() {
      return (promoTicks[menuId] && typeof promoTicks[menuId] === 'object') ? promoTicks[menuId] : {};
    }
    function pickedPromosForSheet() {
      return EBMenus.pickPromos(promoBank, hostPromoTicks(), { max: 2 });
    }
    function load() {
      try {
        var saved = JSON.parse(localStorage.getItem(STORAGE) || localStorage.getItem('eb-menus-v1') || 'null');
        if (saved && saved.main) {
          var seeded = EBMenus.seed();
          if (!saved.party) saved.party = seeded.party;
          return saved;
        }
      } catch (e) {}
      return EBMenus.seed();
    }
    function loadMeta() {
      try {
        return JSON.parse(localStorage.getItem(META_STORAGE) || '{}') || {};
      } catch (e) { return {}; }
    }
    function save() {
      localStorage.setItem(STORAGE, JSON.stringify(book));
      localStorage.setItem(META_STORAGE, JSON.stringify(metaBook));
      localStorage.setItem(STORAGE + '-includes', JSON.stringify(includes));
    }
    function loadIncludes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE + '-includes') || '{}') || {};
      } catch (e) { return {}; }
    }
    function dishes() { return book[menuId] || (book[menuId] = []); }
    function hostIncludes() {
      var out = {};
      EBMenus.includableMenus(menuId).forEach(function (m) {
        out[m.id] = !!(includes[menuId] && includes[menuId][m.id]);
      });
      return out;
    }

    var MARK = '<svg class="mark" viewBox="0 0 24 24" aria-label="Lunch club"><path fill="currentColor" d="M7.2 4.2h1.4v6.2H7.2zm2.6 0h1.4v6.2h-1.4zm2.6 0h1.4v6.2h-1.4zM8.4 11.2h5.2c.4 1.2-.2 2.4-1.4 2.9V20H9.8v-5.9c-1-.5-1.6-1.6-1.4-2.9z" transform="rotate(-32 12 12)"/><path fill="currentColor" d="M11 3.5l1.1 8.4 1.5-.2L12.6 3.5zM10.4 12h3l.4 1.3c.2.7-.2 1.4-.9 1.6V20h-1.5v-5.1c-.7-.3-1.1-1-.9-1.7z" transform="rotate(34 12 12)"/></svg>';

    function render() {
      renderPicker();
      renderEditor();
      renderPreview();
    }

    function renderPicker() {
      var box = document.getElementById('menuPicker');
      box.innerHTML = '';
      EBMenus.MENUS.forEach(function (menu) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = menu.name;
        b.className = menu.id === menuId ? 'on' : '';
        b.onclick = function () {
          menuId = menu.id;
          dishId = (dishes()[0] && dishes()[0].id) || '';
          if (mode !== 'complete' && mode !== 'adjust' && mode !== 'replace' && mode !== 'add' && mode !== 'paste') mode = 'complete';
          render();
        };
        box.appendChild(b);
      });
    }

    function currentDish() {
      var list = dishes();
      for (var i = 0; i < list.length; i++) if (list[i].id === dishId) return list[i];
      return null;
    }

    function renderEditor() {
      var menu = EBMenus.menuById(menuId);
      var el = document.getElementById('editor');
      var html = '<h2 style="font-family:var(--serif);font-weight:500;font-size:24px">' + menu.name + '</h2>';
      html += '<div class="modes">';
      [
        ['complete', 'Show complete menu'],
        ['adjust', 'Adjust a dish'],
        ['replace', 'Replace a dish'],
        ['add', 'Add a dish'],
        ['paste', 'Upload / paste'],
        ['wording', 'Wording / events']
      ].forEach(function (pair) {
        html += '<button type="button" data-mode="' + pair[0] + '" class="' + (mode === pair[0] ? 'on' : '') + '">' + pair[1] + '</button>';
      });
      html += '</div>';

      var extras = EBMenus.includableMenus(menuId);
      if (extras.length) {
        html += '<div class="include-box"><h3>Also put on this sheet</h3>';
        html += '<p class="note" style="margin:0 0 8px">Tick another menu to try it on the same sheet. The note on the right says if it still fits.</p><div class="include-row">';
        extras.forEach(function (m) {
          var on = !!(includes[menuId] && includes[menuId][m.id]);
          html += '<label><input type="checkbox" data-include="' + m.id + '"' + (on ? ' checked' : '') + '> ' + m.name + '</label>';
        });
        html += '</div></div>';
      }

      if (menu.kind === 'long') {
        html += renderPromoTicksBox();
      }

      if (mode === 'complete') {
        html += renderComplete();
      } else if (mode === 'wording') {
        html += renderWordingBank();
      } else if (mode === 'paste') {
        html += '<p class="note">Upload a designed menu <strong>PDF or photo</strong>, or paste text. You will <strong>review</strong> the dishes before they replace <em>' + menu.name + '</em>.</p>';
        html += '<div class="include-box" style="margin-bottom:14px">';
        html += '<h3>AI reader (recommended for Christmas / Canva art)</h3>';
        html += '<p class="note" style="margin:0 0 8px">Same idea as the website conversion: Gemini reads the picture and returns clean dishes. Needs a one-time Apps Script URL (uses your AI credits). Without it, images fall back to OCR and are often wrong.</p>';
        html += '<label class="field">AI reader URL</label>';
        html += '<input type="url" id="aiUrl" placeholder="https://script.google.com/macros/s/…/exec" value="' + escapeAttr((window.EBMenuIngest && EBMenuIngest.getAiUrl()) || '') + '">';
        html += '<button class="link" id="doSaveAiUrl" type="button" style="margin-top:8px">Save AI URL</button>';
        html += '<p class="note" id="aiUrlNote" style="margin-top:6px">Setup: see apps-script/menu-ai/README.md in the repo.</p>';
        html += '</div>';
        html += '<div class="include-box" style="margin-bottom:14px">';
        html += '<h3>Upload PDF or image</h3>';
        html += '<input type="file" id="menuFile" accept="application/pdf,image/*,.pdf,.png,.jpg,.jpeg,.webp" style="display:block;width:100%;font:inherit">';
        html += '<button class="go" id="doUpload" type="button" style="margin-top:12px">Read uploaded file</button>';
        html += '<p class="note" id="uploadNote" style="margin-top:8px"></p>';
        html += '</div>';
        html += '<label class="field">Or paste / edit text</label><textarea id="paste" placeholder="Starters&#10;Jerusalem Artichoke Soup&#10;finished with fragrant black truffle oil"></textarea>';
        html += '<button class="go" id="doPaste" type="button" style="margin-top:12px">Read whole menu</button>';
        html += '<p class="note" id="pasteNote"></p>';
        if (menu.kind === 'party') {
          var m = metaBook[menuId] || EBMenus.emptyMeta();
          html += '<div class="include-box" style="margin-top:14px"><h3>Party sheet details</h3>';
          html += field('Title', 'metaTitle', m.title || 'Christmas Party Menu');
          html += field('Course prices', 'metaPrices', m.coursePrices || '2 courses £32.95 · 3 courses £39.95');
          html += field('Notes (pre-order / deposit)', 'metaNotes', m.notes || '');
          html += '<button class="go" id="doSaveMeta" type="button" style="margin-top:12px">Save party details</button></div>';
        }
      } else if (mode === 'add' || mode === 'adjust' || mode === 'replace') {
        if ((mode === 'adjust' || mode === 'replace') && !dishes().length) {
          html += '<p class="note">This menu is empty. Add a dish, or paste a whole menu.</p>';
        } else {
          var item = (mode === 'adjust' || mode === 'replace') ? currentDish() : blank();
          if (!item) item = blank();
          if (mode === 'replace') {
            html += '<p class="note">Pick the dish to swap out, then type the new one. Same slot on the menu.</p>';
          }
          if (mode === 'adjust' || mode === 'replace') {
            html += '<label class="field">Dish</label><select id="pick">';
            dishes().forEach(function (d) {
              html += '<option value="' + d.id + '"' + (d.id === dishId ? ' selected' : '') + '>' + d.section + ' — ' + d.name + '</option>';
            });
            html += '</select>';
          }
          var formItem = mode === 'replace' ? blank() : item;
          if (mode === 'replace') formItem.section = item.section;
          html += field('Section', 'section', formItem.section);
          html += field('Name', 'name', formItem.name);
          html += field('Description', 'description', formItem.description);
          html += field('Price', 'price', formItem.price);
          html += marksEditor(mode === 'replace' ? formItem : item, 'form');
          var saveLabel = mode === 'add' ? 'Add dish' : (mode === 'replace' ? 'Replace dish' : 'Save changes');
          html += '<button class="go" id="doSave" type="button" style="margin-top:14px">' + saveLabel + '</button>';
          if (mode === 'adjust' && item.id) html += ' <button class="link" id="doRemove" type="button">Remove this dish</button>';
        }
      }
      html += '<div class="note" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">';
      html += '<button class="link" id="doClear" type="button">Clear this menu (start again)</button>';
      html += '<span>·</span>';
      html += '<button class="link" id="doReset" type="button">Put all sample menus back</button>';
      html += '</div>';
      el.innerHTML = html;
      bindEditor();
    }

    function marksEditor(item, prefix) {
      var m = EBMenus.parseMarks(item.tags);
      var lunch = menuId !== 'lunch-club';
      var html = '<div class="opt-row" style="margin-top:12px">';
      if (lunch) {
        html += tick('Lunch club ' + MARK, prefix + '-lunch', item.lunchClub);
      }
      html += tick('<span class="letter">gf</span> gluten free', prefix + '-gf', m.gf);
      html += tick('as option', prefix + '-gfOpt', m.gfOpt);
      html += tick('<span class="letter">v</span> vegetarian', prefix + '-v', m.v);
      html += tick('as option', prefix + '-vOpt', m.vOpt);
      html += tick('<span class="letter">vg</span> vegan', prefix + '-vg', m.vg);
      html += tick('as option', prefix + '-vgOpt', m.vgOpt);
      html += '</div>';
      if (menuId === 'lunch-club') {
        html += '<p class="note">This card is the lunch club itself, Monday to Thursday. Two courses £14.95, three courses £17.95.</p>';
      }
      return html;
    }
    function tick(label, id, on) {
      return '<label><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '> ' + label + '</label>';
    }

    function renderPromoTicksBox() {
      var ticks = hostPromoTicks();
      var any = Object.keys(ticks).some(function (k) { return ticks[k]; });
      var auto = pickedPromosForSheet();
      var html = '<div class="include-box"><h3>Events &amp; wording on this sheet</h3>';
      html += '<p class="note" style="margin:0 0 8px">Tick lines from the bank to force them onto Generate. Leave all unticked and we’ll auto-pick (upcoming dates first — never past dates). Edit the bank under <strong>Wording / events</strong>.</p>';
      html += '<div class="include-row">';
      promoBank.forEach(function (p) {
        var past = EBMenus.isPastPromoDate(p.date);
        var label = p.title;
        if (p.date) label += ' · ' + (EBMenus.formatPromoDate(p.date) || p.date);
        if (past) label += ' (past)';
        html += '<label style="' + (past && !ticks[p.id] ? 'opacity:.55' : '') + '">';
        html += '<input type="checkbox" data-promo-tick="' + escapeAttr(p.id) + '"' + (ticks[p.id] ? ' checked' : '') + '> ';
        html += escapeAttr(label) + '</label>';
      });
      html += '</div>';
      if (!any) {
        html += '<p class="note" style="margin:8px 0 0">Auto for Generate: <strong>' +
          (auto.length ? auto.map(function (p) { return escapeAttr(p.title); }).join(' · ') : 'nothing eligible') +
          '</strong></p>';
      }
      html += '</div>';
      return html;
    }

    function renderWordingBank() {
      var html = '<p class="note">Bank of short blurbs for the menu — rooms, quizzes, events. Add a <strong>date</strong> for one-offs (pub quiz night). Past dates are skipped on auto-pick unless you tick them.</p>';
      html += '<div class="include-box" style="margin-bottom:14px"><h3>Add or edit</h3>';
      var edit = null;
      promoBank.forEach(function (p) { if (p.id === editingPromoId) edit = p; });
      html += field('Title', 'promoTitle', edit ? edit.title : '');
      html += '<label class="field">Wording</label><textarea id="promoBody" placeholder="Join us from 8pm…">' + escapeAttr(edit ? edit.body : '') + '</textarea>';
      html += field('Date (optional, YYYY-MM-DD)', 'promoDate', edit ? (edit.date || '') : '');
      html += '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">';
      html += '<button class="go" id="doSavePromo" type="button">' + (edit ? 'Save wording' : 'Add to bank') + '</button>';
      if (edit) html += '<button class="link" id="doCancelPromo" type="button">Cancel edit</button>';
      html += '</div></div>';
      html += '<h3 style="font-family:var(--serif);font-weight:500;font-size:18px;margin:4px 0 8px">In the bank</h3>';
      if (!promoBank.length) {
        html += '<p class="note">Empty — add Stay a While, a pub quiz, etc.</p>';
        return html;
      }
      promoBank.forEach(function (p) {
        var past = EBMenus.isPastPromoDate(p.date);
        html += '<div class="dish-row" style="grid-template-columns:1fr auto">';
        html += '<div><div class="name">' + escapeAttr(p.title);
        if (p.date) html += ' <span style="font-weight:500">' + escapeAttr(EBMenus.formatPromoDate(p.date) || p.date) + '</span>';
        if (past) html += ' <span class="from">past</span>';
        html += '</div>';
        if (p.body) html += '<div class="meta">' + escapeAttr(p.body) + '</div>';
        html += '</div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">';
        html += '<button type="button" class="link" data-edit-promo="' + escapeAttr(p.id) + '">Edit</button>';
        html += '<button type="button" class="link" data-del-promo="' + escapeAttr(p.id) + '">Remove</button>';
        html += '</div></div>';
      });
      return html;
    }

    function renderComplete() {
      var list = dishes();
      if (!list.length) return '<p class="note">This menu is empty. Add a dish, or paste a list.</p>';
      var showLunch = menuId !== 'lunch-club';
      var html = '<div class="complete-head"><div>Dish</div><div class="ticks-head">';
      if (showLunch) html += '<span title="Lunch club">' + MARK + '</span>';
      html += '<span class="letter">gf</span><span class="letter">v</span><span class="letter">vg</span></div></div>';
      var section = '';
      list.forEach(function (d) {
        if (d.section !== section) {
          section = d.section;
          html += '<div class="section-label">' + escapeAttr(section) + '</div>';
        }
        var m = EBMenus.parseMarks(d.tags);
        html += '<div class="dish-row" data-id="' + d.id + '">';
        html += '<div><div class="name">' + escapeAttr(d.name);
        if (d.price && menuId !== 'lunch-club') html += ' <span style="font-weight:500">' + escapeAttr(d.price) + '</span>';
        html += '</div>';
        if (d.description) html += '<div class="meta">' + escapeAttr(d.description) + '</div>';
        if (d.tags) html += '<div class="tag">' + escapeAttr(d.tags) + '</div>';
        html += '<div class="opt-row">';
        if (m.gf) html += '<label><input type="checkbox" data-flag="gfOpt" data-id="' + d.id + '"' + (m.gfOpt ? ' checked' : '') + '> gf as option</label>';
        if (m.v) html += '<label><input type="checkbox" data-flag="vOpt" data-id="' + d.id + '"' + (m.vOpt ? ' checked' : '') + '> v as option</label>';
        if (m.vg) html += '<label><input type="checkbox" data-flag="vgOpt" data-id="' + d.id + '"' + (m.vgOpt ? ' checked' : '') + '> vg as option</label>';
        html += '</div></div>';
        html += '<div class="ticks">';
        if (showLunch) html += '<label><input type="checkbox" data-flag="lunchClub" data-id="' + d.id + '"' + (d.lunchClub ? ' checked' : '') + '><span>' + MARK + '</span></label>';
        html += '<label><input type="checkbox" data-flag="gf" data-id="' + d.id + '"' + (m.gf ? ' checked' : '') + '><span class="letter">gf</span></label>';
        html += '<label><input type="checkbox" data-flag="v" data-id="' + d.id + '"' + (m.v ? ' checked' : '') + '><span class="letter">v</span></label>';
        html += '<label><input type="checkbox" data-flag="vg" data-id="' + d.id + '"' + (m.vg ? ' checked' : '') + '><span class="letter">vg</span></label>';
        html += '</div></div>';
      });
      return html;
    }

    function bindEditor() {
      document.querySelectorAll('[data-mode]').forEach(function (b) {
        b.onclick = function () { mode = b.getAttribute('data-mode'); render(); };
      });
      document.querySelectorAll('[data-include]').forEach(function (box) {
        box.onchange = function () {
          if (!includes[menuId]) includes[menuId] = {};
          includes[menuId][box.getAttribute('data-include')] = box.checked;
          save();
          renderPreview();
        };
      });
      document.querySelectorAll('[data-promo-tick]').forEach(function (box) {
        box.onchange = function () {
          if (!promoTicks[menuId]) promoTicks[menuId] = {};
          promoTicks[menuId][box.getAttribute('data-promo-tick')] = box.checked;
          savePromoTicks();
          renderPreview();
        };
      });
      var savePromo = document.getElementById('doSavePromo');
      if (savePromo) {
        savePromo.onclick = function () {
          var title = (document.getElementById('promoTitle') || {}).value || '';
          var body = (document.getElementById('promoBody') || {}).value || '';
          var date = (document.getElementById('promoDate') || {}).value || '';
          title = String(title).trim();
          if (!title) { alert('Add a title for this wording.'); return; }
          date = String(date).trim();
          if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
            alert('Date must be YYYY-MM-DD, or leave blank.');
            return;
          }
          if (editingPromoId) {
            promoBank = promoBank.map(function (p) {
              if (p.id !== editingPromoId) return p;
              return { id: p.id, title: title, body: String(body).trim(), date: date };
            });
          } else {
            promoBank.push(EBMenus.promoItem(title, body, date));
          }
          editingPromoId = '';
          savePromoBank();
          render();
        };
      }
      var cancelPromo = document.getElementById('doCancelPromo');
      if (cancelPromo) cancelPromo.onclick = function () { editingPromoId = ''; render(); };
      document.querySelectorAll('[data-edit-promo]').forEach(function (b) {
        b.onclick = function () { editingPromoId = b.getAttribute('data-edit-promo'); mode = 'wording'; render(); };
      });
      document.querySelectorAll('[data-del-promo]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-del-promo');
          if (!confirm('Remove this wording from the bank?')) return;
          promoBank = promoBank.filter(function (p) { return p.id !== id; });
          Object.keys(promoTicks).forEach(function (mid) {
            if (promoTicks[mid]) delete promoTicks[mid][id];
          });
          if (editingPromoId === id) editingPromoId = '';
          savePromoBank();
          savePromoTicks();
          render();
        };
      });
      document.querySelectorAll('[data-flag]').forEach(function (box) {
        box.onchange = function () { applyFlag(box.getAttribute('data-id'), box.getAttribute('data-flag'), box.checked); };
      });
      var pick = document.getElementById('pick');
      if (pick) pick.onchange = function () { dishId = pick.value; render(); };
      var doPaste = document.getElementById('doPaste');
      if (doPaste) doPaste.onclick = onPaste;
      var doUpload = document.getElementById('doUpload');
      if (doUpload) doUpload.onclick = onUpload;
      var doSaveAi = document.getElementById('doSaveAiUrl');
      if (doSaveAi) doSaveAi.onclick = function () {
        var v = (document.getElementById('aiUrl') || {}).value || '';
        EBMenuIngest.setAiUrl(v.trim());
        var n = document.getElementById('aiUrlNote');
        if (n) n.textContent = v.trim() ? 'AI reader URL saved on this browser.' : 'AI reader cleared — uploads will use OCR/PDF text only.';
      };
      var doSaveMeta = document.getElementById('doSaveMeta');
      if (doSaveMeta) doSaveMeta.onclick = function () {
        metaBook[menuId] = {
          title: (document.getElementById('metaTitle') || {}).value || '',
          subtitle: '',
          coursePrices: (document.getElementById('metaPrices') || {}).value || '',
          notes: (document.getElementById('metaNotes') || {}).value || ''
        };
        save();
        renderPreview();
      };
      var doSave = document.getElementById('doSave');
      if (doSave) doSave.onclick = onSave;
      var doRemove = document.getElementById('doRemove');
      if (doRemove) doRemove.onclick = onRemove;
      var doClear = document.getElementById('doClear');
      if (doClear) doClear.onclick = function () {
        if (!confirm('Clear every dish on ' + EBMenus.menuById(menuId).name + ' and start again?')) return;
        book[menuId] = [];
        dishId = '';
        save();
        mode = 'paste';
        render();
      };
      document.getElementById('doReset').onclick = function () {
        if (!confirm('Replace all menus with the sample set?')) return;
        book = EBMenus.seed();
        metaBook = {};
        includes = {};
        save();
        dishId = (dishes()[0] && dishes()[0].id) || '';
        mode = 'complete';
        render();
      };
    }

    function openReview(result) {
      pendingReview = result;
      var existing = document.getElementById('reviewOverlay');
      if (existing) existing.parentNode.removeChild(existing);
      var overlay = document.createElement('div');
      overlay.id = 'reviewOverlay';
      overlay.setAttribute('style',
        'position:fixed;inset:0;z-index:50;background:rgba(28,22,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto');
      var card = document.createElement('div');
      card.setAttribute('style',
        'background:#fffaf4;color:#1c1610;max-width:560px;width:100%;border-radius:16px;padding:22px 24px;margin:24px 0;box-shadow:0 18px 40px rgba(0,0,0,.25)');
      var html = '<div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5a534a;margin-bottom:6px;font-family:system-ui,sans-serif">Check before saving</div>';
      html += '<div style="font-family:Georgia,serif;font-size:22px;font-weight:600;margin-bottom:8px">Review extracted menu</div>';
      html += '<p style="font-family:system-ui,sans-serif;font-size:14px;line-height:1.45;margin:0 0 12px;color:#3a342c">' +
        escapeAttr(result.warning || 'Check every dish before you accept.') + '</p>';
      var fixes = result.spellingFixes || [];
      if (fixes.length) {
        html += '<div style="margin:0 0 14px;padding:12px 14px;border:2px solid #1c1610;border-radius:12px;background:#fff8e8">';
        html += '<div style="font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:0 0 8px">Spelling changes — check these</div>';
        html += '<ul style="margin:0;padding-left:18px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.45">';
        fixes.forEach(function (f) {
          html += '<li style="margin:0 0 6px"><span style="text-decoration:line-through;opacity:.75">' +
            escapeAttr(f.from) + '</span> → <strong>' + escapeAttr(f.to) + '</strong>';
          if (f.where) html += ' <span style="opacity:.65;font-size:12px">(' + escapeAttr(f.where) + ')</span>';
          html += '</li>';
        });
        html += '</ul></div>';
      } else if (result.source === 'ai') {
        html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:0 0 12px;padding:8px 12px;background:#f0ebe3;border-radius:10px">AI reported <strong>no spelling changes</strong>.</p>';
      }
      if (result.meta && (result.meta.title || result.meta.coursePrices)) {
        html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:0 0 10px"><strong>' +
          escapeAttr(result.meta.title || '') + '</strong>';
        if (result.meta.coursePrices) html += '<br>' + escapeAttr(result.meta.coursePrices);
        html += '</p>';
      }
      html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:0 0 8px">' +
        (result.dishes || []).length + ' dishes · untick any junk lines</p>';
      html += '<div id="reviewList" style="max-height:42vh;overflow:auto;border:1px solid #e4d9cc;border-radius:10px;padding:8px 10px;background:#fff;font-family:system-ui,sans-serif;font-size:13px">';
      (result.dishes || []).forEach(function (d, i) {
        html += '<label style="display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;cursor:pointer">';
        html += '<input type="checkbox" data-review-i="' + i + '" checked style="margin-top:3px">';
        html += '<span><strong>' + escapeAttr(d.section) + '</strong> — ' + escapeAttr(d.name);
        if (d.price) html += ' <span style="opacity:.7">' + escapeAttr(d.price) + '</span>';
        if (d.tags) html += ' <em style="color:#538135">' + escapeAttr(d.tags) + '</em>';
        if (d.description) html += '<br><span style="color:#555">' + escapeAttr(d.description) + '</span>';
        html += '</span></label>';
      });
      html += '</div>';
      if (result.kind === 'party' && menuId !== 'party') {
        html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:12px 0 0;color:#5a2a2a">AI thinks this is a <strong>party / Christmas</strong> set menu. Use the <strong>Party / Christmas</strong> tab for the standardised centred layout.</p>';
      }
      html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">';
      html += '<button type="button" id="reviewAccept" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:0;border-radius:999px;background:#1c1610;color:#f4eae3;cursor:pointer">Looks good — save to ' + escapeAttr(EBMenus.menuById(menuId).name) + '</button>';
      html += '<button type="button" id="reviewCancel" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:1px solid #1c1610;border-radius:999px;background:#fff;cursor:pointer">Cancel</button>';
      html += '</div>';
      card.innerHTML = html;
      overlay.appendChild(card);
      document.body.appendChild(overlay);
      document.getElementById('reviewCancel').onclick = function () {
        overlay.parentNode.removeChild(overlay);
        pendingReview = null;
      };
      document.getElementById('reviewAccept').onclick = function () {
        var keep = [];
        overlay.querySelectorAll('[data-review-i]').forEach(function (box) {
          if (box.checked) {
            var d = pendingReview.dishes[parseInt(box.getAttribute('data-review-i'), 10)];
            if (d) keep.push(d);
          }
        });
        if (!keep.length) {
          alert('Tick at least one dish, or cancel.');
          return;
        }
        book[menuId] = keep;
        if (pendingReview.meta && (pendingReview.meta.title || pendingReview.meta.coursePrices || pendingReview.meta.notes)) {
          metaBook[menuId] = pendingReview.meta;
        }
        dishId = keep[0].id;
        save();
        overlay.parentNode.removeChild(overlay);
        pendingReview = null;
        mode = 'complete';
        render();
      };
    }

    function onUpload() {
      var input = document.getElementById('menuFile');
      var note = document.getElementById('uploadNote');
      var btn = document.getElementById('doUpload');
      if (!input || !input.files || !input.files[0]) {
        if (note) note.textContent = 'Choose a PDF or image first.';
        return;
      }
      if (!window.EBMenuIngest) {
        if (note) note.textContent = 'Upload reader failed to load. Refresh the page and try again.';
        return;
      }
      var file = input.files[0];
      if (btn) { btn.disabled = true; btn.textContent = 'Reading…'; }
      if (note) note.textContent = 'Starting…';
      EBMenuIngest.readFile(file, function (status) {
        if (note) note.textContent = status;
      }).then(function (result) {
        var area = document.getElementById('paste');
        if (area && result.source !== 'ai') area.value = result.text;
        if (btn) { btn.disabled = false; btn.textContent = 'Read uploaded file'; }
        if (note) note.textContent = (result.warning || 'Ready to review.') + ' (' + result.dishes.length + ' dishes)';
        openReview(result);
      }).catch(function (err) {
        if (note) note.textContent = (err && err.message) ? err.message : 'Could not read that file.';
        if (btn) { btn.disabled = false; btn.textContent = 'Read uploaded file'; }
      });
    }

    function findDish(id) {
      var list = dishes();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function applyFlag(id, flag, on) {
      var item = findDish(id);
      if (!item) return;
      if (flag === 'lunchClub') {
        item.lunchClub = on;
      } else {
        var m = EBMenus.parseMarks(item.tags);
        m[flag] = on;
        if (flag === 'gf' && !on) m.gfOpt = false;
        if (flag === 'v' && !on) m.vOpt = false;
        if (flag === 'vg' && !on) m.vgOpt = false;
        if (flag === 'gfOpt' && on) m.gf = true;
        if (flag === 'vOpt' && on) m.v = true;
        if (flag === 'vgOpt' && on) m.vg = true;
        item.tags = EBMenus.formatMarks(m);
      }
      save();
      // refresh tags line without full re-render of scroll position
      render();
    }

    function field(label, id, value) {
      return '<label class="field">' + label + '</label><input type="text" id="' + id + '" value="' + escapeAttr(value || '') + '">';
    }
    function escapeAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }
    function blank() {
      return { section: dishes()[0] ? dishes()[0].section : 'Mains', name: '', description: '', price: '', tags: '', lunchClub: false };
    }
    function readMarks(prefix) {
      return EBMenus.formatMarks({
        gf: !!(document.getElementById(prefix + '-gf') && document.getElementById(prefix + '-gf').checked),
        gfOpt: !!(document.getElementById(prefix + '-gfOpt') && document.getElementById(prefix + '-gfOpt').checked),
        v: !!(document.getElementById(prefix + '-v') && document.getElementById(prefix + '-v').checked),
        vOpt: !!(document.getElementById(prefix + '-vOpt') && document.getElementById(prefix + '-vOpt').checked),
        vg: !!(document.getElementById(prefix + '-vg') && document.getElementById(prefix + '-vg').checked),
        vgOpt: !!(document.getElementById(prefix + '-vgOpt') && document.getElementById(prefix + '-vgOpt').checked)
      });
    }
    function readForm() {
      return {
        section: document.getElementById('section').value.trim() || 'Dishes',
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        price: document.getElementById('price').value.trim(),
        tags: readMarks('form'),
        lunchClub: !!(document.getElementById('form-lunch') && document.getElementById('form-lunch').checked)
      };
    }
    function onSave() {
      var next = readForm();
      if (!next.name) return;
      if (mode === 'add') {
        next.id = EBMenus.dish(next.section, next.name).id + '-' + Date.now();
        dishes().push(next);
        dishId = next.id;
        mode = 'complete';
      } else if (mode === 'replace' || mode === 'adjust') {
        var item = currentDish();
        if (!item) return;
        Object.keys(next).forEach(function (k) { item[k] = next[k]; });
        mode = 'complete';
      }
      save();
      render();
    }
    function onRemove() {
      book[menuId] = dishes().filter(function (d) { return d.id !== dishId; });
      dishId = (dishes()[0] && dishes()[0].id) || '';
      save();
      mode = 'complete';
      render();
    }
    function onPaste() {
      var text = document.getElementById('paste').value;
      var parsed = EBMenus.parsePaste(text).filter(function (d) {
        return !EBMenus.isJunkDishName(d.name);
      });
      var note = document.getElementById('pasteNote');
      if (!parsed.length) {
        if (note) note.textContent = 'Nothing to read. Put each dish on its own line. Use headings like Starters / Mains.';
        return;
      }
      openReview({
        text: text,
        dishes: parsed,
        meta: metaBook[menuId] || EBMenus.emptyMeta(),
        kind: '',
        source: 'paste',
        fileName: '',
        needsReview: true,
        warning: 'Pasted text — check the list before saving to the menu.'
      });
    }

    function planTitle(fit) {
      if (fit === 'two-up') return 'One sheet, two copies';
      if (fit === 'one') return 'One A4 page';
      if (fit === 'two') return 'Two A4 pages';
      return 'Too full';
    }

    function composed() {
      var result = EBMenus.sheetPlanFor(book, menuId, hostIncludes());
      var menu = EBMenus.menuById(menuId);
      if (menu.kind === 'long' && typeof EBMenuPrint !== 'undefined' && EBMenuPrint.planFluidLayout) {
        var promos = pickedPromosForSheet();
        var layout = EBMenuPrint.planFluidLayout(menu, result.dishes, { promos: promos });
        result.plan.layout = layout;
        result.plan.fit = layout.fit;
        result.plan.text = layout.summary;
        result.plan.promos = promos;
      }
      return result;
    }

    function renderPreview() {
      var result = composed();
      var plan = result.plan;
      var list = result.dishes;
      var ticks = EBMenus.lunchClubFromTicks(book);
      var menu = EBMenus.menuById(menuId);
      var el = document.getElementById('preview');
      var html = '<div class="plan ' + plan.fit + '"><strong>' + planTitle(plan.fit) + '</strong>' + plan.text + '</div>';
      if (plan.fit === 'over') {
        html += '<p class="note">Untick an included menu, or remove dishes, before you generate.</p>';
      } else {
        html += '<p class="note">Generate fills the page (A4, or 2×A5 on one A4 for guillotine). Selling boxes stay inside their frames and only appear when there’s room.</p>';
      }
      if (plan.layout && plan.layout.fillers && plan.layout.fillers.length) {
        html += '<p class="note"><strong>Will auto-add:</strong> ' + plan.layout.fillers.map(function (f) { return escapeAttr(f); }).join(' · ') + '</p>';
      }
      var promos = plan.promos || pickedPromosForSheet();
      if (menu.kind === 'long') {
        var anyPromoTick = Object.keys(hostPromoTicks()).some(function (k) { return hostPromoTicks()[k]; });
        html += '<p class="note"><strong>Wording:</strong> ' +
          (promos.length
            ? promos.map(function (p) {
              return escapeAttr(p.title) + (p.date ? ' (' + escapeAttr(EBMenus.formatPromoDate(p.date) || p.date) + ')' : '');
            }).join(' · ')
            : 'none') +
          (anyPromoTick ? ' — from your ticks.' : ' — auto (no ticks; past dates skipped).') +
          '</p>';
      }
      if (menuId === 'lunch-club') {
        html += '<p class="note">Printed as its own card. Monday to Thursday.</p>';
      } else if (ticks.length) {
        html += '<p class="note">' + ticks.length + ' dish' + (ticks.length === 1 ? '' : 'es') + ' ticked for lunch club (Mon–Thurs). They get the knife and fork.</p>';
      } else {
        html += '<p class="note">No lunch club ticks. The lunch club stays a separate menu.</p>';
      }
      var section = '';
      html += '<ul class="dishes">';
      list.forEach(function (d) {
        if (d.section !== section) {
          section = d.section;
          html += '<li class="section-label">' + escapeAttr(section) + '</li>';
        }
        html += '<li><div class="name">' + (d.lunchClub && menuId !== 'lunch-club' ? MARK : '') + escapeAttr(d.name);
        if (menuId !== 'lunch-club' && d.price) html += ' <span style="font-weight:500">' + escapeAttr(d.price) + '</span>';
        if (d.fromMenu) html += ' <span class="from">from ' + escapeAttr(EBMenus.menuById(d.fromMenu).name) + '</span>';
        html += '</div>';
        if (d.description) html += '<div>' + escapeAttr(d.description) + '</div>';
        if (d.tags) html += '<div class="tag">' + escapeAttr(d.tags) + '</div>';
        html += '</li>';
      });
      html += '</ul>';
      el.innerHTML = html;
    }

    function generateMenu() {
      var result = composed();
      if (result.plan.fit === 'over') {
        alert('This sheet is too full. Untick an included menu or remove dishes, then try again.');
        return;
      }
      var menu = EBMenus.menuById(menuId);
      var btn = document.getElementById('doGenerate');
      var hint = document.getElementById('doPrintHint');
      if (btn) { btn.disabled = true; btn.textContent = 'Arranging…'; }
      if (hint) hint.disabled = true;

      // Layout brain runs here (order + columns + fillers), then we open a preview sheet.
      var promos = menu.kind === 'long' ? pickedPromosForSheet() : [];
      var layout = null;
      if (menu.kind === 'long' && EBMenuPrint.planFluidLayout) {
        layout = EBMenuPrint.planFluidLayout(menu, result.dishes, { promos: promos });
        result.plan.layout = layout;
        result.plan.fit = layout.fit;
        result.plan.text = layout.summary;
        result.plan.promos = promos;
      }

      var overlay = document.createElement('div');
      overlay.id = 'arrangeOverlay';
      overlay.setAttribute('style',
        'position:fixed;inset:0;z-index:40;background:rgba(28,22,16,.55);display:flex;align-items:center;justify-content:center;padding:24px');
      var card = document.createElement('div');
      card.setAttribute('style',
        'background:#fffaf4;color:#1c1610;max-width:420px;width:100%;border-radius:16px;padding:22px 24px;box-shadow:0 18px 40px rgba(0,0,0,.25);font-family:Georgia,serif');
      var steps = [
        'Ordering sections (Nibbles → Starters → Classics → Mains…)',
        'Choosing one or two pages and columns',
        'Placing wording bank / sandwiches / logo only if they fit',
        'Opening classy print preview'
      ];
      var html = '<div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5a534a;margin-bottom:8px">Layout</div>';
      html += '<div style="font-size:22px;font-weight:600;margin-bottom:12px">Arranging your menu</div>';
      html += '<ul id="arrangeSteps" style="margin:0;padding-left:18px;line-height:1.55;font-family:system-ui,sans-serif;font-size:14px;color:#333">';
      steps.forEach(function (s, i) {
        html += '<li data-step="' + i + '" style="opacity:.35;margin:0 0 6px">' + s + '</li>';
      });
      html += '</ul>';
      if (layout && layout.summary) {
        html += '<p id="arrangeSummary" style="display:none;margin:14px 0 0;font-family:system-ui,sans-serif;font-size:13px;line-height:1.45;color:#3a342c"></p>';
      }
      card.innerHTML = html;
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      var i = 0;
      function tick() {
        var li = overlay.querySelector('[data-step="' + i + '"]');
        if (li) li.style.opacity = '1';
        i += 1;
        if (i < steps.length) {
          setTimeout(tick, 280);
          return;
        }
        var sum = document.getElementById('arrangeSummary');
        if (sum && layout) {
          sum.style.display = 'block';
          sum.textContent = layout.summary;
        }
        setTimeout(function () {
          var w = window.open('', '_blank');
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          if (btn) { btn.disabled = false; btn.textContent = 'Generate menu'; }
          if (hint) hint.disabled = false;
          if (!w) {
            alert('Allow pop-ups to open the branded menu sheet, then print it to PDF.');
            return;
          }
          result.plan.meta = metaBook[menuId] || EBMenus.emptyMeta();
          if (menu.kind === 'party' && !result.plan.meta.title) {
            result.plan.meta.title = 'Christmas Party Menu';
            result.plan.meta.coursePrices = result.plan.meta.coursePrices || '2 courses £32.95 · 3 courses £39.95';
          }
          w.document.open();
          w.document.write(EBMenuPrint.build(menu, result.dishes, result.plan));
          w.document.close();
        }, 450);
      }
      setTimeout(tick, 200);
    }

    document.getElementById('doGenerate').onclick = generateMenu;
    document.getElementById('doPrintHint').onclick = generateMenu;

    dishId = (dishes()[0] && dishes()[0].id) || '';
    render();
  </script>
</body>
</html>
