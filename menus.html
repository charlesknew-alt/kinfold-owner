<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varlo · Eight Bells — Menus</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paint: #DFC2AF; --paint-deep: #A79283; --paint-wash: #F4EAE3;
      --ink: #1A1814; --ink-soft: #4a4640; --line: #e5e0d4;
      --white-warm: #FBF8F2; --green: #538135;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Source Sans 3', sans-serif;
    }
    body { font-family: var(--sans); background: var(--white-warm); color: var(--ink); line-height: 1.45; }
    .ps-header { background: var(--paint); border-bottom: 1px solid var(--paint-deep); padding: 14px 20px; }
    .ps-header-inner { max-width: 960px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .ps-venue-eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
    .ps-venue-name { font-family: var(--serif); font-size: 22px; font-weight: 500; }
    html.iframed .ps-header { display: none; } /* HARD: never restore display:block for iframed/varlo-header */
    html.staff-mode h1::after {
      content: ' · Floor';
      font-size: 0.55em; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-soft); font-family: var(--sans); font-weight: 700; vertical-align: middle;
    }
    main { max-width: 960px; margin: 0 auto; padding: 16px 16px 120px; }
    h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 5vw, 34px); }
    .lede { color: var(--ink-soft); margin: 6px 0 16px; font-size: 14.5px; max-width: 40em; }
    .menus { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .menus button, button.go, button.ghost, button.soft {
      font-family: var(--sans); cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); padding: 10px 14px; font-weight: 600; font-size: 13px; white-space: nowrap;
    }
    .menus button.on { background: var(--ink); color: var(--paint); border-color: var(--ink); }
    button.go { background: var(--ink); color: var(--paint); border-color: var(--ink); }
    button.soft { background: var(--paint-wash); border-color: transparent; }
    button.link { background: transparent; border: 0; color: var(--ink-soft); text-decoration: underline; padding: 0; font-weight: 600; cursor: pointer; font-family: var(--sans); font-size: 13px; }

    /* —— Flow route (Varlo / payroll style) —— */
    .flow-rail {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px;
      margin: 0 0 16px; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    }
    .flow-pill {
      display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent;
      font: 600 13px var(--sans); color: var(--ink-soft); padding: 6px 8px; border-radius: 999px; cursor: pointer;
    }
    .flow-pill .num {
      width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      background: var(--paint-wash); color: var(--ink); font-size: 12px; font-weight: 700;
    }
    .flow-pill.on { color: var(--ink); background: var(--paint-wash); }
    .flow-pill.on .num { background: var(--ink); color: var(--paint); }
    .flow-pill.done .num { background: var(--green); color: #fff; }
    .flow-arrow { color: var(--ink-soft); opacity: .45; font-size: 12px; padding: 0 2px; }

    .flow-step {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden;
    }
    .flow-step.is-collapsed { cursor: pointer; }
    .flow-step.is-collapsed:hover { border-color: var(--paint-deep); }
    .flow-step-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 14px 16px; width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer;
      font-family: var(--sans); color: var(--ink);
    }
    .flow-step-head .kicker {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin-bottom: 4px;
    }
    .flow-step-head h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0; }
    .flow-step-head .summary { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
    .flow-step-head .chev { font-size: 18px; color: var(--ink-soft); line-height: 1; padding-top: 4px; }
    .flow-step.is-open .flow-step-head { border-bottom: 1px solid var(--line); background: var(--paint-wash); }
    .flow-step-body { display: none; padding: 16px; }
    .flow-step.is-open .flow-step-body { display: block; }
    .flow-step .step-lede { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 14px; }
    .flow-nav {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
      margin: 0; padding: 12px 0; border: 0 solid var(--line);
    }
    .flow-nav-top { margin: 0 0 14px; padding-bottom: 12px; border-bottom-width: 1px; }
    .flow-nav-bottom { margin: 16px 0 0; padding-top: 12px; border-top-width: 1px; }

    .section-block {
      border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; background: var(--white-warm); overflow: hidden;
    }
    .section-block-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px 14px; background: #fff; border-bottom: 1px solid var(--line);
    }
    .section-block-head .title {
      font-family: var(--serif); font-weight: 500; font-size: 18px; letter-spacing: 0.02em;
    }
    .section-block-head .meta {
      font-size: 12px; font-weight: 600; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 8px;
    }
    .section-block-head .chip {
      display: inline-block; padding: 3px 8px; border-radius: 999px; background: var(--paint-wash); font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .section-block-body { padding: 4px 14px 10px; }
    .section-block .dish-row:last-child { border-bottom: 0; }
    .section-add-row {
      display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px;
      padding: 10px 0 4px; margin-top: 4px;
      border-top: 1px dashed var(--line);
    }
    .section-add-row .soft { font-size: 13px; padding: 8px 12px; }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .history-day { margin: 0 0 18px; }
    .history-day h3 {
      font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0 0 8px;
      padding-bottom: 6px; border-bottom: 1px solid var(--line);
    }
    .history-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .history-row:last-child { border-bottom: 0; }
    .history-row .who { font-weight: 700; font-size: 15px; }
    .history-row .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .history-row .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .catalogue-filters {
      display: grid; gap: 10px; margin: 0 0 4px;
    }
    @media (min-width: 640px) {
      .catalogue-filters { grid-template-columns: minmax(0, 1.4fr) minmax(140px, 220px); align-items: end; }
    }
    .catalogue-filters .field { margin-top: 0; }
    .owner-extras-grid {
      display: grid; gap: 10px; margin: 10px 0 0;
    }
    @media (min-width: 640px) {
      .owner-extras-grid { grid-template-columns: 1fr 1fr; }
    }
    .owner-extras-grid .field { margin-top: 0; }
    .owner-extras-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .owner-extras-row input, .owner-extras-row select { flex: 1 1 140px; min-width: 0; }
    .owner-extras-list { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
    .owner-extras-list li {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 4px 0;
    }
    .spell-hints {
      margin: 4px 0 8px; padding: 8px 10px; background: #fff8e8; border: 1px solid #e4d9cc;
      border-radius: 10px; font-size: 13px;
    }
    .spell-hints[hidden] { display: none !important; }
    .spell-hints strong { font-weight: 700; }
    .spell-hints button.link { margin-left: 8px; }
    .spell-gate-list { list-style: none; margin: 0 0 16px; padding: 0; }
    .spell-gate-item {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; background: #fff;
    }
    .spell-gate-item .dish { font-weight: 700; font-size: 14px; margin: 0 0 8px; }
    .spell-gate-item .line { font-size: 13.5px; line-height: 1.45; margin: 0 0 4px; }
    .spell-gate-item .line .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-right: 6px; }
    .spell-gate-item mark { background: #f4d8c8; color: inherit; padding: 0 2px; border-radius: 3px; }
    .spell-gate-item .picks { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13.5px; }
    .spell-gate-item .picks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .spell-gate-note { font-size: 13px; color: #8a3b2b; margin: 0 0 10px; min-height: 1.2em; }
    .catalogue-row {
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .catalogue-row:last-child { border-bottom: 0; }
    .catalogue-row .who { font-weight: 700; font-size: 15px; }
    .catalogue-row .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .catalogue-row .desc { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
    .catalogue-row details { margin-top: 8px; }
    .catalogue-row summary {
      cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
      letter-spacing: 0.03em; text-transform: uppercase;
    }
    .catalogue-hist {
      list-style: none; margin: 8px 0 0; padding: 0;
      display: flex; flex-direction: column; gap: 4px;
    }
    .catalogue-hist li {
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 13px; padding: 4px 0; border-bottom: 1px dotted var(--line);
    }
    .catalogue-hist li:last-child { border-bottom: 0; }
    .catalogue-hist .hp { font-weight: 700; }
    .catalogue-count { font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }
    .catalogue-row .catalogue-add {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px;
    }
    .catalogue-row .catalogue-add select {
      min-width: 140px; max-width: 220px; flex: 1 1 140px;
    }
    .catalogue-row .catalogue-add .go { flex: 0 0 auto; }
    .view-toggle { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .view-toggle button.on { background: var(--ink); color: var(--paint); border-color: var(--ink); }
    label.field { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin: 10px 0 4px; }
    .dish-form-layout { display: block; }
    .dish-form-inline {
      margin: 8px 0 14px; border: 1px solid var(--line);
    }
    .dish-row.is-editing { background: rgba(255,255,255,.7); }
    .dish-suggest {
      border: 1px solid var(--line); border-radius: 14px; background: #fff;
      padding: 10px 12px; margin: 8px 0 4px;
    }
    .dish-suggest h4 {
      font-family: var(--serif); font-weight: 500; font-size: 16px; margin: 0 0 6px;
    }
    .dish-suggest .hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
    .dish-suggest-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: min(240px, 40vh); overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 900px) {
      .dish-suggest-list { max-height: 280px; }
    }
    .dish-suggest-item {
      display: block; width: 100%; text-align: left; border: 1px solid var(--line);
      background: #fff; border-radius: 10px; padding: 8px 10px; cursor: pointer;
      font-family: var(--sans); color: var(--ink);
    }
    .dish-suggest-item:hover, .dish-suggest-item:focus { border-color: var(--ink); outline: none; }
    .dish-suggest-item .sn { font-weight: 700; font-size: 13.5px; }
    .dish-suggest-item .sd { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
    .dish-suggest-item .sm { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
    .dish-suggest-empty { font-size: 12.5px; color: var(--ink-soft); }
    .main-pick-overlay {
      position: fixed; inset: 0; z-index: 40; background: rgba(28,22,16,.45);
      display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow: auto;
    }
    .main-pick-card {
      width: min(640px, 100%); background: #fff; border-radius: 16px; padding: 18px 16px;
      border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    .main-pick-list { max-height: 55vh; overflow: auto; margin: 10px 0 14px; }
    .main-pick-sec { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
      color: var(--ink-soft); margin: 12px 0 6px; }
    .main-pick-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0;
      border-bottom: 1px solid var(--line); font-size: 14px; }
    .main-pick-row:last-child { border-bottom: 0; }
    input[type=text], input[type=url], input[type=date], select, textarea {
      width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--white-warm); color: var(--ink);
    }
    textarea { min-height: 96px; resize: vertical; }
    .plan { border-radius: 12px; padding: 12px 14px; background: var(--paint-wash); margin-bottom: 10px; }
    .plan strong { font-family: var(--serif); font-weight: 500; font-size: 18px; display: block; }
    .plan.over { background: #fbeae6; }
    .plan.one, .plan.two, .plan.two-up { background: #e8f0e4; }
    .note { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
    /* Generate-step plan preview — tidy sheet checklist, not a raw bullet dump */
    #preview .plan-meta {
      display: flex; flex-direction: column; gap: 6px;
      margin: 0 0 14px; padding: 10px 12px;
      background: var(--paint-wash); border-radius: 12px;
      font-size: 13px; color: var(--ink-soft); line-height: 1.45;
    }
    #preview .plan-meta p { margin: 0; }
    #preview .plan-meta strong { color: var(--ink); font-weight: 700; font-family: var(--sans); font-size: 13px; }
    #preview .plan-sheet {
      border: 1px solid var(--line); border-radius: 12px; background: #fff;
      padding: 4px 0 2px; overflow: hidden;
    }
    #preview .plan-sec { padding: 10px 14px 8px; border-top: 1px solid var(--line); }
    #preview .plan-sec:first-child { border-top: 0; }
    #preview .plan-sec-title {
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-soft); font-weight: 700; margin: 0 0 8px;
    }
    #preview .plan-dish {
      display: grid; grid-template-columns: 1.15rem minmax(0, 1fr) auto;
      gap: 2px 8px; align-items: baseline; padding: 5px 0;
    }
    #preview .plan-dish + .plan-dish { border-top: 1px solid rgba(28,22,16,.06); }
    #preview .plan-lc {
      width: 1.15rem; height: 1.15rem; display: flex; align-items: center; justify-content: center;
      color: var(--green);
    }
    #preview .plan-lc .mark { width: 14px; height: 14px; margin: 0; vertical-align: 0; }
    #preview .plan-name { font-weight: 700; font-size: 14px; min-width: 0; line-height: 1.3; }
    #preview .plan-price { font-weight: 500; font-size: 13.5px; white-space:nowrap; color: var(--ink); }
    #preview .plan-desc {
      grid-column: 2 / 3; font-size: 12.5px; color: var(--ink-soft);
      line-height: 1.35; margin: 0;
    }
    #preview .plan-tags {
      color: var(--green); font-style: italic; font-weight: 400; font-size: 12.5px;
      white-space: nowrap;
    }
    #preview .plan-from {
      grid-column: 2 / -1; font-size: 11px; color: var(--ink-soft); font-weight: 600;
    }
    #preview .plan-empty { padding: 16px 14px; color: var(--ink-soft); font-size: 13px; }
    .include-box { background: var(--paint-wash); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .include-box h3 { font-family: var(--serif); font-weight: 500; font-size: 17px; margin-bottom: 6px; }
    .outside-text-box {
      border: 1px solid var(--paint-deep);
      background: linear-gradient(180deg, #fff 0%, var(--paint-wash) 100%);
    }
    .outside-text-box > h3 { font-size: 20px; margin-bottom: 8px; }
    .include-row { display: flex; flex-wrap: wrap; gap: 10px 14px; }
    .include-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .complete-head {
      display: none;
    }
    @media (min-width: 640px) {
      .complete-head { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: end; margin: 8px 0; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
    }
    .ticks-head { display: grid; grid-template-columns: repeat(5, 40px); gap: 4px; text-align: center; }
    .dish-row {
      display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; align-items: start;
      padding: 12px 0; border-bottom: 1px solid var(--line);
      transition: opacity .22s ease, transform .28s ease, max-height .3s ease, padding .28s ease, margin .28s ease, border-width .28s ease;
    }
    @media (min-width: 640px) {
      .dish-row { grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; }
    }
    .dish-row.dish-row-melt {
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
      max-height: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      margin: 0 !important;
      border-bottom-width: 0 !important;
      overflow: hidden;
      pointer-events: none;
    }
    .dish-row .name { font-weight: 700; font-size: 15px; }
    .dish-row .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .dish-row .tag { color: var(--green); font-style: italic; font-size: 13px; }
    .dish-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
    .dish-actions .dish-del { color: #8a3d28; white-space: nowrap; }
    .dish-row select.section-pick, .form-card select#section {
      display: block; width: 100%; max-width: 220px; margin-top: 4px;
      font: 600 13px var(--sans); padding: 7px 10px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--paint-wash); color: var(--ink);
    }
    .layout-grid { display: flex; flex-direction: column; gap: 8px; }
    .layout-head, .layout-row {
      display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr) minmax(0,0.7fr);
      gap: 8px; align-items: center;
    }
    .layout-head { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
    .layout-name { font-weight: 700; font-size: 13.5px; }
    .layout-row select {
      font: 600 12.5px var(--sans); padding: 7px 8px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; color: var(--ink); width: 100%;
    }
    @media (max-width: 560px) {
      .layout-head { display: none; }
      .layout-row { grid-template-columns: 1fr; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    }
    .dish-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .dish-actions select {
      width: auto; min-width: 7.5rem; padding: 8px 10px; font-size: 13px; font-weight: 600; background: #fff;
    }
    .ticks { display: grid; grid-template-columns: repeat(5, 40px); gap: 4px; justify-items: center; }
    .ticks label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; min-height: 44px; justify-content: center; }
    .ticks .letter { color: var(--green); font-style: italic; font-size: 12px; }
    .section-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 14px; font-weight: 700; }
    .mark { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
    .opt-row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
    .opt-row label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-soft); font-weight: 600; cursor: pointer; }
    .bank-item { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; }
    .bank-item .name { font-weight: 700; }
    .bank-item .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .from { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
    .form-card { background: var(--paint-wash); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .form-card h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin-bottom: 4px; }
    .generate-bar {
      position: sticky; bottom: 0; z-index: 8; margin: 8px -16px -16px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(251,248,242,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    }
    .generate-bar .bar-inner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .generate-bar .bar-copy { flex: 1 1 200px; font-size: 13px; color: var(--ink-soft); }
    .generate-bar .bar-copy strong { color: var(--ink); font-family: var(--serif); font-weight: 500; font-size: 16px; display: block; }
    .generate-bar .bar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .date-field { display: grid; grid-template-columns: 1fr 3rem; gap: 8px; align-items: stretch; }
    .date-field input[type=date] {
      width: 100%; min-width: 0; padding: 8px 4px; cursor: pointer; min-height: 44px;
    }
    .date-field input[type=text] { min-height: 44px; }
    details.more > summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-soft); list-style: none; }
    details.more > summary::-webkit-details-marker { display: none; }
    @media print {
      .ps-header, .lede, .menus, .generate-bar, .no-print, .dish-actions, .toolbar-row { display: none !important; }
      .flow-step { border: 0; padding: 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <header class="ps-header">
    <div class="ps-header-inner">
      <div>
        <div class="ps-venue-eyebrow">The Eight Bells · Bolney</div>
        <div class="ps-venue-name">Menus</div>
      </div>
    </div>
  </header>
  <main>
    <h1>Menus</h1>
    <p class="lede" id="pageLede">A short flow: load dishes, set how each section sits on the sheet, pick wording, then generate. One step at a time — like block management on Varlo.</p>
    <script>
      // Early lede for staff (full boot script sets the rest); avoids owner copy flash.
      (function () {
        if (/(?:\?|&)mode=staff(?:&|$)/.test(String(location.search || ''))) {
          var el = document.getElementById('pageLede');
          if (el) el.textContent = 'Upload or edit dishes, clear when needed, then generate. Same menus as the owner page — kept simple for the floor.';
        }
      })();
    </script>
    <div class="view-toggle no-print" id="viewToggle" role="tablist" aria-label="Menus view">
      <button type="button" class="soft on" data-view="edit" id="viewEdit">Edit &amp; generate</button>
      <button type="button" class="soft" data-view="blocks" id="viewBlocks">Blocks &amp; text</button>
      <button type="button" class="soft" data-view="panels" id="viewPanels">Feature panels</button>
      <button type="button" class="soft" data-view="catalogue" id="viewCatalogue">All dishes</button>
      <button type="button" class="soft" data-view="history" id="viewHistory">Print history</button>
      <button type="button" class="soft" id="doSyncNow" title="Reload shared menus from the cloud">Sync now</button>
      <a class="soft" href="menus-guide.html" target="_blank" rel="noopener" id="viewGuide" style="text-decoration:none;display:inline-flex;align-items:center">Quick guide</a>
    </div>
    <div class="menus no-print" id="menuPicker" role="tablist" aria-label="Which menu"></div>
    <div id="editor"></div>
  </main>
  <script src="menus.js?v=20261009-flow188"></script>
  <script src="menus-print.js?v=20261009-flow188"></script>
  <script src="menus-ingest.js?v=20261009-flow188"></script>
  <script>
    if (window.parent !== window) document.documentElement.classList.add('iframed');

    // Staff / manager entry: menus-staff.html (stable URL) → menus.html?mode=staff&v=<flow from these tags>.
    // Eight Bells manager hub opens staff mode — same cloud book, shorter UI.
    var isStaffMode = /(?:\?|&)mode=staff(?:&|$)/.test(String(location.search || ''));
    if (isStaffMode) document.documentElement.classList.add('staff-mode');

    var STORAGE = 'eb-menus-v2';
    var META_STORAGE = 'eb-menus-meta-v1';
    var PROMO_STORAGE = 'eb-menu-promo-bank-v1';
    var PROMO_TICKS = 'eb-menu-promo-ticks-v1';
    var LAYOUT_STORAGE = 'eb-menu-section-layout-v2';
    var LAYOUT_STORAGE_LEGACY = 'eb-menu-section-layout-v1';
    var CATALOGUE_STORAGE = 'eb-dish-catalogue-v1';
    var EXTRAS_STORAGE = 'eb-menus-extras-v1';
    var CLOUD_AT_KEY = 'eb-menus-cloud-updated-at';
    applyExtrasFromStorage();
    var book = load();
    var metaBook = loadMeta();
    var promoBank = loadPromoBank();
    var promoTicks = loadPromoTicks();
    var layoutBook = loadSectionLayoutBook();
    var dishCatalogue = loadDishCatalogue();
    var menuId = isStaffMode ? 'specials' : 'main';
    var mode = 'complete';
    var dishId = '';
    var includes = loadIncludes();
    ensureExtraMenuStores();
    var pendingReview = null;
    var editingPromoId = '';
    var pendingAddSection = ''; // Add from a subcategory → pre-fill Section
    var pendingScroll = null;   // { y, section } — keep place after save / cancel
    var flowStep = 1; // staff: 1 dishes · 2 generate · owner: + blocks + wording
    var viewMode = 'edit'; // edit | panels | catalogue | history
    var historyFilter = 'all';
    var historyCache = [];
    var historyShowArchive = false;
    var lastHistoryPaintOpts = { cloudOk: true, updating: false };
    var catalogueQuery = '';
    var catalogueSection = 'all';
    var catalogueAddMenuId = '';
    var cloudUpdatedAt = (function () {
      try { return parseInt(localStorage.getItem(CLOUD_AT_KEY) || '0', 10) || 0; }
      catch (e) { return 0; }
    })();
    var cloudPushTimer = null;
    var cloudSyncNote = '';
    var cloudPullDone = false;

    // Preview Save → stamp history, then jump here so staff can Print PDF / Email.
    // One history refresh for the saver; other devices pick it up on next open/return.
    window.EBMenusOnPrintSaved = function () {
      viewMode = 'history';
      lastHistoryPaintKey_ = '';
      try { window.focus(); } catch (e) {}
      render();
    };

    // Manager: day-to-day printables (owner keeps Party / Lunch club).
    // Little Bells is included so Sunday/Main can tick the kids menu onto the sheet.
    var STAFF_MENU_IDS = ['specials', 'main', 'main-next', 'sunday', 'sandwiches', 'desserts', 'little-bells'];

    var FLOW_STEPS = isStaffMode
      ? [
          { id: 1, key: 'dishes', label: 'Dishes' },
          { id: 2, key: 'generate', label: 'Generate' }
        ]
      : [
          { id: 1, key: 'dishes', label: 'Dishes' },
          { id: 2, key: 'blocks', label: 'Blocks' },
          { id: 3, key: 'wording', label: 'Wording' },
          { id: 4, key: 'generate', label: 'Generate' }
        ];

    function visibleMenus() {
      return EBMenus.MENUS.filter(function (m) {
        if (!isStaffMode) return true;
        if (STAFF_MENU_IDS.indexOf(m.id) !== -1) return true;
        return !!(m.custom && m.kind !== 'party' && m.staff !== false);
      });
    }

    function staffCanSeeMenu(m) {
      if (!m) return false;
      if (STAFF_MENU_IDS.indexOf(m.id) !== -1) return true;
      return !!(m.custom && m.kind !== 'party' && m.staff !== false);
    }

    function extrasFromStorage() {
      try {
        var raw = JSON.parse(localStorage.getItem(EXTRAS_STORAGE) || 'null');
        if (raw && typeof raw === 'object') return raw;
      } catch (e) {}
      return { sections: [], menus: [] };
    }

    function applyExtrasFromStorage() {
      if (!window.EBMenus || typeof EBMenus.applyExtras !== 'function') return;
      var raw = extrasFromStorage();
      EBMenus.applyExtras({
        sections: raw.sections || [],
        menus: raw.menus || []
      });
    }

    function currentExtrasState() {
      if (EBMenus.extrasState) return EBMenus.extrasState();
      return extrasFromStorage();
    }

    function ensureExtraMenuStores() {
      var extras = currentExtrasState();
      (extras.menus || []).forEach(function (m) {
        if (!book[m.id]) book[m.id] = [];
        if (!layoutBook[m.id] && EBMenus.defaultSectionLayout) {
          layoutBook[m.id] = EBMenus.defaultSectionLayout();
        }
        if (m.kind === 'party' && !metaBook[m.id] && EBMenus.emptyMeta) {
          metaBook[m.id] = EBMenus.emptyMeta();
        }
      });
    }

    function loadSectionLayoutBook() {
      try {
        if (!window.EBMenus || typeof EBMenus.normalizeSectionLayoutBook !== 'function') {
          return (EBMenus && EBMenus.defaultSectionLayoutBook) ? EBMenus.defaultSectionLayoutBook() : {};
        }
        var raw = null;
        try { raw = JSON.parse(localStorage.getItem(LAYOUT_STORAGE) || 'null'); } catch (e0) { raw = null; }
        if (raw == null) {
          try { raw = JSON.parse(localStorage.getItem(LAYOUT_STORAGE_LEGACY) || 'null'); } catch (e1) { raw = null; }
        }
        return EBMenus.normalizeSectionLayoutBook(raw);
      } catch (e) {
        try {
          return (window.EBMenus && EBMenus.defaultSectionLayoutBook) ? EBMenus.defaultSectionLayoutBook() : {};
        } catch (e2) {
          return {};
        }
      }
    }
    /** Blocks rules for one menu (Main / Sunday / … each have their own). */
    function layoutFor(id) {
      var key = id || menuId;
      if (!layoutBook[key]) {
        layoutBook[key] = EBMenus.defaultSectionLayout
          ? EBMenus.defaultSectionLayout()
          : {};
      }
      return layoutBook[key];
    }
    /**
     * Layout used when printing a sheet: this menu’s Blocks width / frilly box.
     * Specials-card board notes follow onto Main/Sunday; Column / Full / Best fit
     * stay whatever this sheet set in Blocks (the card’s default Full must not
     * wipe a Column lock and stretch Specials over Sandwiches).
     */
    function effectiveSectionLayout(id) {
      var key = id || menuId;
      var base = EBMenus.normalizeSectionLayout
        ? EBMenus.normalizeSectionLayout(layoutFor(key))
        : layoutFor(key);
      if (key === 'specials') return base;
      if (EBMenus.overlaySpecialsBoardNotes) {
        return EBMenus.overlaySpecialsBoardNotes(base, layoutBook.specials);
      }
      var specials = layoutBook.specials;
      if (specials && key !== 'specials') {
        var noteSecs = (EBMenus.SPECIALS_SECTIONS) || ['Special Starters', 'Special Mains', 'Special Desserts'];
        noteSecs.forEach(function (sec) {
          if (!specials[sec] || !base[sec]) return;
          base[sec] = Object.assign({}, base[sec], {
            note: String(specials[sec].note != null ? specials[sec].note : (base[sec].note || ''))
          });
        });
      }
      return base;
    }
    function saveSectionLayout() {
      localStorage.setItem(LAYOUT_STORAGE, JSON.stringify(layoutBook));
      queueCloudPush();
    }

    function loadPromoBank() {
      try {
        if (!window.EBMenus || typeof EBMenus.normalizePromoBank !== 'function') {
          return (EBMenus && EBMenus.seedPromoBank) ? EBMenus.seedPromoBank() : [];
        }
        var raw = JSON.parse(localStorage.getItem(PROMO_STORAGE) || 'null');
        return EBMenus.normalizePromoBank(raw);
      } catch (e) {
        try {
          return (window.EBMenus && EBMenus.seedPromoBank) ? EBMenus.seedPromoBank() : [];
        } catch (e2) {
          return [];
        }
      }
    }
    function savePromoBank() {
      localStorage.setItem(PROMO_STORAGE, JSON.stringify(promoBank));
      queueCloudPush();
    }
    function loadPromoTicks() {
      try { return JSON.parse(localStorage.getItem(PROMO_TICKS) || '{}') || {}; }
      catch (e) { return {}; }
    }
    function savePromoTicks() {
      localStorage.setItem(PROMO_TICKS, JSON.stringify(promoTicks));
      queueCloudPush();
    }
    function hostPromoTicks() {
      return (promoTicks[menuId] && typeof promoTicks[menuId] === 'object') ? promoTicks[menuId] : {};
    }
    function pickedPromosForSheet() {
      if (!window.EBMenus || typeof EBMenus.pickPromos !== 'function') return [];
      var menu = EBMenus.menuById(menuId);
      var max = menu && menu.kind === 'party' ? 2 : 5;
      return EBMenus.pickPromos(promoBank, hostPromoTicks(), { max: max });
    }
    function load() {
      try {
        var saved = JSON.parse(localStorage.getItem(STORAGE) || localStorage.getItem('eb-menus-v1') || 'null');
        if (saved && saved.main) {
          var seeded = EBMenus.seed();
          if (!saved.party) saved.party = seeded.party;
          return EBMenus.tidyBook ? EBMenus.tidyBook(saved) : saved;
        }
      } catch (e) {}
      return EBMenus.seed();
    }
    function loadMeta() {
      try {
        var raw = JSON.parse(localStorage.getItem(META_STORAGE) || '{}') || {};
        var out = {};
        Object.keys(raw).forEach(function (k) {
          out[k] = EBMenus.normalizeMeta ? EBMenus.normalizeMeta(raw[k]) : raw[k];
        });
        return out;
      } catch (e) { return {}; }
    }
    function loadDishCatalogue() {
      try {
        var raw = JSON.parse(localStorage.getItem(CATALOGUE_STORAGE) || '[]');
        var list = EBMenus.normalizeDishCatalogue ? EBMenus.normalizeDishCatalogue(raw) : (Array.isArray(raw) ? raw : []);
        // First visit: seed catalogue from whatever menus are already on this device.
        if (!list.length && book) {
          list = EBMenus.upsertDishCatalogueFromBook
            ? EBMenus.upsertDishCatalogueFromBook([], book, { date: EBMenus.isoDateToday() })
            : list;
        }
        return list;
      } catch (e) {
        return [];
      }
    }
    function saveLocalOnly() {
      localStorage.setItem(STORAGE, JSON.stringify(book));
      localStorage.setItem(META_STORAGE, JSON.stringify(metaBook));
      localStorage.setItem(STORAGE + '-includes', JSON.stringify(includes));
      localStorage.setItem(PROMO_STORAGE, JSON.stringify(promoBank));
      localStorage.setItem(PROMO_TICKS, JSON.stringify(promoTicks));
      localStorage.setItem(LAYOUT_STORAGE, JSON.stringify(layoutBook));
      try {
        localStorage.setItem(CATALOGUE_STORAGE, JSON.stringify(dishCatalogue || []));
      } catch (eCat) {}
      try {
        localStorage.setItem(EXTRAS_STORAGE, JSON.stringify(currentExtrasState()));
      } catch (eEx) {}
      try { localStorage.setItem(CLOUD_AT_KEY, String(cloudUpdatedAt || 0)); } catch (e) {}
    }
    function save() {
      cloudUpdatedAt = Date.now();
      // Every menu save upserts dishes into the shared catalogue (deduped by title).
      if (EBMenus.upsertDishCatalogueFromBook) {
        dishCatalogue = EBMenus.upsertDishCatalogueFromBook(dishCatalogue, book, {
          date: EBMenus.isoDateToday()
        });
      }
      saveLocalOnly();
      queueCloudPush();
    }
    function buildCloudState() {
      return {
        updatedAt: cloudUpdatedAt || Date.now(),
        book: book,
        metaBook: metaBook,
        includes: includes,
        promoBank: promoBank,
        promoTicks: promoTicks,
        // Per-menu Blocks book (main / sunday / …). Legacy flat maps migrate on load.
        sectionLayout: layoutBook,
        dishCatalogue: dishCatalogue || [],
        extraMenus: (currentExtrasState().menus) || [],
        extraSections: (currentExtrasState().sections) || []
      };
    }
    function applyCloudState(state) {
      if (!state || !state.book || typeof state.book !== 'object') return false;
      var hasDish = false;
      Object.keys(state.book).forEach(function (k) {
        if (Array.isArray(state.book[k]) && state.book[k].length) hasDish = true;
      });
      if (!hasDish) return false;
      if (EBMenus.applyExtras && (Array.isArray(state.extraMenus) || Array.isArray(state.extraSections))) {
        EBMenus.applyExtras({
          sections: state.extraSections,
          menus: state.extraMenus
        });
      }
      book = EBMenus.tidyBook ? EBMenus.tidyBook(state.book) : state.book;
      if (!book.main) {
        var seeded = EBMenus.seed();
        if (!book.party) book.party = seeded.party;
      }
      metaBook = {};
      var rawMeta = state.metaBook && typeof state.metaBook === 'object' ? state.metaBook : {};
      Object.keys(rawMeta).forEach(function (k) {
        metaBook[k] = EBMenus.normalizeMeta ? EBMenus.normalizeMeta(rawMeta[k]) : rawMeta[k];
      });
      includes = state.includes && typeof state.includes === 'object' ? state.includes : {};
      promoBank = EBMenus.normalizePromoBank
        ? EBMenus.normalizePromoBank(state.promoBank)
        : (Array.isArray(state.promoBank) ? state.promoBank : promoBank);
      promoTicks = state.promoTicks && typeof state.promoTicks === 'object' ? state.promoTicks : {};
      layoutBook = EBMenus.normalizeSectionLayoutBook
        ? EBMenus.normalizeSectionLayoutBook(state.sectionLayout)
        : (state.sectionLayout && typeof state.sectionLayout === 'object' ? state.sectionLayout : layoutBook);
      // Merge remote catalogue with local so neither side wipes the other.
      if (EBMenus.mergeDishCatalogues) {
        dishCatalogue = EBMenus.mergeDishCatalogues(dishCatalogue, state.dishCatalogue || []);
      } else if (Array.isArray(state.dishCatalogue)) {
        dishCatalogue = state.dishCatalogue;
      }
      cloudUpdatedAt = Number(state.updatedAt) || Date.now();
      ensureExtraMenuStores();
      saveLocalOnly();
      if (!book[menuId] || !book[menuId].length) {
        menuId = 'main';
      }
      dishId = (dishes()[0] && dishes()[0].id) || '';
      return true;
    }
    function queueCloudPush() {
      if (cloudPushTimer) clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(function () {
        cloudPushTimer = null;
        pushMenusToCloud();
      }, 600);
    }
    function pushMenusToCloud() {
      if (!window.EBMenuIngest || typeof EBMenuIngest.cloudPost !== 'function') {
        return Promise.resolve(false);
      }
      cloudSyncNote = 'Saving to cloud…';
      return EBMenuIngest.cloudPost({
        action: 'saveMenusState',
        state: buildCloudState()
      }).then(function (data) {
        if (data && data.updatedAt) cloudUpdatedAt = Number(data.updatedAt) || cloudUpdatedAt;
        try { localStorage.setItem(CLOUD_AT_KEY, String(cloudUpdatedAt || 0)); } catch (e) {}
        cloudSyncNote = 'Menus synced across devices';
        return true;
      }).catch(function () {
        cloudSyncNote = 'Saved on this device only (cloud unreachable)';
        return false;
      });
    }
    function pullMenusFromCloud() {
      if (!window.EBMenuIngest || typeof EBMenuIngest.cloudPost !== 'function') {
        cloudPullDone = true;
        return Promise.resolve(false);
      }
      cloudSyncNote = 'Loading shared menus…';
      return EBMenuIngest.cloudPost({ action: 'getMenusState' }).then(function (data) {
        var remote = data && data.state;
        var remoteAt = remote ? (Number(remote.updatedAt) || 0) : 0;
        // Last-write-wins by updatedAt — so Save on this device is not wiped
        // by an older cloud copy a moment later (focus / Sync / tab return).
        if (remote && remoteAt > cloudUpdatedAt) {
          if (applyCloudState(remote)) {
            cloudSyncNote = 'Menus synced across devices';
            cloudPullDone = true;
            render();
            return true;
          }
        }
        if (remote && remoteAt && remoteAt < cloudUpdatedAt) {
          // This device has newer edits — push them so phone/PC stay aligned.
          return pushMenusToCloud().then(function () {
            cloudSyncNote = 'Uploaded this device’s latest edits';
            cloudPullDone = true;
            return true;
          });
        }
        if ((!remote || !remoteAt) && cloudUpdatedAt > 0) {
          // Empty cloud — seed once from this device.
          return pushMenusToCloud().then(function () {
            cloudPullDone = true;
            return true;
          });
        }
        cloudSyncNote = remoteAt ? 'Menus synced across devices' : 'Shared menus ready';
        cloudPullDone = true;
        return false;
      }).catch(function () {
        cloudSyncNote = 'Using menus on this device (cloud unreachable)';
        cloudPullDone = true;
        return false;
      });
    }

    function refreshAfterSync_() {
      if (viewMode === 'history') renderHistory();
      else if (viewMode === 'catalogue') renderCatalogue();
      else if (viewMode === 'panels') renderFeaturePanels();
      else if (viewMode === 'blocks') renderBlocksHub();
      else render();
    }

    /** Force every device onto the same cloud book + print history. */
    function syncNowFromCloud() {
      cloudSyncNote = 'Syncing shared menus…';
      cloudPullDone = false;
      // Keep whatever is already on screen (local dishes / print list).
      // iOS may not finish the cloud read until a tap — blanking the panel
      // makes the page look stuck. Do not call renderHistory here (that
      // would start a second cloud sync).
      if (viewMode === 'history' && historyCache && historyCache.length) {
        paintHistoryRows_(historyCache, { cloudOk: true, updating: true });
      } else if (viewMode !== 'history') {
        render();
      }
      return pullMenusFromCloud().then(function (pulled) {
        var uploadMenus = Promise.resolve(pulled);
        // If cloud is still empty, upload this device’s book so others can see it.
        if (!pulled && (book.sunday || book.main || book.specials)) {
          cloudUpdatedAt = Date.now();
          uploadMenus = pushMenusToCloud().then(function () { return true; });
        }
        return uploadMenus.then(function () {
          // Phone has Sunday sheets locally — push them so the pub PC can see them.
          if (!EBMenuPrint || typeof EBMenuPrint.syncPrintHistoryToCloud !== 'function') {
            return { uploaded: 0 };
          }
          cloudSyncNote = 'Sharing print history across devices…';
          if (viewMode !== 'history') render();
          return EBMenuPrint.syncPrintHistoryToCloud();
        }).then(function (hist) {
          var n = (hist && hist.uploaded) || 0;
          var repaired = (hist && hist.repaired) || 0;
          var dropped = (hist && hist.orphansDropped) || 0;
          if (n > 0) {
            cloudSyncNote = 'Shared ' + n + ' print sheet' + (n === 1 ? '' : 's') +
              (repaired ? ' (repaired ' + repaired + ' for download)' : '') +
              (dropped ? '; cleared ' + dropped + ' incomplete' : '') +
              ' — same list on every device';
          } else if (dropped > 0) {
            cloudSyncNote = 'Print history cleaned (' + dropped +
              ' incomplete sheet' + (dropped === 1 ? '' : 's') +
              ' removed) — same list on every device';
          } else {
            cloudSyncNote = 'Menus and print history synced across devices';
          }
          refreshAfterSync_();
          return true;
        }).catch(function (err) {
          cloudSyncNote = 'Could not sync — try Sync now again (' +
            (err && err.message ? err.message : 'error') + ')';
          refreshAfterSync_();
          return false;
        });
      });
    }
    function loadIncludes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE + '-includes') || '{}') || {};
      } catch (e) { return {}; }
    }
    function dishes() { return book[menuId] || (book[menuId] = []); }
    function hostIncludes() {
      var out = {};
      EBMenus.includableMenus(menuId).forEach(function (m) {
        out[m.id] = !!(includes[menuId] && includes[menuId][m.id]);
      });

      var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));

      try {
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

      if (/^\d/.test(s)) return '£' + s;

        if (item.description) {
          html += '<div class="desc">' + escapeAttr(item.description) + '</div>';
        }
        if (hist.length) {
          html += '<details>';
          html += '<summary>Price history (' + hist.length + ')</summary>';
          html += '<ul class="catalogue-hist">';
          hist.forEach(function (h) {
            html += '<li><span>' + escapeAttr(formatCatalogueDate(h.date)) +
              '</span><span class="hp">' + escapeAttr(formatCataloguePrice(h.price)) + '</span></li>';
          });
          html += '</ul></details>';
        }
        html += '<div class="catalogue-add">';
        html += '<select class="catalogue-target" aria-label="Add to which menu" data-catalogue-target>';
        menus.forEach(function (m) {
          html += '<option value="' + escapeAttr(m.id) + '"' +
            (m.id === defaultTarget ? ' selected' : '') + '>' + escapeAttr(m.name) + '</option>';
        });
        html += '</select>';
        html += '<button type="button" class="go" data-catalogue-add="' +
          escapeAttr(item.key || '') + '">Add to menu</button>';
        html += '</div>';
        html += '</div>';
      });
      el.innerHTML = html;
      bindCatalogue();
    }

    function addCatalogueDishToMenu(entry, targetMenuId) {
      if (!entry || !entry.name) return { ok: false, error: 'Missing dish' };
      var tid = String(targetMenuId || '').trim();
      var menuMeta = EBMenus.menuById ? EBMenus.menuById(tid) : null;
      if (!tid || !menuMeta) return { ok: false, error: 'Pick a menu' };
      if (!book[tid]) book[tid] = [];
      var list = book[tid];
      var key = entry.key || (EBMenus.dishCatalogueKey && EBMenus.dishCatalogueKey(entry.name)) || '';
      if (key) {
        var dup = list.some(function (d) {
          var k = EBMenus.dishCatalogueKey ? EBMenus.dishCatalogueKey(d.name) : '';
          return k && k === key;
        });
        if (dup) {
          return {
            ok: false,
            error: 'Already on ' + (menuMeta.name || tid),
            duplicate: true,
            menuName: menuMeta.name || tid
          };
        }
      }
      var section = EBMenus.sectionForTargetMenu
        ? EBMenus.sectionForTargetMenu(entry.section, entry.name, entry.description, tid)
        : (entry.section || 'Mains');
      var clone = EBMenus.dishFromCatalogueEntry
        ? EBMenus.dishFromCatalogueEntry(entry, {
            menuId: tid,
            section: section,
            lunchClub: tid === 'lunch-club'
          })
        : EBMenus.tidyDishFields({
            id: 'cat-' + Date.now(),
            section: section,
            name: entry.name,
            description: entry.description || '',
            price: entry.price || '',
            tags: entry.tags || '',
            lunchClub: tid === 'lunch-club'
          });
      list.push(clone);
      if (EBMenus.sortDishesBySection) book[tid] = EBMenus.sortDishesBySection(list);
      save();
      return {
        ok: true,
        menuId: tid,
        menuName: menuMeta.name || tid,
        section: clone.section || section,
        name: clone.name
      };
    }

    function bindCatalogue() {
      var searchEl = document.getElementById('catalogueSearch');
      var secEl = document.getElementById('catalogueSection');
      var timer = null;
      function refreshFromFilters() {
        catalogueQuery = searchEl ? String(searchEl.value || '') : '';
        catalogueSection = secEl ? String(secEl.value || 'all') : 'all';
        renderCatalogue();
        var again = document.getElementById('catalogueSearch');
        if (again) {
          try {
            again.focus();
            var len = again.value.length;
            again.setSelectionRange(len, len);
          } catch (e) {}
        }
      }
      if (searchEl) {
        searchEl.oninput = function () {
          clearTimeout(timer);
          timer = setTimeout(refreshFromFilters, 160);
        };
        searchEl.onkeydown = function (ev) {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            clearTimeout(timer);
            refreshFromFilters();
          }
        };
      }
      if (secEl) {
        secEl.onchange = function () {
          clearTimeout(timer);
          refreshFromFilters();
        };
      }
      document.querySelectorAll('[data-catalogue-target]').forEach(function (sel) {
        sel.onchange = function () {
          catalogueAddMenuId = String(sel.value || '');
          // Keep every row’s dropdown in sync with the last choice.
          document.querySelectorAll('[data-catalogue-target]').forEach(function (other) {
            if (other !== sel) other.value = catalogueAddMenuId;
          });
        };
      });
      document.querySelectorAll('[data-catalogue-add]').forEach(function (btn) {
        btn.onclick = function () {
          var key = btn.getAttribute('data-catalogue-add');
          var row = btn.closest ? btn.closest('.catalogue-row') : null;
          var sel = row ? row.querySelector('[data-catalogue-target]') : null;
          var target = sel ? String(sel.value || '') : catalogueAddMenuId;
          catalogueAddMenuId = target;
          var entry = (dishCatalogue || []).filter(function (e) {
            return e && e.key === key;
          })[0];
          if (!entry) {
            alert('That dish is missing from the catalogue.');
            return;
          }
          var res = addCatalogueDishToMenu(entry, target);
          if (!res.ok) {
            alert(res.error || 'Could not add dish.');
            return;
          }
          var label = btn.textContent;
          btn.textContent = 'Added';
          btn.disabled = true;
          btn.title = 'Added to ' + res.menuName + ' · ' + (res.section || '');
          setTimeout(function () {
            btn.disabled = false;
            btn.textContent = label || 'Add to menu';
          }, 1400);
        };
      });
    }

    function renderPicker() {
      var box = document.getElementById('menuPicker');
      box.innerHTML = '';
      var menus = visibleMenus();
      if (isStaffMode && !menus.some(function (m) { return m.id === menuId; })) {
        menuId = (menus[0] && menus[0].id) || 'specials';
      }
      menus.forEach(function (menu) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', menu.id === menuId ? 'true' : 'false');
        b.textContent = menu.name;
        b.className = menu.id === menuId ? 'on' : '';
        b.onclick = function () {
          menuId = menu.id;
          dishId = (dishes()[0] && dishes()[0].id) || '';
          if (mode === 'adjust' || mode === 'replace' || mode === 'add' || mode === 'paste') mode = 'complete';
          editingPromoId = '';
          flowStep = 1;
          render();
        };
        box.appendChild(b);
      });
    }

    function currentDish() {
      var list = dishes();
      for (var i = 0; i < list.length; i++) if (list[i].id === dishId) return list[i];
      return null;
    }

    function renderEditor() {
      var menu = EBMenus.menuById(menuId);
      var el = document.getElementById('editor');
      var list = dishes();
      var html = '';
      var genStepId = isStaffMode ? 2 : 4;

      html += renderFlowRail(menu, list);

      // —— 1. Dishes ——
      html += flowStepShell(1, 'Dishes', menu.name,
        list.length
          ? (list.length + ' dish' + (list.length === 1 ? '' : 'es') + ' · ' + sectionCount(list) + ' sections')
          : (isStaffMode ? 'Empty — add dishes below' : 'Empty — upload or add dishes'),
        renderDishesStep(menu, list));

      if (!isStaffMode) {
        // —— 2. Blocks (section layout) ——
        html += flowStepShell(2, 'Blocks', 'Layout & text outside dishes',
          blockSummary(menu),
          renderBlocksStep(menu, list));

        // —— 3. Wording ——
        html += flowStepShell(3, 'Wording', 'Events & selling lines',
          wordingSummary(menu),
          renderWordingStep(menu));
      }

      // —— Generate (step 2 staff / step 4 owner) ——
      html += flowStepShell(genStepId, 'Generate', 'Print sheet',
        generateSummary(),
        renderGenerateStep(menu));

      el.innerHTML = html;
      var hint = document.getElementById('generateHint');
      if (hint) {
        var plan = composed().plan;
        hint.innerHTML = '<strong>' + escapeAttr(planTitle(plan.fit)) + '</strong>' + escapeAttr(plan.text || '');
      }
      bindEditor();
      if (!restorePendingScroll_()) {
        var open = document.getElementById('step-' + FLOW_STEPS[flowStep - 1].key);
        if (open && flowStep > 1) open.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function findSectionBlock_(section) {
      if (!section) return null;
      var found = null;
      document.querySelectorAll('.section-block[data-section]').forEach(function (n) {
        if (!found && n.getAttribute('data-section') === section) found = n;
      });
      return found;
    }

    function rememberScroll_(section, focusSel) {
      pendingScroll = {
        y: window.scrollY || window.pageYOffset || 0,
        section: section || '',
        focus: focusSel || ''
      };
    }

    /** Keep the same Blocks/dish card in view after a full innerHTML rebuild. */
    function restorePendingScroll_() {
      if (!pendingScroll) return false;
      var ps = pendingScroll;
      pendingScroll = null;
      var y = typeof ps.y === 'number' ? ps.y : 0;
      function apply() {
        window.scrollTo(0, y);
        var elSec = findSectionBlock_(ps.section);
        if (elSec) elSec.scrollIntoView({ block: 'nearest' });
        if (ps.focus) {
          var el = document.querySelector(ps.focus);
          if (el && typeof el.focus === 'function') {
            try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
          }
        }
      }
      requestAnimationFrame(function () { requestAnimationFrame(apply); });
      return true;
    }

    function sectionCount(list) {
      var seen = {};
      (list || []).forEach(function (d) { seen[d.section || ''] = true; });
      return Object.keys(seen).filter(Boolean).length;
    }

    function blockSummary(menu) {
      if (menu.kind !== 'long') return 'Card wording — text under / around the dishes';
      var custom = 0;
      var defaults = EBMenus.defaultSectionLayout();
      var rules = layoutFor(menu.id || menuId);
      EBMenus.SECTIONS.forEach(function (s) {
        var r = rules[s] || defaults[s];
        if (!defaults[s] || r.width !== defaults[s].width || !!r.frame !== !!defaults[s].frame) custom += 1;
      });
      return custom ? custom + ' custom rule' + (custom === 1 ? '' : 's') : 'Using defaults (mains/starters full, nibbles column…)';
    }

    function wordingSummary(menu) {
      if (menu.kind !== 'long') return 'Not used on card menus';
      var ticks = hostPromoTicks();
      var n = Object.keys(ticks).filter(function (k) { return ticks[k]; }).length;
      return n ? n + ' forced line' + (n === 1 ? '' : 's') : 'Auto-pick on Generate';
    }

    function generateSummary() {
      try {
        var plan = composed().plan;
        return planTitle(plan.fit);
      } catch (e) {
        return 'Ready when dishes are set';
      }
    }

    function renderFlowRail(menu, list) {
      var html = '<nav class="flow-rail no-print" aria-label="Menu flow">';
      FLOW_STEPS.forEach(function (s, i) {
        if (i) html += '<span class="flow-arrow" aria-hidden="true">→</span>';
        var cls = 'flow-pill';
        if (s.id === flowStep) cls += ' on';
        else if (s.id < flowStep) cls += ' done';
        html += '<button type="button" class="' + cls + '" data-flow-step="' + s.id + '">';
        html += '<span class="num">' + (s.id < flowStep ? '✓' : s.id) + '</span> ' + escapeAttr(s.label);
        html += '</button>';
      });
      html += '</nav>';
      return html;
    }

    function flowStepShell(id, kicker, title, summary, bodyHtml) {
      var open = flowStep === id;
      var html = '<section class="flow-step ' + (open ? 'is-open' : 'is-collapsed') + '" id="step-' + FLOW_STEPS[id - 1].key + '">';
      html += '<button type="button" class="flow-step-head" data-flow-step="' + id + '">';
      html += '<div><div class="kicker">' + id + ' · ' + escapeAttr(kicker) + '</div>';
      html += '<h2>' + escapeAttr(title) + '</h2>';
      html += '<div class="summary">' + escapeAttr(summary) + '</div></div>';
      html += '<span class="chev" aria-hidden="true">' + (open ? '▾' : '▸') + '</span>';
      html += '</button>';
      if (open) {
        html += '<div class="flow-step-body">' + bodyHtml + '</div>';
      }
      html += '</section>';
      return html;
    }

    function flowNav(prev, next, nextLabel, pos) {
      var cls = 'flow-nav no-print' + (pos === 'top' ? ' flow-nav-top' : ' flow-nav-bottom');
      var html = '<div class="' + cls + '">';
      if (prev) html += '<button type="button" class="soft" data-flow-step="' + prev + '">← Back</button>';
      else html += '<span></span>';
      if (next) html += '<button type="button" class="go" data-flow-step="' + next + '">' + escapeAttr(nextLabel || 'Continue') + ' →</button>';
      else html += '<span></span>';
      html += '</div>';
      return html;
    }

    /** Next/Back at top and bottom of each creation step. */
    function withFlowNav(innerHtml, prev, next, nextLabel) {
      return flowNav(prev, next, nextLabel, 'top') + (innerHtml || '') + flowNav(prev, next, nextLabel, 'bottom');
    }

    function renderDishesStep(menu, list) {
      var html = '';
      if (isStaffMode) {
        html += '<p class="step-lede">Upload or paste a menu, edit dishes, clear when you need a fresh start, then generate. Layout and event wording stay as the owner set them. Send a whole category (Sandwiches, Desserts, Little Bells, Specials) to its own menu in one go.</p>';
      } else {
        html += '<p class="step-lede">Upload a whole menu, or edit dishes in their section blocks. Each dish has a section dropdown — we auto-guess after extract. Send Sandwiches, Desserts, Little Bells or Specials to their own menu in one go (replaces that menu and removes them from this sheet).</p>';
      }

      if (!isStaffMode) html += renderOwnerExtrasBox();

      if (EBMenus.isMainSheet && EBMenus.isMainSheet(menu.id)) {
        html += renderMainPairBox(menu, list);
      }

      var extras = EBMenus.includableMenus(menuId);
      if (extras.length) {
        html += '<div class="include-box"><h3>Also put on this sheet</h3>';
        html += '<p class="note" style="margin:0 0 8px">Tick what you want on this print. If Generate says the sheet is too full, untick one dropped-in menu (Sandwiches, Desserts, Little Bells or Specials) and try again. Generate does not drop food off the page to make space.</p><div class="include-row">';
        extras.forEach(function (m) {
          // Staff: same menus they can open as tabs (incl. Little Bells kids on Main/Sunday)
          if (isStaffMode && !staffCanSeeMenu(m)) return;
          var on = !!(includes[menuId] && includes[menuId][m.id]);
          var label = m.id === 'little-bells' ? 'Little Bells (kids)' : m.name;
          html += '<label><input type="checkbox" data-include="' + m.id + '"' + (on ? ' checked' : '') + '> ' + escapeAttr(label) + '</label>';
        });
        html += '</div></div>';
      }

      if (menu.kind === 'long' && EBMenus.ownPageMenuForSection) {
        var dropN = 0;
        (list || []).forEach(function (d) {
          if (d && d.section && EBMenus.ownPageMenuForSection(d.section)) dropN += 1;
        });
        if (dropN) {
          html += '<div class="toolbar-row no-print" style="margin:0 0 12px">';
          html += '<button type="button" class="soft" id="doPushAllOwnPages">Send drop-in categories to their own menus</button>';
          html += '</div>';
          html += '<p class="note no-print" style="margin:-6px 0 12px">Sandwiches, Desserts, Little Bells and Specials can move to their own menu in one go. That replaces what is on that menu, removes them from this sheet, and ticks them so they still print here.</p>';
        }
      }

      // Card menus + staff (no Blocks step): edit spiel / ice cream / notes here.
      // Staff Specials board notes live in the same “Text outside dishes” box.
      if (menu.kind !== 'long' || isStaffMode) {
        html += renderOutsideTextEditors(menu, list, { compact: menu.kind === 'long' });
      } else {
        html += '<p class="note no-print" style="margin:0 0 12px">Hours, ice cream, “served with…” and other <strong>text outside dishes</strong> → ' +
          '<button type="button" class="link" data-view-jump="blocks">Blocks &amp; text</button> (top) or next step <strong>Blocks</strong>.</p>';
      }

      if (mode === 'paste') {
        html += renderPasteBlock(menu);
      } else if (mode === 'add' && !pendingAddSection) {
        // Global Add — form at top. Section Add / Adjust / Replace sit inline in the list.
        html += renderDishForm(menu, { inline: false });
      }

      html += renderComplete();
      html += '<div class="toolbar-row no-print">';
      html += '<button type="button" class="soft" data-mode="add">Add a dish</button>';
      html += '<button type="button" class="soft" data-mode="paste">Upload / paste whole menu</button>';
      if (menuId === 'sunday') {
        html += '<button type="button" class="soft" id="doFromWeek">From this week’s Main / Specials</button>';
      }
      html += '</div>';
      html += '<div class="note no-print" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">';
      html += '<button class="link" id="doClear" type="button">Clear this menu</button>';
      if (!isStaffMode) {
        html += '<span>·</span>';
        html += '<button class="link" id="doReset" type="button">Put sample menus back</button>';
      }
      html += '</div>';
      if (isStaffMode) return withFlowNav(html, null, 2, 'Next · Generate');
      return withFlowNav(html, null, 2, 'Next · Blocks');
    }

    function renderCardOutsideBoxes(sec, rule, opts) {
      opts = opts || {};
      var slots = (EBMenus.cardOutsideSlots)
        ? EBMenus.cardOutsideSlots(rule || {})
        : {
          above: (rule && rule.above) || '',
          aboveKind: (rule && rule.aboveKind) || 'heading',
          below: (rule && rule.below) || '',
          belowKind: (rule && rule.belowKind) || 'text'
        };
      if (!slots.above && !slots.below && rule && rule.note) {
        slots = Object.assign({}, slots, { above: String(rule.note).trim() });
      }
      var hostMenu = EBMenus.menuById ? EBMenus.menuById(menuId) : null;

      html += '<label class="field" style="margin-top:0">' +
        (hostSheet ? 'Above the dishes' : 'Above the dish box') + '</label>';
      html += '<div class="layout-row" style="grid-template-columns:1fr;border:0;padding:0;margin:0 0 6px">';
      html += '<label class="field" style="margin:0">Type size</label>' + outsideKindSelect(sec, 'above', slots.aboveKind);
      html += '</div>';
      html += '<textarea data-layout-above="' + escapeAttr(sec) + '" rows="' + (opts.aboveRows || 3) + '" placeholder="' +
        escapeAttr(opts.abovePlaceholder || (hostSheet
          ? 'Optional — prints above the dishes, inside this section’s box'
          : 'Optional — prints above the dishes')) + '">' +
        escapeAttr(slots.above) + '</textarea>';
      html += '<label class="field">' +
        (hostSheet ? 'Below the dishes' : 'Below the dish box') + '</label>';
      html += '<div class="layout-row" style="grid-template-columns:1fr;border:0;padding:0;margin:0 0 6px">';
      html += '<label class="field" style="margin:0">Type size</label>' + outsideKindSelect(sec, 'below', slots.belowKind);
      html += '</div>';
      html += '<textarea data-layout-below="' + escapeAttr(sec) + '" rows="' + (opts.belowRows || 3) + '" placeholder="' +
        escapeAttr(opts.belowPlaceholder || (hostSheet
          ? 'Optional — prints under the dishes, inside this section’s box'
          : 'Optional — prints under the dishes')) + '">' +
        escapeAttr(slots.below) + '</textarea>';
      html += '<p class="note" style="margin:6px 0 0">' + (hostSheet
        ? 'Type size is for <strong>this sheet</strong> when ' + escapeAttr(sec) + ' is ticked on — Subheading/Paragraph/Text stay that size (even for “All below £9.50”); Title/Heading make the £ line larger. Subheading sits between Heading and Paragraph so hours and callouts stand out from the dishes without the big heading. Wording prints <strong>inside this section’s boxed area</strong> (in the frilly box when Frilly is Yes) and lines up with the dishes (not centred like the card). The ' + escapeAttr(sec) + ' card keeps its own wording and sizes.'
        : 'Type size is for this <strong>card</strong> (centred, outside the dish box). Main, Sunday and other long sheets keep their own wording, sizes and left alignment when this menu is ticked on.') + '</p>';
      return html;
    }

    /**
     * Editors for wording around the dish list (inside the section box on
     * long sheets; outside the dish box on cards).
     */
    function renderOutsideTextEditors(menu, list, opts) {
      opts = opts || {};
      var defaults = EBMenus.defaultSectionLayout();
      var menuRules = layoutFor(menuId);
      var html = '';
      html += '<div class="include-box outside-text-box" style="margin-bottom:14px">';
      html += '<h3>Text outside dishes</h3>';
      html += '<p class="note" style="margin:0 0 12px">Hours, “served with…”, ice cream, Sunday notes — anything that prints around the dishes, not as a dish row.</p>';

      if (menu.id === 'specials') {
        var noteSecs = EBMenus.SPECIALS_SECTIONS || ['Special Starters', 'Special Mains', 'Special Desserts'];
        noteSecs.forEach(function (sec) {
          var ruleSp = menuRules[sec] || defaults[sec] || { note: '' };
          html += '<label class="field">' + escapeAttr(sec) + ' — under the title</label>';
          html += '<textarea data-layout-note="' + escapeAttr(sec) + '" rows="2" placeholder="e.g. When it’s gone, it’s gone">' +
            escapeAttr(ruleSp.note || '') + '</textarea>';
        });
        html += '<p class="note" style="margin:8px 0 0">Shows in the Specials frilly box. When Specials are ticked onto Main / Sunday the note lines up with that sheet (not centred like this card).</p>';
        html += '</div>';
        return html;
      }

      if (menu.id === 'sandwiches') {
        var sand = menuRules.Sandwiches || defaults.Sandwiches || { note: '', sell: '', tip: true };
        html += renderCardOutsideBoxes('Sandwiches', sand, {
          abovePlaceholder: 'Optional line above the fillings',
          belowPlaceholder: 'Served on either Ciabatta…'
        });
        html += '<label class="field" style="margin-top:12px">Tip / selling box (Main &amp; Sunday when empty)</label>';
        html += '<textarea data-layout-sell="Sandwiches" rows="3" placeholder="A selection of sandwiches is available…">' +
          escapeAttr(sand.sell || '') + '</textarea>';
        html += '<p class="note" style="margin:6px 0 0">Used when you tick Sandwiches on Main / Sunday and that menu has 0 fillings. Unticked Sandwiches stay off the sheet.</p>';
        html += '</div>';
        return html;
      }

      if (menu.id === 'little-bells') {
        var lb = menuRules['Little Bells'] || defaults['Little Bells'] || {};
        html += renderCardOutsideBoxes('Little Bells', lb, {
          abovePlaceholder: 'All £9.50\nto include a choice of one scoop of ice cream or sorbet.',
          belowPlaceholder: 'Little Bells on Sunday have a choice of roasts at half the price of the adults.'
        });
        html += '</div>';
        return html;
      }

      if (menu.id === 'desserts' || menu.id === 'lunch-club') {
        var secName = menu.id === 'desserts' ? 'Desserts' : 'Mains';
        var rule = menuRules[secName] || defaults[secName] || { note: '' };
        if (menu.id === 'desserts') {
          html += renderCardOutsideBoxes('Desserts', rule, {
            abovePlaceholder: 'Optional line above the puddings',
            belowPlaceholder: 'Optional line under the dish box'
          });
        } else {
          html += '<label class="field">Note under the title</label>';
          html += '<textarea data-layout-note="' + escapeAttr(secName) + '" rows="2" placeholder="Optional line above the dishes">' +
            escapeAttr(rule.note || '') + '</textarea>';
          html += '<p class="note" style="margin:6px 0 0">Optional. Leave blank for no extra line on the card.</p>';
        }
        html += '</div>';
        return html;
      }

      // Main / Sunday — call out Sandwiches + Little Bells wording specifically.
      ['Sandwiches', 'Little Bells', 'Desserts'].forEach(function (sec) {
        var rule = menuRules[sec] || defaults[sec] || { note: '', sell: '', tip: false };
        var nIn = (list || []).filter(function (d) {
          return (d.section || '') === sec || (sec === 'Sandwiches' && /sandwich/i.test(d.section || ''));
        }).length;
        html += '<div class="section-block" data-section="' + escapeAttr(sec) + '" style="margin-bottom:12px">';
        html += '<div class="section-block-head"><div class="title">' + escapeAttr(sec) + '</div>';
        html += '<div class="meta"><span class="chip">' + nIn + ' on this sheet</span></div></div>';
        html += '<div class="section-block-body" style="padding-top:10px;padding-bottom:12px">';
        html += renderCardOutsideBoxes(sec, rule, {
          abovePlaceholder: sec === 'Little Bells' ? 'All £9.50\nto include a choice of one scoop…' : 'Optional line above the dishes',
          belowPlaceholder: sec === 'Little Bells' ? 'Little Bells on Sunday…' : 'Optional line under the dishes'
        });
        if (sec === 'Sandwiches') {
          html += '<label class="field" style="margin-top:10px">Tip box selling words</label>';
          html += '<textarea data-layout-sell="' + escapeAttr(sec) + '" rows="2">' +
            escapeAttr(rule.sell || '') + '</textarea>';
        }
        html += '</div></div>';
      });
      if (opts.compact) {
        html += '<p class="note" style="margin:0">More section notes (Starters, Roasts…) are in <strong>Blocks</strong>.</p>';
      }
      html += '</div>';
      return html;
    }

    function renderBlocksStep(menu, list, opts) {
      opts = opts || {};
      var html = '';
      if (menu.kind !== 'long') {
        html += '<p class="step-lede">Edit the wording that prints <strong>outside the dish list</strong> on this card.</p>';
        html += renderOutsideTextEditors(menu, list);
        if (opts.noNav) return html;
        return withFlowNav(html, 1, 3, 'Next · Wording');
      }
      html += '<p class="step-lede">Rules for <strong>this menu only</strong>. Any menu with its own page — Little Bells, Sandwiches, Desserts, Specials, and extras — <strong>drops onto this sheet</strong> when ticked. Each keeps the Column or Full width you set here, stays in that area, and its wording lines up with this sheet (not centred like the card). Drop-in wording sits in that section’s box (frilly if Yes). Opposite columns line up; a frilly title sits in the box and the unframed neighbour lines up with it; leftover space in a column takes food when it fits, else a small feature panel of the right height (never a repeat). Two frilly boxes side by side use different waves. <strong>Full width</strong> or <strong>Column</strong> lock the shape; <strong>Best fit</strong> lets AI choose for that section: column, full-bleed, or split across two even columns — any category, so food fits (never under Sharing). Specials print as Special Starters / Special Mains / Special Desserts. Frilly box = scalloped frame.</p>';

      // Quick cards for sections that have dishes
      var bySec = {};
      list.forEach(function (d) {
        var s = (EBMenus.normalizeSectionName && EBMenus.normalizeSectionName(d.section || 'Dishes')) ||
          (d.section || 'Dishes');
        if (!bySec[s]) bySec[s] = [];
        bySec[s].push(d);
      });
      var defaults = EBMenus.defaultSectionLayout();
      var menuRules = layoutFor(menuId);
      var order = EBMenus.SECTIONS.slice();
      Object.keys(bySec).forEach(function (s) {
        if (order.indexOf(s) === -1) order.push(s);
      });
      html += '<div class="block-cards">';
      order.forEach(function (sec) {
        var dishesIn = bySec[sec] || [];
        if (!dishesIn.length && !defaults[sec]) return;
        var rule = menuRules[sec] || defaults[sec] || { width: 'full', frame: false };
        var widthLabel = (EBMenus.WIDTH_OPTIONS.filter(function (w) { return w.id === rule.width; })[0] || {}).label || rule.width;
        html += '<div class="section-block" data-section="' + escapeAttr(sec) + '">';
        html += '<div class="section-block-head">';
        html += '<div class="title">' + escapeAttr(sec) + '</div>';
        html += '<div class="meta">';
        html += '<span class="chip">' + dishesIn.length + ' dish' + (dishesIn.length === 1 ? '' : 'es') + '</span>';
        html += '<span class="chip">' + escapeAttr(widthLabel) + '</span>';
        html += '<span class="chip">' + (rule.frame ? 'Frilly' : 'No frame') + '</span>';
        if (sec === 'Sandwiches') {
          html += '<span class="chip">' + (rule.tip ? 'Tip box on' : 'Tip box off') + '</span>';
        }
        html += '</div></div>';
        if (defaults[sec]) {
          html += '<div class="section-block-body" style="padding-top:10px;padding-bottom:12px">';
          html += '<div class="layout-row" style="grid-template-columns:1fr 1fr;border:0;padding:0">';
          html += '<div><label class="field" style="margin-top:0">Width</label>';
          html += '<select data-layout-width="' + escapeAttr(sec) + '">';
          EBMenus.WIDTH_OPTIONS.forEach(function (w) {
            html += '<option value="' + w.id + '"' + (rule.width === w.id ? ' selected' : '') + '>' + escapeAttr(w.label) + '</option>';
          });
          html += '</select></div>';
          html += '<div><label class="field" style="margin-top:0">Frilly box</label>';
          html += '<select data-layout-frame="' + escapeAttr(sec) + '">';
          html += '<option value="yes"' + (rule.frame ? ' selected' : '') + '>Yes</option>';
          html += '<option value="no"' + (!rule.frame ? ' selected' : '') + '>No</option>';
          html += '</select></div></div>';
          if (sec === 'Little Bells' || sec === 'Sandwiches' || sec === 'Desserts') {
            html += renderCardOutsideBoxes(sec, rule, {
              abovePlaceholder: sec === 'Little Bells' ? 'All £9.50\nto include a choice of one scoop…' : 'Optional line above the dishes',
              belowPlaceholder: sec === 'Little Bells' ? 'Little Bells on Sunday…' : 'Optional line under the dishes'
            });
          } else {
            html += '<label class="field">Text outside dishes (under the title)</label>';
            html += '<textarea data-layout-note="' + escapeAttr(sec) + '" rows="2" placeholder="Hours, “all served with…”, etc. Shows above the dishes in the box.">' +
              escapeAttr(rule.note || '') + '</textarea>';
          }
          if (sec === 'Sandwiches') {
            html += '<div class="layout-row" style="grid-template-columns:1fr 1fr;border:0;padding:10px 0 0;margin-top:8px">';
            html += '<div><label class="field" style="margin-top:0">Tip box (no fillings)</label>';
            html += '<select data-layout-tip="' + escapeAttr(sec) + '">';
            html += '<option value="yes"' + (rule.tip ? ' selected' : '') + '>Yes — show selling words</option>';
            html += '<option value="no"' + (!rule.tip ? ' selected' : '') + '>No — omit when empty</option>';
            html += '</select></div>';
            html += '<div><label class="field" style="margin-top:0">Tip box selling words</label>';
            html += '<textarea data-layout-sell="' + escapeAttr(sec) + '" rows="2" placeholder="A selection of sandwiches is available…">' +
              escapeAttr(rule.sell || '') + '</textarea></div></div>';
            html += '<p class="note" style="margin:6px 0 0">On <strong>Main</strong> and <strong>Main (upcoming)</strong>, Tip = Yes prints a compact oval with these selling words (no Sandwiches title) even when Sandwiches is unticked. Every Generate uses the same leftover rule: food under a short column when it fits, else a feature panel (never a repeat). When Sandwiches is ticked (fillings, or empty tip+hours), that section prints instead — Tip does not add a second box. Sunday still needs Sandwiches ticked for the empty tip box. Fit always tries to place the tip; only a truly packed sheet may overflow.</p>';
          }
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="toolbar-row"><button type="button" class="link" id="doResetLayout">Reset this menu’s blocks to defaults</button></div>';
      if (opts.noNav) return html;
      return withFlowNav(html, 1, 3, 'Next · Wording');
    }

    function renderWordingStep(menu) {
      var html = '';

      if (menu.kind === 'party') html += renderPartyBlurbsBox();

      return withFlowNav(html, 2, 4, 'Next · Generate');

      restorePendingScroll_();

    function blurbKindSelect(id, value) {

        { id: 'title', label: 'Title (large heading)' },
        { id: 'heading', label: 'Heading (between title & paragraph)' },
        { id: 'subhead', label: 'Subheading (between heading & paragraph)' },
        { id: 'paragraph', label: 'Paragraph (body)' },
        { id: 'text', label: 'Text (smaller plain line)' }
      ]).map(function (k) {

      var html = '<select id="' + id + '">';
      kinds.forEach(function (k) {
        html += '<option value="' + k.id + '"' + (value === k.id ? ' selected' : '') + '>' + escapeAttr(k.label) + '</option>';

    function sectionSelectHtml(selected, attrs) {
