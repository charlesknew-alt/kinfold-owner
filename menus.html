<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varlo · Eight Bells — Menus</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paint: #DFC2AF; --paint-deep: #A79283; --paint-wash: #F4EAE3;
      --ink: #1A1814; --ink-soft: #4a4640; --line: #e5e0d4;
      --white-warm: #FBF8F2; --green: #538135;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Source Sans 3', sans-serif;
    }
    body { font-family: var(--sans); background: var(--white-warm); color: var(--ink); line-height: 1.45; }
    .ps-header { background: var(--paint); border-bottom: 1px solid var(--paint-deep); padding: 14px 20px; }
    .ps-header-inner { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .ps-venue-eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
    .ps-venue-name { font-family: var(--serif); font-size: 22px; font-weight: 500; }
    html.iframed .ps-header { display: none; } /* HARD: never restore display:block for iframed/varlo-header */
    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 120px; }
    h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 5vw, 34px); }
    .lede { color: var(--ink-soft); margin: 6px 0 16px; font-size: 14.5px; max-width: 40em; }
    .menus { display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .menus button, button.go, button.ghost, button.soft {
      font-family: var(--sans); cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); padding: 10px 14px; font-weight: 600; font-size: 13px; white-space: nowrap;
    }
    .menus button.on { background: var(--ink); color: var(--paint); border-color: var(--ink); }
    button.go { background: var(--ink); color: var(--paint); border-color: var(--ink); }
    button.soft { background: var(--paint-wash); border-color: transparent; }
    button.link { background: transparent; border: 0; color: var(--ink-soft); text-decoration: underline; padding: 0; font-weight: 600; cursor: pointer; font-family: var(--sans); font-size: 13px; }

    /* —— Flow route (Varlo / payroll style) —— */
    .flow-rail {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px;
      margin: 0 0 16px; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    }
    .flow-pill {
      display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent;
      font: 600 13px var(--sans); color: var(--ink-soft); padding: 6px 8px; border-radius: 999px; cursor: pointer;
    }
    .flow-pill .num {
      width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      background: var(--paint-wash); color: var(--ink); font-size: 12px; font-weight: 700;
    }
    .flow-pill.on { color: var(--ink); background: var(--paint-wash); }
    .flow-pill.on .num { background: var(--ink); color: var(--paint); }
    .flow-pill.done .num { background: var(--green); color: #fff; }
    .flow-arrow { color: var(--ink-soft); opacity: .45; font-size: 12px; padding: 0 2px; }

    .flow-step {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden;
    }
    .flow-step.is-collapsed { cursor: pointer; }
    .flow-step.is-collapsed:hover { border-color: var(--paint-deep); }
    .flow-step-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 14px 16px; width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer;
      font-family: var(--sans); color: var(--ink);
    }
    .flow-step-head .kicker {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin-bottom: 4px;
    }
    .flow-step-head h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0; }
    .flow-step-head .summary { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
    .flow-step-head .chev { font-size: 18px; color: var(--ink-soft); line-height: 1; padding-top: 4px; }
    .flow-step.is-open .flow-step-head { border-bottom: 1px solid var(--line); background: var(--paint-wash); }
    .flow-step-body { display: none; padding: 16px; }
    .flow-step.is-open .flow-step-body { display: block; }
    .flow-step .step-lede { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 14px; }
    .flow-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }

    .section-block {
      border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; background: var(--white-warm); overflow: hidden;
    }
    .section-block-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px 14px; background: #fff; border-bottom: 1px solid var(--line);
    }
    .section-block-head .title {
      font-family: var(--serif); font-weight: 500; font-size: 18px; letter-spacing: 0.02em;
    }
    .section-block-head .meta {
      font-size: 12px; font-weight: 600; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 8px;
    }
    .section-block-head .chip {
      display: inline-block; padding: 3px 8px; border-radius: 999px; background: var(--paint-wash); font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .section-block-body { padding: 4px 14px 10px; }
    .section-block .dish-row:last-child { border-bottom: 0; }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    label.field { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin: 10px 0 4px; }
    input[type=text], input[type=url], input[type=date], select, textarea {
      width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--white-warm); color: var(--ink);
    }
    textarea { min-height: 96px; resize: vertical; }
    .plan { border-radius: 12px; padding: 12px 14px; background: var(--paint-wash); margin-bottom: 10px; }
    .plan strong { font-family: var(--serif); font-weight: 500; font-size: 18px; display: block; }
    .plan.over { background: #fbeae6; }
    .plan.one, .plan.two, .plan.two-up { background: #e8f0e4; }
    .note { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
    .include-box { background: var(--paint-wash); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .include-box h3 { font-family: var(--serif); font-weight: 500; font-size: 17px; margin-bottom: 6px; }
    .include-row { display: flex; flex-wrap: wrap; gap: 10px 14px; }
    .include-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .complete-head {
      display: none;
    }
    @media (min-width: 640px) {
      .complete-head { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: end; margin: 8px 0; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
    }
    .ticks-head { display: grid; grid-template-columns: repeat(4, 44px); gap: 4px; text-align: center; }
    .dish-row {
      display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; align-items: start;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    @media (min-width: 640px) {
      .dish-row { grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; }
    }
    .dish-row .name { font-weight: 700; font-size: 15px; }
    .dish-row .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .dish-row .tag { color: var(--green); font-style: italic; font-size: 13px; }
    .dish-row select.section-pick, .form-card select#section {
      display: block; width: 100%; max-width: 220px; margin-top: 4px;
      font: 600 13px var(--sans); padding: 7px 10px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--paint-wash); color: var(--ink);
    }
    .layout-grid { display: flex; flex-direction: column; gap: 8px; }
    .layout-head, .layout-row {
      display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr) minmax(0,0.7fr);
      gap: 8px; align-items: center;
    }
    .layout-head { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
    .layout-name { font-weight: 700; font-size: 13.5px; }
    .layout-row select {
      font: 600 12.5px var(--sans); padding: 7px 8px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; color: var(--ink); width: 100%;
    }
    @media (max-width: 560px) {
      .layout-head { display: none; }
      .layout-row { grid-template-columns: 1fr; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    }
    .dish-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .dish-actions select {
      width: auto; min-width: 7.5rem; padding: 8px 10px; font-size: 13px; font-weight: 600; background: #fff;
    }
    .ticks { display: grid; grid-template-columns: repeat(4, 44px); gap: 4px; justify-items: center; }
    .ticks label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; min-height: 44px; justify-content: center; }
    .ticks .letter { color: var(--green); font-style: italic; font-size: 12px; }
    .section-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 14px; font-weight: 700; }
    .mark { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
    .opt-row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
    .opt-row label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-soft); font-weight: 600; cursor: pointer; }
    .bank-item { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; }
    .bank-item .name { font-weight: 700; }
    .bank-item .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .from { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
    .form-card { background: var(--paint-wash); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .form-card h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin-bottom: 4px; }
    .generate-bar {
      position: sticky; bottom: 0; z-index: 8; margin: 8px -16px -16px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(251,248,242,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    }
    .generate-bar .bar-inner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .generate-bar .bar-copy { flex: 1 1 200px; font-size: 13px; color: var(--ink-soft); }
    .generate-bar .bar-copy strong { color: var(--ink); font-family: var(--serif); font-weight: 500; font-size: 16px; display: block; }
    .generate-bar .bar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .date-field { display: grid; grid-template-columns: 1fr 3rem; gap: 8px; align-items: stretch; }
    .date-field input[type=date] {
      width: 100%; min-width: 0; padding: 8px 4px; cursor: pointer; min-height: 44px;
    }
    .date-field input[type=text] { min-height: 44px; }
    details.more > summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-soft); list-style: none; }
    details.more > summary::-webkit-details-marker { display: none; }
    @media print {
      .ps-header, .lede, .menus, .generate-bar, .no-print, .dish-actions, .toolbar-row { display: none !important; }
      .flow-step { border: 0; padding: 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <header class="ps-header">
    <div class="ps-header-inner">
      <div>
        <div class="ps-venue-eyebrow">The Eight Bells · Bolney</div>
        <div class="ps-venue-name">Menus</div>
      </div>
    </div>
  </header>
  <main>
    <h1>Menus</h1>
    <p class="lede">A short flow: load dishes, set how each section sits on the sheet, pick wording, then generate. One step at a time — like block management on Varlo.</p>
    <div class="menus no-print" id="menuPicker" role="tablist" aria-label="Which menu"></div>
    <div id="editor"></div>
  </main>
  <script src="menus.js?v=20260922-flow15"></script>
  <script src="menus-print.js?v=20260922-flow15"></script>
  <script src="menus-ingest.js?v=20260922-flow15"></script>
  <script>
    if (window.parent !== window) document.documentElement.classList.add('iframed');

    var STORAGE = 'eb-menus-v2';
    var META_STORAGE = 'eb-menus-meta-v1';
    var PROMO_STORAGE = 'eb-menu-promo-bank-v1';
    var PROMO_TICKS = 'eb-menu-promo-ticks-v1';
    var LAYOUT_STORAGE = 'eb-menu-section-layout-v1';
    var book = load();
    var metaBook = loadMeta();
    var promoBank = loadPromoBank();
    var promoTicks = loadPromoTicks();
    var sectionLayout = loadSectionLayout();
    var menuId = 'main';
    var mode = 'complete';
    var dishId = '';
    var includes = loadIncludes();
    var pendingReview = null;
    var editingPromoId = '';
    var flowStep = 1; // 1 dishes · 2 blocks · 3 wording · 4 generate

    var FLOW_STEPS = [
      { id: 1, key: 'dishes', label: 'Dishes' },
      { id: 2, key: 'blocks', label: 'Blocks' },
      { id: 3, key: 'wording', label: 'Wording' },
      { id: 4, key: 'generate', label: 'Generate' }
    ];

    function loadSectionLayout() {
      try {
        if (!window.EBMenus || typeof EBMenus.normalizeSectionLayout !== 'function') {
          return (EBMenus && EBMenus.defaultSectionLayout) ? EBMenus.defaultSectionLayout() : {};
        }
        var raw = JSON.parse(localStorage.getItem(LAYOUT_STORAGE) || 'null');
        return EBMenus.normalizeSectionLayout(raw);
      } catch (e) {
        try {
          return (window.EBMenus && EBMenus.defaultSectionLayout) ? EBMenus.defaultSectionLayout() : {};
        } catch (e2) {
          return {};
        }
      }
    }
    function saveSectionLayout() {
      localStorage.setItem(LAYOUT_STORAGE, JSON.stringify(sectionLayout));
    }

    function loadPromoBank() {
      try {
        if (!window.EBMenus || typeof EBMenus.normalizePromoBank !== 'function') {
          return (EBMenus && EBMenus.seedPromoBank) ? EBMenus.seedPromoBank() : [];
        }
        var raw = JSON.parse(localStorage.getItem(PROMO_STORAGE) || 'null');
        return EBMenus.normalizePromoBank(raw);
      } catch (e) {
        try {
          return (window.EBMenus && EBMenus.seedPromoBank) ? EBMenus.seedPromoBank() : [];
        } catch (e2) {
          return [];
        }
      }
    }
    function savePromoBank() {
      localStorage.setItem(PROMO_STORAGE, JSON.stringify(promoBank));
    }
    function loadPromoTicks() {
      try { return JSON.parse(localStorage.getItem(PROMO_TICKS) || '{}') || {}; }
      catch (e) { return {}; }
    }
    function savePromoTicks() {
      localStorage.setItem(PROMO_TICKS, JSON.stringify(promoTicks));
    }
    function hostPromoTicks() {
      return (promoTicks[menuId] && typeof promoTicks[menuId] === 'object') ? promoTicks[menuId] : {};
    }
    function pickedPromosForSheet() {
      if (!window.EBMenus || typeof EBMenus.pickPromos !== 'function') return [];
      return EBMenus.pickPromos(promoBank, hostPromoTicks(), { max: 5 });
    }
    function load() {
      try {
        var saved = JSON.parse(localStorage.getItem(STORAGE) || localStorage.getItem('eb-menus-v1') || 'null');
        if (saved && saved.main) {
          var seeded = EBMenus.seed();
          if (!saved.party) saved.party = seeded.party;
          return saved;
        }
      } catch (e) {}
      return EBMenus.seed();
    }
    function loadMeta() {
      try {
        return JSON.parse(localStorage.getItem(META_STORAGE) || '{}') || {};
      } catch (e) { return {}; }
    }
    function save() {
      localStorage.setItem(STORAGE, JSON.stringify(book));
      localStorage.setItem(META_STORAGE, JSON.stringify(metaBook));
      localStorage.setItem(STORAGE + '-includes', JSON.stringify(includes));
    }
    function loadIncludes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE + '-includes') || '{}') || {};
      } catch (e) { return {}; }
    }
    function dishes() { return book[menuId] || (book[menuId] = []); }
    function hostIncludes() {
      var out = {};
      EBMenus.includableMenus(menuId).forEach(function (m) {
        out[m.id] = !!(includes[menuId] && includes[menuId][m.id]);
      });
      return out;
    }

    var MARK = '<svg class="mark" viewBox="0 0 24 24" aria-label="Lunch club"><path fill="currentColor" d="M7.2 4.2h1.4v6.2H7.2zm2.6 0h1.4v6.2h-1.4zm2.6 0h1.4v6.2h-1.4zM8.4 11.2h5.2c.4 1.2-.2 2.4-1.4 2.9V20H9.8v-5.9c-1-.5-1.6-1.6-1.4-2.9z" transform="rotate(-32 12 12)"/><path fill="currentColor" d="M11 3.5l1.1 8.4 1.5-.2L12.6 3.5zM10.4 12h3l.4 1.3c.2.7-.2 1.4-.9 1.6V20h-1.5v-5.1c-.7-.3-1.1-1-.9-1.7z" transform="rotate(34 12 12)"/></svg>';

    function render() {
      renderPicker();
      renderEditor();
    }

    function renderPicker() {
      var box = document.getElementById('menuPicker');
      box.innerHTML = '';
      EBMenus.MENUS.forEach(function (menu) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', menu.id === menuId ? 'true' : 'false');
        b.textContent = menu.name;
        b.className = menu.id === menuId ? 'on' : '';
        b.onclick = function () {
          menuId = menu.id;
          dishId = (dishes()[0] && dishes()[0].id) || '';
          if (mode === 'adjust' || mode === 'replace' || mode === 'add' || mode === 'paste') mode = 'complete';
          editingPromoId = '';
          flowStep = 1;
          render();
        };
        box.appendChild(b);
      });
    }

    function currentDish() {
      var list = dishes();
      for (var i = 0; i < list.length; i++) if (list[i].id === dishId) return list[i];
      return null;
    }

    function renderEditor() {
      var menu = EBMenus.menuById(menuId);
      var el = document.getElementById('editor');
      var list = dishes();
      var html = '';

      html += renderFlowRail(menu, list);

      // —— 1. Dishes ——
      html += flowStepShell(1, 'Dishes', menu.name,
        list.length ? (list.length + ' dish' + (list.length === 1 ? '' : 'es') + ' · ' + sectionCount(list) + ' sections') : 'Empty — upload or add dishes',
        renderDishesStep(menu, list));

      // —— 2. Blocks (section layout) ——
      html += flowStepShell(2, 'Blocks', 'How sections sit on the sheet',
        blockSummary(menu),
        renderBlocksStep(menu, list));

      // —— 3. Wording ——
      html += flowStepShell(3, 'Wording', 'Events & selling lines',
        wordingSummary(menu),
        renderWordingStep(menu));

      // —— 4. Generate ——
      html += flowStepShell(4, 'Generate', 'Print sheet',
        generateSummary(),
        renderGenerateStep(menu));

      el.innerHTML = html;
      var hint = document.getElementById('generateHint');
      if (hint) {
        var plan = composed().plan;
        hint.innerHTML = '<strong>' + escapeAttr(planTitle(plan.fit)) + '</strong>' + escapeAttr(plan.text || '');
      }
      bindEditor();
      var open = document.getElementById('step-' + FLOW_STEPS[flowStep - 1].key);
      if (open && flowStep > 1) open.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function sectionCount(list) {
      var seen = {};
      (list || []).forEach(function (d) { seen[d.section || ''] = true; });
      return Object.keys(seen).filter(Boolean).length;
    }

    function blockSummary(menu) {
      if (menu.kind !== 'long') return 'Card menus use a fixed card layout';
      var custom = 0;
      var defaults = EBMenus.defaultSectionLayout();
      EBMenus.SECTIONS.forEach(function (s) {
        var r = sectionLayout[s] || defaults[s];
        if (!defaults[s] || r.width !== defaults[s].width || !!r.frame !== !!defaults[s].frame) custom += 1;
      });
      return custom ? custom + ' custom rule' + (custom === 1 ? '' : 's') : 'Using defaults (mains/starters full, nibbles column…)';
    }

    function wordingSummary(menu) {
      if (menu.kind !== 'long') return 'Not used on card menus';
      var ticks = hostPromoTicks();
      var n = Object.keys(ticks).filter(function (k) { return ticks[k]; }).length;
      return n ? n + ' forced line' + (n === 1 ? '' : 's') : 'Auto-pick on Generate';
    }

    function generateSummary() {
      try {
        var plan = composed().plan;
        return planTitle(plan.fit);
      } catch (e) {
        return 'Ready when dishes are set';
      }
    }

    function renderFlowRail(menu, list) {
      var html = '<nav class="flow-rail no-print" aria-label="Menu flow">';
      FLOW_STEPS.forEach(function (s, i) {
        if (i) html += '<span class="flow-arrow" aria-hidden="true">→</span>';
        var cls = 'flow-pill';
        if (s.id === flowStep) cls += ' on';
        else if (s.id < flowStep) cls += ' done';
        html += '<button type="button" class="' + cls + '" data-flow-step="' + s.id + '">';
        html += '<span class="num">' + (s.id < flowStep ? '✓' : s.id) + '</span> ' + escapeAttr(s.label);
        html += '</button>';
      });

    function flowNav(prev, next, nextLabel) {

    function renderDishesStep(menu, list) {
      var html = '';

    function renderBlocksStep(menu, list) {
      var html = '';
      if (menu.kind !== 'long') {
        html += '<p class="step-lede">Sandwich / dessert / card menus print on a fixed card. Layout rules apply to Main and Sunday sheets.</p>';
        html += flowNav(1, 3, 'Next · Wording');
        return html;
      }
      html += '<p class="step-lede">Treat each category as a block on the page. Full width for mains/starters by default; columns for nibbles, burgers, sandwiches, sides. Frilly box = scalloped frame. Changes save for next time.</p>';

      // Quick cards for sections that have dishes
      var bySec = {};
      list.forEach(function (d) {
        var s = d.section || 'Dishes';
        if (!bySec[s]) bySec[s] = [];
        bySec[s].push(d);
      });
      var defaults = EBMenus.defaultSectionLayout();
      var order = EBMenus.SECTIONS.slice();
      Object.keys(bySec).forEach(function (s) {
        if (order.indexOf(s) === -1) order.push(s);
      });
      html += '<div class="block-cards">';
      order.forEach(function (sec) {
        var dishesIn = bySec[sec] || [];
        if (!dishesIn.length && !defaults[sec]) return;
        var rule = sectionLayout[sec] || defaults[sec] || { width: 'full', frame: false };
        var widthLabel = (EBMenus.WIDTH_OPTIONS.filter(function (w) { return w.id === rule.width; })[0] || {}).label || rule.width;
        html += '<div class="section-block">';
        html += '<div class="section-block-head">';
        html += '<div class="title">' + escapeAttr(sec) + '</div>';
        html += '<div class="meta">';
        html += '<span class="chip">' + dishesIn.length + ' dish' + (dishesIn.length === 1 ? '' : 'es') + '</span>';
        html += '<span class="chip">' + escapeAttr(widthLabel) + '</span>';
        html += '<span class="chip">' + (rule.frame ? 'Frilly' : 'No frame') + '</span>';
        html += '</div></div>';
        if (defaults[sec]) {
          html += '<div class="section-block-body" style="padding-top:10px;padding-bottom:12px">';
          html += '<div class="layout-row" style="grid-template-columns:1fr 1fr;border:0;padding:0">';
          html += '<div><label class="field" style="margin-top:0">Width</label>';
          html += '<select data-layout-width="' + escapeAttr(sec) + '">';
          EBMenus.WIDTH_OPTIONS.forEach(function (w) {
            html += '<option value="' + w.id + '"' + (rule.width === w.id ? ' selected' : '') + '>' + escapeAttr(w.label) + '</option>';
          });
          html += '</select></div>';
          html += '<div><label class="field" style="margin-top:0">Frilly box</label>';
          html += '<select data-layout-frame="' + escapeAttr(sec) + '">';
          html += '<option value="yes"' + (rule.frame ? ' selected' : '') + '>Yes</option>';
          html += '<option value="no"' + (!rule.frame ? ' selected' : '') + '>No</option>';
          html += '</select></div></div></div>';
        }
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="toolbar-row"><button type="button" class="link" id="doResetLayout">Reset all blocks to defaults</button></div>';
      html += flowNav(1, 3, 'Next · Wording');
      return html;
    }

    function renderWordingStep(menu) {

    function sectionSelectHtml(selected, attrs) {
      var opts = EBMenus.sectionOptions();

    function renderDishForm(menu) {
      var html = '<div class="form-card no-print">';

        html += '<p class="note">This menu is empty. Add a dish, or paste a whole menu.</p></div>';
        return html;
      }
      var item = (mode === 'adjust' || mode === 'replace') ? currentDish() : blank();

      html += '<h3>' + (mode === 'add' ? 'Add a dish' : (mode === 'replace' ? 'Replace dish' : 'Adjust dish')) + '</h3>';
      if (mode === 'replace') html += '<p class="note">Type the new dish — same slot on the menu.</p>';
      if (mode === 'adjust' || mode === 'replace') {
        html += '<label class="field">Dish</label><select id="pick">';
        dishes().forEach(function (d) {
          html += '<option value="' + d.id + '"' + (d.id === dishId ? ' selected' : '') + '>' + escapeAttr(d.section + ' — ' + d.name) + '</option>';
        });
        html += '</select>';
      }
      var formItem = mode === 'replace' ? blank() : item;
      if (mode === 'replace') formItem.section = item.section;
      html += '<label class="field">Section</label>' + sectionSelectHtml(formItem.section || 'Mains', 'id="section"');
      html += field('Name', 'name', formItem.name);
      html += field('Description', 'description', formItem.description);

      html += '<button class="link" data-mode="complete" type="button">Cancel</button>';

      return html;

    function renderPasteBlock(menu) {
      var html = '<div class="form-card no-print">';
      html += '<h3>Upload / paste whole menu</h3>';
      html += '<p class="note">You will <strong>review</strong> dishes before they replace <em>' + escapeAttr(menu.name) + '</em>.</p>';
      html += '<div class="include-box" style="margin-bottom:14px;background:#fff">';

      html += '<label class="field">Upload PDF, Word (.docx), or image</label>';
      html += '<input type="file" id="menuFile" accept="application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*,.pdf,.docx,.png,.jpg,.jpeg,.webp" style="display:block;width:100%;font:inherit">';

        var m = metaBook[menuId] || EBMenus.emptyMeta();
        html += '<div class="include-box" style="margin-top:14px;background:#fff"><h3>Party sheet details</h3>';
        html += field('Title', 'metaTitle', m.title || 'Christmas Party Menu');
        html += field('Course prices', 'metaPrices', m.coursePrices || '2 courses £32.95 · 3 courses £39.95');
        html += field('Notes (pre-order / deposit)', 'metaNotes', m.notes || '');
        html += '<button class="go" id="doSaveMeta" type="button" style="margin-top:12px">Save party details</button></div>';
      }
      html += '</div>';
      return html;
    }

    function dateFieldHtml(isoValue) {
      var iso = EBMenus.toIsoDate(isoValue || '') || '';
      var uk = EBMenus.toUkDate(iso) || '';
      var html = '<label class="field">Date (optional)</label>';
      html += '<div class="date-field">';
      html += '<input type="text" id="promoDateUk" placeholder="DD-MM-YYYY" inputmode="numeric" autocomplete="off" value="' + escapeAttr(uk) + '">';
      html += '<input type="date" id="promoDate" value="' + escapeAttr(iso) + '" title="Open calendar" aria-label="Pick a date">';
      html += '</div>';
      html += '<p class="note" style="margin-top:4px">UK format DD-MM-YYYY — use the calendar icon to pick.</p>';
      return html;
    }

    function bindDateField() {
      var uk = document.getElementById('promoDateUk');
      var iso = document.getElementById('promoDate');
      if (!uk || !iso) return;
      function syncFromPicker() {
        uk.value = EBMenus.toUkDate(iso.value) || '';
      }
      function syncFromText() {
        var next = EBMenus.toIsoDate(uk.value);
        if (next) {
          iso.value = next;
          uk.value = EBMenus.toUkDate(next);
        } else if (!String(uk.value || '').trim()) {
          iso.value = '';
        }
      }
      iso.addEventListener('change', syncFromPicker);
      iso.addEventListener('input', syncFromPicker);
      uk.addEventListener('change', syncFromText);
      uk.addEventListener('blur', syncFromText);
    }

    function readPromoDateIso() {
      var isoEl = document.getElementById('promoDate');
      var ukEl = document.getElementById('promoDateUk');
      var fromPicker = isoEl && isoEl.value ? EBMenus.toIsoDate(isoEl.value) : '';
      if (fromPicker) return fromPicker;
      return ukEl ? EBMenus.toIsoDate(ukEl.value) : '';
    }

    function marksEditor(item, prefix) {
      var m = EBMenus.parseMarks(item.tags);
      var lunch = menuId !== 'lunch-club';
      var html = '<div class="opt-row" style="margin-top:12px">';
      if (lunch) {
        html += tick('Lunch club ' + MARK, prefix + '-lunch', item.lunchClub);
      }
      html += tick('<span class="letter">gf</span> gluten free', prefix + '-gf', m.gf);
      html += tick('as option', prefix + '-gfOpt', m.gfOpt);
      html += tick('<span class="letter">v</span> vegetarian', prefix + '-v', m.v);
      html += tick('as option', prefix + '-vOpt', m.vOpt);
      html += tick('<span class="letter">vg</span> vegan', prefix + '-vg', m.vg);
      html += tick('as option', prefix + '-vgOpt', m.vgOpt);
      html += '</div>';
      if (menuId === 'lunch-club') {
        html += '<p class="note">This card is the lunch club itself, Monday to Thursday. Two courses £14.95, three courses £17.95.</p>';
      }
      return html;
    }
    function tick(label, id, on) {
      return '<label><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '> ' + label + '</label>';
    }

    function renderSectionLayoutBox() {
      var defaults = EBMenus.defaultSectionLayout();
      var html = '<div class="include-box layout-rules" style="margin-top:14px"><h3>Section layout rules</h3>';
      html += '<p class="note" style="margin:0 0 10px">Defaults are set per category. Change any row and it <strong>saves for next time</strong> until someone changes it again.</p>';
      html += '<div class="layout-grid">';
      html += '<div class="layout-head"><span>Section</span><span>Width</span><span>Frilly box</span></div>';
      EBMenus.SECTIONS.forEach(function (sec) {
        var rule = sectionLayout[sec] || defaults[sec];
        var isDefault = defaults[sec] &&
          defaults[sec].width === rule.width &&
          !!defaults[sec].frame === !!rule.frame;
        html += '<div class="layout-row" data-layout-sec="' + escapeAttr(sec) + '">';
        html += '<div class="layout-name">' + escapeAttr(sec);
        if (!isDefault) html += ' <span class="from">custom</span>';
        html += '</div>';
        html += '<select data-layout-width="' + escapeAttr(sec) + '" aria-label="Width for ' + escapeAttr(sec) + '">';
        EBMenus.WIDTH_OPTIONS.forEach(function (w) {
          html += '<option value="' + w.id + '"' + (rule.width === w.id ? ' selected' : '') + '>' + escapeAttr(w.label) + '</option>';
        });
        html += '</select>';
        html += '<select data-layout-frame="' + escapeAttr(sec) + '" aria-label="Frilly box for ' + escapeAttr(sec) + '">';
        html += '<option value="yes"' + (rule.frame ? ' selected' : '') + '>Yes</option>';
        html += '<option value="no"' + (!rule.frame ? ' selected' : '') + '>No</option>';
        html += '</select>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="toolbar-row" style="margin-top:12px">';
      html += '<button type="button" class="link" id="doResetLayout">Reset all layout rules to defaults</button>';
      html += '</div></div>';
      return html;

    function renderPromoTicksBox() {
      var ticks = hostPromoTicks();

      var auto = pickedPromosForSheet();
      var html = '<div class="include-box"><h3>Events &amp; wording on this sheet</h3>';
      html += '<p class="note" style="margin:0 0 8px">Tick lines from the bank to force them onto Generate. Leave all unticked and we’ll auto-pick (upcoming dates first — never past dates). Edit the bank under <strong>Wording / events</strong>.</p>';

        html += '<div class="opt-row">';
        if (m.gf) html += '<label><input type="checkbox" data-flag="gfOpt" data-id="' + d.id + '"' + (m.gfOpt ? ' checked' : '') + '> gf as option</label>';
        if (m.v) html += '<label><input type="checkbox" data-flag="vOpt" data-id="' + d.id + '"' + (m.vOpt ? ' checked' : '') + '> v as option</label>';
        if (m.vg) html += '<label><input type="checkbox" data-flag="vgOpt" data-id="' + d.id + '"' + (m.vgOpt ? ' checked' : '') + '> vg as option</label>';

        html += '<label><input type="checkbox" data-flag="gf" data-id="' + d.id + '"' + (m.gf ? ' checked' : '') + '><span class="letter">gf</span></label>';
        html += '<label><input type="checkbox" data-flag="v" data-id="' + d.id + '"' + (m.v ? ' checked' : '') + '><span class="letter">v</span></label>';
        html += '<label><input type="checkbox" data-flag="vg" data-id="' + d.id + '"' + (m.vg ? ' checked' : '') + '><span class="letter">vg</span></label>';

        html += '<option value="">Edit…</option><option value="adjust">Adjust</option><option value="replace">Replace</option>';
        if (idx > 0) html += '<option value="merge-up">Merge ↑ into dish above</option>';
        html += '<option value="remove">Remove</option>';
        html += '</select></div></div>';
        if (idx === list.length - 1 && open) html += '</div></div>';
      });
      return html;
    }

    function bindEditor() {
      bindDateField();
      document.querySelectorAll('[data-flow-step]').forEach(function (b) {
        b.onclick = function (ev) {
          ev.preventDefault();
          var next = parseInt(b.getAttribute('data-flow-step'), 10);
          if (!next || next === flowStep) return;
          flowStep = next;
          mode = 'complete';
          render();
        };
      });
      document.querySelectorAll('[data-mode]').forEach(function (b) {
        b.onclick = function () {
          var next = b.getAttribute('data-mode');
          if (next === 'add') dishId = '';
          mode = next;
          flowStep = 1;
          render();
          if (next === 'add' || next === 'adjust' || next === 'replace' || next === 'paste') {
            var form = document.querySelector('.form-card');
            if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };
      });
      document.querySelectorAll('[data-section-id]').forEach(function (sel) {
        sel.onchange = function () {
          var id = sel.getAttribute('data-section-id');
          var next = sel.value;
          book[menuId] = EBMenus.sortDishesBySection(dishes().map(function (d) {
            if (d.id !== id) return d;
            return {
              id: d.id,
              section: next,
              name: d.name,
              description: d.description,
              price: d.price,
              tags: d.tags,
              lunchClub: d.lunchClub,
              fromMenu: d.fromMenu
            };
          }));
          save();
          render();
        };
      });
      document.querySelectorAll('[data-dish-action]').forEach(function (sel) {
        sel.onchange = function () {
          var id = sel.getAttribute('data-dish-action');
          var act = sel.value;
          sel.value = '';
          if (!act) return;
          dishId = id;
          if (act === 'merge-up') {
            var sorted = EBMenus.sortDishesBySection(dishes());
            var idx = -1;
            for (var mi = 0; mi < sorted.length; mi++) {
              if (sorted[mi].id === id) { idx = mi; break; }
            }
            if (idx <= 0) {
              alert('Nothing above to merge into.');
              return;
            }
            book[menuId] = EBMenus.mergeDishWithPrevious(sorted, idx);
            dishId = book[menuId][Math.max(0, idx - 1)].id;
            save();
            mode = 'complete';
            render();
            return;
          }
          if (act === 'remove') {
            if (!confirm('Remove this dish?')) return;
            book[menuId] = dishes().filter(function (d) { return d.id !== id; });
            dishId = (dishes()[0] && dishes()[0].id) || '';
            save();
            mode = 'complete';
            render();
            return;
          }
          mode = act;
          render();
          var form = document.querySelector('.form-card');
          if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      });
      var doGen = document.getElementById('doGenerate');
      if (doGen) doGen.onclick = generateMenu;
      var doHint = document.getElementById('doPrintHint');
      if (doHint) doHint.onclick = generateMenu;
      document.querySelectorAll('[data-include]').forEach(function (box) {
        box.onchange = function () {
          if (!includes[menuId]) includes[menuId] = {};
          includes[menuId][box.getAttribute('data-include')] = box.checked;
          save();
          renderPreview();
        };
      });
      document.querySelectorAll('[data-promo-tick]').forEach(function (box) {
        box.onchange = function () {
          if (!promoTicks[menuId]) promoTicks[menuId] = {};
          promoTicks[menuId][box.getAttribute('data-promo-tick')] = box.checked;
          savePromoTicks();
          renderPreview();
        };
      });
      function persistLayoutFromDom() {
        var next = EBMenus.defaultSectionLayout();
        EBMenus.SECTIONS.forEach(function (sec) {
          var w = document.querySelector('[data-layout-width="' + sec + '"]');
          var f = document.querySelector('[data-layout-frame="' + sec + '"]');
          next[sec] = {
            width: (w && w.value) || next[sec].width,
            frame: !!(f && f.value === 'yes')
          };
        });
        sectionLayout = EBMenus.normalizeSectionLayout(next);
        saveSectionLayout();
      }
      document.querySelectorAll('[data-layout-width],[data-layout-frame]').forEach(function (sel) {
        sel.onchange = function () {
          persistLayoutFromDom();
          render();
        };
      });
      var resetLayout = document.getElementById('doResetLayout');
      if (resetLayout) {
        resetLayout.onclick = function () {
          if (!confirm('Reset every section to the default width and frilly-box settings?')) return;
          sectionLayout = EBMenus.defaultSectionLayout();
          saveSectionLayout();
          render();
        };
      }
      var savePromo = document.getElementById('doSavePromo');
      if (savePromo) {
        savePromo.onclick = function () {
          var title = (document.getElementById('promoTitle') || {}).value || '';
          var body = (document.getElementById('promoBody') || {}).value || '';
          title = String(title).trim();
          if (!title) { alert('Add a title for this wording.'); return; }
          var date = readPromoDateIso();
          if (String((document.getElementById('promoDateUk') || {}).value || '').trim() && !date) {
            alert('Date must be DD-MM-YYYY, or leave blank.');
            return;
          }
          if (editingPromoId) {
            promoBank = promoBank.map(function (p) {
              if (p.id !== editingPromoId) return p;
              return { id: p.id, title: title, body: String(body).trim(), date: date };
            });
          } else {
            promoBank.push(EBMenus.promoItem(title, body, date));
          }
          editingPromoId = '';
          savePromoBank();
          render();
        };
      }
      var cancelPromo = document.getElementById('doCancelPromo');
      if (cancelPromo) cancelPromo.onclick = function () { editingPromoId = ''; render(); };
      document.querySelectorAll('[data-edit-promo]').forEach(function (b) {
        b.onclick = function () { editingPromoId = b.getAttribute('data-edit-promo'); mode = 'wording'; render(); };
      });
      document.querySelectorAll('[data-del-promo]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-del-promo');
          if (!confirm('Remove this wording from the bank?')) return;
          promoBank = promoBank.filter(function (p) { return p.id !== id; });
          Object.keys(promoTicks).forEach(function (mid) {
            if (promoTicks[mid]) delete promoTicks[mid][id];
          });
          if (editingPromoId === id) editingPromoId = '';
          savePromoBank();
          savePromoTicks();
          render();
        };
      });
      document.querySelectorAll('[data-flag]').forEach(function (box) {
        box.onchange = function () { applyFlag(box.getAttribute('data-id'), box.getAttribute('data-flag'), box.checked); };
      });
      var pick = document.getElementById('pick');
      if (pick) pick.onchange = function () { dishId = pick.value; render(); };
      var doPaste = document.getElementById('doPaste');
      if (doPaste) doPaste.onclick = onPaste;
      var doUpload = document.getElementById('doUpload');
      if (doUpload) doUpload.onclick = onUpload;
      var doSaveAi = document.getElementById('doSaveAiUrl');
      if (doSaveAi) doSaveAi.onclick = function () {
        var v = (document.getElementById('aiUrl') || {}).value || '';
        EBMenuIngest.setAiUrl(v.trim());
        var n = document.getElementById('aiUrlNote');
        if (n) n.textContent = v.trim() ? 'AI reader URL saved on this browser.' : 'AI reader cleared — uploads will use OCR/PDF text only.';
      };
      var doSaveMeta = document.getElementById('doSaveMeta');
      if (doSaveMeta) doSaveMeta.onclick = function () {
        metaBook[menuId] = {
          title: (document.getElementById('metaTitle') || {}).value || '',
          subtitle: '',
          coursePrices: (document.getElementById('metaPrices') || {}).value || '',
          notes: (document.getElementById('metaNotes') || {}).value || ''
        };
        save();
        renderPreview();
      };
      var doSave = document.getElementById('doSave');
      if (doSave) doSave.onclick = onSave;
      var doRemove = document.getElementById('doRemove');
      if (doRemove) doRemove.onclick = onRemove;
      var doClear = document.getElementById('doClear');
      if (doClear) doClear.onclick = function () {
        if (!confirm('Clear every dish on ' + EBMenus.menuById(menuId).name + ' and start again?')) return;
        book[menuId] = [];
        dishId = '';
        save();
        mode = 'paste';
        render();
      };
      document.getElementById('doReset').onclick = function () {
        if (!confirm('Replace all menus with the sample set?')) return;
        book = EBMenus.seed();
        metaBook = {};
        includes = {};
        save();
        dishId = (dishes()[0] && dishes()[0].id) || '';
        mode = 'complete';
        render();
      };
    }

    function openReview(result) {
      pendingReview = result;
      // Auto-guess sections before staff confirms; merge PDF wrap-line orphans
      pendingReview.dishes = EBMenus.tidyOrphanDescriptions(
        EBMenus.assignSections(result.dishes || [])
      );
      var existing = document.getElementById('reviewOverlay');
      if (existing) existing.parentNode.removeChild(existing);
      var overlay = document.createElement('div');
      overlay.id = 'reviewOverlay';
      overlay.setAttribute('style',
        'position:fixed;inset:0;z-index:50;background:rgba(28,22,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto');

      card.setAttribute('style',

      html += '<p style="font-family:system-ui,sans-serif;font-size:14px;line-height:1.45;margin:0 0 12px;color:#3a342c">' +

        'Section titles themselves are ignored. Change a category anytime — your picks are kept when you merge, delete, or save. ' +
        'Use <strong>Merge ↑</strong> for description lines, or <strong>Delete</strong> to drop junk.</p>';
      if (result.warning) {
        html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:0 0 12px;color:#5a534a">' + escapeAttr(result.warning) + '</p>';
      }
      var fixes = result.spellingFixes || [];
      if (fixes.length) {
        html += '<div style="margin:0 0 14px;padding:12px 14px;border:2px solid #1c1610;border-radius:12px;background:#fff8e8">';
        html += '<div style="font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:0 0 8px">Spelling changes — check these</div>';
        html += '<ul style="margin:0;padding-left:18px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.45">';
        fixes.forEach(function (f) {
          html += '<li style="margin:0 0 6px"><span style="text-decoration:line-through;opacity:.75">' +
            escapeAttr(f.from) + '</span> → <strong>' + escapeAttr(f.to) + '</strong>';
          if (f.where) html += ' <span style="opacity:.65;font-size:12px">(' + escapeAttr(f.where) + ')</span>';
          html += '</li>';
        });
        html += '</ul></div>';
      } else if (result.source === 'ai') {
        html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:0 0 12px;padding:8px 12px;background:#f0ebe3;border-radius:10px">AI reported <strong>no spelling changes</strong>.</p>';
      }
      if (result.meta && (result.meta.title || result.meta.coursePrices)) {
        html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:0 0 10px"><strong>' +
          escapeAttr(result.meta.title || '') + '</strong>';
        if (result.meta.coursePrices) html += '<br>' + escapeAttr(result.meta.coursePrices);
        html += '</p>';
      }
      html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:0 0 8px" id="reviewCount">' +
        (pendingReview.dishes || []).length + ' dishes · fix sections · merge / delete · then save</p>';
      html += '<div id="reviewList" style="max-height:58vh;overflow:auto;border:1px solid #e4d9cc;border-radius:10px;padding:10px 12px;background:#fff;font-family:system-ui,sans-serif;font-size:13px"></div>';
      if (result.kind === 'party' && menuId !== 'party') {
        html += '<p style="font-family:system-ui,sans-serif;font-size:13px;margin:12px 0 0;color:#5a2a2a">AI thinks this is a <strong>party / Christmas</strong> set menu. Use the <strong>Party / Christmas</strong> tab for the standardised centred layout.</p>';
      }
      html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">';
      html += '<button type="button" id="reviewAccept" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:0;border-radius:999px;background:#1c1610;color:#f4eae3;cursor:pointer">Looks good — save to ' + escapeAttr(EBMenus.menuById(menuId).name) + '</button>';
      html += '<button type="button" id="reviewCancel" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:1px solid #1c1610;border-radius:999px;background:#fff;cursor:pointer">Cancel</button>';
      html += '</div>';
      card.innerHTML = html;
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      /** Keep every category dropdown on the pending list so merge/delete/save don’t wipe edits. */
      function syncReviewCategories() {
        var list = pendingReview.dishes || [];
        overlay.querySelectorAll('[data-review-section]').forEach(function (sel) {
          var i = parseInt(sel.getAttribute('data-review-section'), 10);
          if (!list[i] || !sel.value) return;
          list[i].section = sel.value;
        });
      }

      function paintReviewList() {
        var listEl = document.getElementById('reviewList');
        var countEl = document.getElementById('reviewCount');
        if (countEl) {
          countEl.textContent = (pendingReview.dishes || []).length +
            ' dishes · fix sections · merge / delete · then save';
        }
        if (!listEl) return;
        var lastSec = '';
        var rows = '';
        (pendingReview.dishes || []).forEach(function (d, i) {
          if (d.section !== lastSec) {
            lastSec = d.section;
            rows += '<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#5a534a;margin:' +
              (i ? '14px' : '0') + ' 0 8px">' + escapeAttr(lastSec) + '</div>';
          }
          var suggestMerge = i > 0 && EBMenus.shouldMergeOntoPrevious(pendingReview.dishes[i - 1], d);
          rows += '<div style="display:grid;grid-template-columns:auto minmax(7.5rem,9rem) minmax(0,1fr) auto;gap:8px;align-items:start;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #f0ebe3' +
            (suggestMerge ? ';background:#fff8e8;border-radius:8px;padding:8px' : '') + '">';
          rows += '<span style="width:8px"></span>';
          rows += sectionSelectHtml(d.section, 'data-review-section="' + i + '" style="font:600 12px system-ui,sans-serif;padding:6px 8px;border:1px solid #cfc7bb;border-radius:8px;background:#fffaf4;width:100%"');
          rows += '<div><div style="font-weight:700">' + escapeAttr(d.name);
          if (d.price) rows += ' <span style="font-weight:500;opacity:.75">' + escapeAttr(d.price) + '</span>';
          if (d.tags) rows += ' <em style="color:#538135;font-weight:400">' + escapeAttr(d.tags) + '</em>';
          rows += '</div>';
          if (d.description) rows += '<div style="color:#555;margin-top:2px">' + escapeAttr(d.description) + '</div>';
          if (suggestMerge) {
            rows += '<div style="margin-top:4px;font-size:12px;color:#6b5344">Looks like a description for the dish above</div>';
          }
          rows += '</div>';
          rows += '<div style="display:flex;flex-direction:column;gap:6px;align-items:stretch">';
          if (i > 0) {
            rows += '<button type="button" data-review-merge="' + i + '" style="font:600 12px system-ui,sans-serif;padding:6px 10px;border:1px solid #1c1610;border-radius:999px;background:' +
              (suggestMerge ? '#1c1610' : '#fff') + ';color:' + (suggestMerge ? '#f4eae3' : '#1c1610') +
              ';cursor:pointer;white-space:nowrap" title="Merge this line into the dish above as its description">Merge ↑</button>';
          }
          rows += '<button type="button" data-review-delete="' + i + '" style="font:600 12px system-ui,sans-serif;padding:6px 10px;border:1px solid #8a3d28;border-radius:999px;background:#fff;color:#8a3d28;cursor:pointer;white-space:nowrap" title="Remove this row">Delete</button>';
          rows += '</div>';
          rows += '</div>';
        });
        listEl.innerHTML = rows;
        listEl.querySelectorAll('[data-review-section]').forEach(function (sel) {
          sel.onchange = function () {
            syncReviewCategories();
            pendingReview.dishes = EBMenus.sortDishesBySection(pendingReview.dishes);
            paintReviewList();
          };
        });
        listEl.querySelectorAll('[data-review-merge]').forEach(function (btn) {
          btn.onclick = function () {
            syncReviewCategories();
            var idx = parseInt(btn.getAttribute('data-review-merge'), 10);
            pendingReview.dishes = EBMenus.mergeDishWithPrevious(pendingReview.dishes, idx);
            paintReviewList();
          };
        });
        listEl.querySelectorAll('[data-review-delete]').forEach(function (btn) {
          btn.onclick = function () {
            syncReviewCategories();
            var idx = parseInt(btn.getAttribute('data-review-delete'), 10);
            pendingReview.dishes = EBMenus.deleteDishAt(pendingReview.dishes, idx);
            paintReviewList();
          };
        });
      }
      paintReviewList();

      document.getElementById('reviewCancel').onclick = function () {
        overlay.parentNode.removeChild(overlay);
        pendingReview = null;
      };
      document.getElementById('reviewAccept').onclick = function () {
        syncReviewCategories();
        var keep = (pendingReview.dishes || []).map(function (d, i) {
          return {
            id: EBMenus.dish(d.section, d.name, d.description, d.price, d.tags, d.lunchClub).id + '-' + i,
            section: d.section,
            name: d.name,
            description: d.description || '',
            price: d.price || '',
            tags: d.tags || '',
            lunchClub: !!d.lunchClub
          };
        });
        if (!keep.length) {
          alert('Nothing left to save — add dishes or cancel.');
          return;
        }
        book[menuId] = EBMenus.sortDishesBySection(EBMenus.tidyOrphanDescriptions(keep));
        if (pendingReview.meta && (pendingReview.meta.title || pendingReview.meta.coursePrices || pendingReview.meta.notes)) {
          metaBook[menuId] = pendingReview.meta;
        }
        dishId = keep[0].id;
        save();
        overlay.parentNode.removeChild(overlay);
        pendingReview = null;
        mode = 'complete';
        flowStep = 1;
        render();
        var first = document.querySelector('.section-block');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    }

    function onUpload() {
      var input = document.getElementById('menuFile');
      var note = document.getElementById('uploadNote');
      var btn = document.getElementById('doUpload');
      if (!input || !input.files || !input.files[0]) {
        if (note) note.textContent = 'Choose a PDF, Word (.docx), or image first.';
        return;
      }
      if (!window.EBMenuIngest) {
        if (note) note.textContent = 'Upload reader failed to load. Refresh the page and try again.';
        return;
      }
      var file = input.files[0];
      if (btn) { btn.disabled = true; btn.textContent = 'Reading…'; }
      if (note) note.textContent = 'Starting…';
      EBMenuIngest.readFile(file, function (status) {
        if (note) note.textContent = status;
      }).then(function (result) {
        var area = document.getElementById('paste');
        if (area && result.source !== 'ai') area.value = result.text;
        if (btn) { btn.disabled = false; btn.textContent = 'Read uploaded file'; }
        if (note) note.textContent = (result.warning || 'Ready to review.') + ' (' + result.dishes.length + ' dishes)';
        openReview(result);
      }).catch(function (err) {
        if (note) note.textContent = (err && err.message) ? err.message : 'Could not read that file.';
        if (btn) { btn.disabled = false; btn.textContent = 'Read uploaded file'; }
      });
    }

    function findDish(id) {
      var list = dishes();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function applyFlag(id, flag, on) {
      var item = findDish(id);
      if (!item) return;
      if (flag === 'lunchClub') {
        item.lunchClub = on;
      } else {
        var m = EBMenus.parseMarks(item.tags);
        m[flag] = on;
        if (flag === 'gf' && !on) m.gfOpt = false;
        if (flag === 'v' && !on) m.vOpt = false;
        if (flag === 'vg' && !on) m.vgOpt = false;
        if (flag === 'gfOpt' && on) m.gf = true;
        if (flag === 'vOpt' && on) m.v = true;
        if (flag === 'vgOpt' && on) m.vg = true;
        item.tags = EBMenus.formatMarks(m);
      }
      save();
      // refresh tags line without full re-render of scroll position
      render();
    }

    function field(label, id, value) {
      return '<label class="field">' + label + '</label><input type="text" id="' + id + '" value="' + escapeAttr(value || '') + '">';
    }
    function escapeAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }
    function blank() {
      return { section: dishes()[0] ? dishes()[0].section : 'Mains', name: '', description: '', price: '', tags: '', lunchClub: false };
    }
    function readMarks(prefix) {
      return EBMenus.formatMarks({
        gf: !!(document.getElementById(prefix + '-gf') && document.getElementById(prefix + '-gf').checked),
        gfOpt: !!(document.getElementById(prefix + '-gfOpt') && document.getElementById(prefix + '-gfOpt').checked),
        v: !!(document.getElementById(prefix + '-v') && document.getElementById(prefix + '-v').checked),
        vOpt: !!(document.getElementById(prefix + '-vOpt') && document.getElementById(prefix + '-vOpt').checked),
        vg: !!(document.getElementById(prefix + '-vg') && document.getElementById(prefix + '-vg').checked),
        vgOpt: !!(document.getElementById(prefix + '-vgOpt') && document.getElementById(prefix + '-vgOpt').checked)
      });
    }
    function readForm() {
      return {
        section: document.getElementById('section').value.trim() || 'Dishes',
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        price: document.getElementById('price').value.trim(),
        tags: readMarks('form'),
        lunchClub: !!(document.getElementById('form-lunch') && document.getElementById('form-lunch').checked)
      };
    }
    function onSave() {
      var next = readForm();
      if (!next.name) return;
      if (mode === 'add') {
        next.id = EBMenus.dish(next.section, next.name).id + '-' + Date.now();
        dishes().push(next);
        dishId = next.id;
        mode = 'complete';
      } else if (mode === 'replace' || mode === 'adjust') {
        var item = currentDish();
        if (!item) return;
        Object.keys(next).forEach(function (k) { item[k] = next[k]; });
        mode = 'complete';
      }
      save();
      render();
    }
    function onRemove() {
      book[menuId] = dishes().filter(function (d) { return d.id !== dishId; });
      dishId = (dishes()[0] && dishes()[0].id) || '';
      save();
      mode = 'complete';
      render();
    }
    function onPaste() {
      var text = document.getElementById('paste').value;
      var parsed = EBMenus.parsePaste(text).filter(function (d) {
        return !EBMenus.isJunkDishName(d.name);
      });
      var note = document.getElementById('pasteNote');
      if (!parsed.length) {
        if (note) note.textContent = 'Nothing to read. Put each dish on its own line. Use headings like Starters / Mains.';
        return;
      }
      openReview({
        text: text,
        dishes: parsed,
        meta: metaBook[menuId] || EBMenus.emptyMeta(),
        kind: '',
        source: 'paste',
        fileName: '',
        needsReview: true,
        warning: 'Pasted text — check the list before saving to the menu.'
      });
    }

    function planTitle(fit) {
      if (fit === 'two-up') return 'One sheet, two copies';
      if (fit === 'one') return 'One A4 page';
      if (fit === 'two') return 'Two A4 pages';
      return 'Too full';
    }

    function composed() {
      var result = EBMenus.sheetPlanFor(book, menuId, hostIncludes());
      var menu = EBMenus.menuById(menuId);
      result.plan.sectionLayout = sectionLayout;
      if (menu.kind === 'long' && typeof EBMenuPrint !== 'undefined' && EBMenuPrint.planFluidLayout) {
        var promos = pickedPromosForSheet();
        var layout = EBMenuPrint.planFluidLayout(menu, result.dishes, {
          promos: promos,
          sectionLayout: sectionLayout
        });
        result.plan.layout = layout;
        result.plan.fit = layout.fit;
        result.plan.text = layout.summary;
        result.plan.promos = promos;
      }
      return result;
    }

    function renderPlanHtml() {
      var result = composed();
      var plan = result.plan;
      var list = result.dishes;
      var ticks = EBMenus.lunchClubFromTicks(book);
      var menu = EBMenus.menuById(menuId);
      var html = '<div class="plan ' + plan.fit + '"><strong>' + planTitle(plan.fit) + '</strong>' + plan.text + '</div>';
      if (plan.fit === 'over') {
        html += '<p class="note">Untick an included menu, or remove dishes, before you generate.</p>';
      } else {
        html += '<p class="note">Generate fills the page (A4, or 2×A5 on one A4 for guillotine). Selling boxes stay inside their frames and only appear when there’s room.</p>';
      }
      if (plan.layout && plan.layout.fillers && plan.layout.fillers.length) {
        html += '<p class="note"><strong>Will auto-add:</strong> ' + plan.layout.fillers.map(function (f) { return escapeAttr(f); }).join(' · ') + '</p>';
      }
      var promos = plan.promos || pickedPromosForSheet();
      if (menu.kind === 'long') {
        var anyPromoTick = Object.keys(hostPromoTicks()).some(function (k) { return hostPromoTicks()[k]; });
        html += '<p class="note"><strong>Wording:</strong> ' +
          (promos.length
            ? promos.map(function (p) {
              return escapeAttr(p.title) + (p.date ? ' (' + escapeAttr(EBMenus.formatPromoDate(p.date) || p.date) + ')' : '');
            }).join(' · ')
            : 'none') +
          (anyPromoTick ? ' — from your ticks.' : ' — auto (no ticks; past dates skipped).') +
          '</p>';
      }
      if (menuId === 'lunch-club') {
        html += '<p class="note">Printed as its own card. Monday to Thursday.</p>';
      } else if (ticks.length) {
        html += '<p class="note">' + ticks.length + ' dish' + (ticks.length === 1 ? '' : 'es') + ' ticked for lunch club (Mon–Thurs). They get the knife and fork.</p>';
      } else {
        html += '<p class="note">No lunch club ticks. The lunch club stays a separate menu.</p>';
      }
      var section = '';
      html += '<ul class="dishes">';
      list.forEach(function (d) {
        if (d.section !== section) {
          section = d.section;
          html += '<li class="section-label">' + escapeAttr(section) + '</li>';
        }
        html += '<li><div class="name">' + (d.lunchClub && menuId !== 'lunch-club' ? MARK : '') + escapeAttr(d.name);
        if (menuId !== 'lunch-club' && d.price) html += ' <span style="font-weight:500">' + escapeAttr(d.price) + '</span>';
        if (d.fromMenu) html += ' <span class="from">from ' + escapeAttr(EBMenus.menuById(d.fromMenu).name) + '</span>';
        html += '</div>';
        if (d.description) html += '<div>' + escapeAttr(d.description) + '</div>';
        if (d.tags) html += '<div class="tag">' + escapeAttr(d.tags) + '</div>';
        html += '</li>';
      });
      html += '</ul>';
      return html;
    }

    function renderPreview() {
      var el = document.getElementById('preview');
      if (!el) return;
      el.innerHTML = renderPlanHtml();
    }

    function generateMenu() {
      var result = composed();
      if (result.plan.fit === 'over') {
        alert('This sheet is too full. Untick an included menu or remove dishes, then try again.');
        return;
      }
      var menu = EBMenus.menuById(menuId);
      var btn = document.getElementById('doGenerate');
      var hint = document.getElementById('doPrintHint');
      if (btn) { btn.disabled = true; btn.textContent = 'Arranging…'; }
      if (hint) hint.disabled = true;

      // Layout brain runs here (order + columns + fillers), then we open a preview sheet.
      var promos = menu.kind === 'long' ? pickedPromosForSheet() : [];
      var layout = null;
      if (menu.kind === 'long' && EBMenuPrint.planFluidLayout) {
        layout = EBMenuPrint.planFluidLayout(menu, result.dishes, {
          promos: promos,
          sectionLayout: sectionLayout
        });
        result.plan.layout = layout;
        result.plan.fit = layout.fit;
        result.plan.text = layout.summary;
        result.plan.promos = promos;
        result.plan.sectionLayout = sectionLayout;
      }

      var overlay = document.createElement('div');
      overlay.id = 'arrangeOverlay';
      overlay.setAttribute('style',
        'position:fixed;inset:0;z-index:40;background:rgba(28,22,16,.55);display:flex;align-items:center;justify-content:center;padding:24px');
      var card = document.createElement('div');
      card.setAttribute('style',
        'background:#fffaf4;color:#1c1610;max-width:420px;width:100%;border-radius:16px;padding:22px 24px;box-shadow:0 18px 40px rgba(0,0,0,.25);font-family:Georgia,serif');
      var steps = [
        'Ordering sections (Nibbles → Starters → Sharing → Item Boost → Classics → Mains…)',
        'Choosing one or two pages and columns',
        'Placing wording / sandwiches / logo only if they fit',
        'Gemini checking page balance (if AI reader is set)',
        'Opening classy print preview'
      ];
      var html = '<div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5a534a;margin-bottom:8px">Layout</div>';
      html += '<div style="font-size:22px;font-weight:600;margin-bottom:12px">Arranging your menu</div>';
      html += '<ul id="arrangeSteps" style="margin:0;padding-left:18px;line-height:1.55;font-family:system-ui,sans-serif;font-size:14px;color:#333">';
      steps.forEach(function (s, i) {
        html += '<li data-step="' + i + '" style="opacity:.35;margin:0 0 6px">' + s + '</li>';
      });
      html += '</ul>';
      html += '<p id="arrangeSummary" style="display:none;margin:14px 0 0;font-family:system-ui,sans-serif;font-size:13px;line-height:1.45;color:#3a342c"></p>';
      card.innerHTML = html;
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      function layoutPayload() {
        if (!layout) return { kind: menu.kind, pages: 1 };
        return {
          kind: menu.kind,
          pages: layout.pages,
          fit: layout.fit,
          leftover: layout.leftover,
          fillers: layout.fillers || [],
          p1: layout.p1,
          p2: layout.p2,
          sections: (result.dishes || []).reduce(function (acc, d) {
            acc[d.section] = (acc[d.section] || 0) + 1;
            return acc;
          }, {})
        };
      }

      function applyLayoutAdvice(advice) {
        if (!advice || !layout) return;
        if (advice.density) result.plan.forceFillClass = 'fill-' + advice.density;
        if (advice.dropFootLogo) {
          if (layout.p1) layout.p1.footLogo = false;
          if (layout.p2) layout.p2.footLogo = false;
        }
        if (advice.sandwichesOn === 'page1') {
          layout.p1.sandwiches = true;
          if (layout.p2) layout.p2.sandwiches = false;
        } else if (advice.sandwichesOn === 'omit') {
          layout.p1.sandwiches = false;
          if (layout.p2) layout.p2.sandwiches = false;
        } else if (advice.sandwichesOn === 'page2' && layout.p2) {
          layout.p1.sandwiches = false;
          layout.p2.sandwiches = true;
        }
        if (advice.notes) result.plan.layoutReview = advice.notes;
        result.plan.layout = layout;
      }

      function openPrintPreview() {
        var w = window.open('', '_blank');
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (btn) { btn.disabled = false; btn.textContent = 'Generate menu'; }
        if (hint) hint.disabled = false;
        if (!w) {
          alert('Allow pop-ups to open the branded menu sheet, then print it to PDF.');
          return;
        }
        result.plan.meta = metaBook[menuId] || EBMenus.emptyMeta();
        if (menu.kind === 'party' && !result.plan.meta.title) {
          result.plan.meta.title = 'Christmas Party Menu';
          result.plan.meta.coursePrices = result.plan.meta.coursePrices || '2 courses £32.95 · 3 courses £39.95';
        }
        w.document.open();
        w.document.write(EBMenuPrint.build(menu, result.dishes, result.plan));
        w.document.close();
      }

      var i = 0;
      function tick() {
        var li = overlay.querySelector('[data-step="' + i + '"]');
        if (li) li.style.opacity = '1';
        i += 1;
        if (i < 3) {
          setTimeout(tick, 240);
          return;
        }
        // Step 3: optional Gemini balance check
        var reviewPromise = (typeof EBMenuIngest !== 'undefined' && EBMenuIngest.reviewLayout && menu.kind === 'long')
          ? EBMenuIngest.reviewLayout(layoutPayload())
          : Promise.resolve(null);
        reviewPromise.then(function (advice) {
          var li3 = overlay.querySelector('[data-step="3"]');
          if (li3) {
            li3.style.opacity = '1';
            if (!advice) li3.textContent = 'Balance check skipped (no AI reader URL / script not redeployed)';
            else if (advice.notes) li3.textContent = 'Gemini: ' + advice.notes;
          }
          applyLayoutAdvice(advice);
          var sum = document.getElementById('arrangeSummary');
          if (sum) {
            sum.style.display = 'block';
            sum.textContent = (layout && layout.summary ? layout.summary + ' ' : '') +
              (advice && advice.notes ? advice.notes : '');
          }
          var li4 = overlay.querySelector('[data-step="4"]');
          if (li4) li4.style.opacity = '1';
          setTimeout(openPrintPreview, 420);
        });
      }
      setTimeout(tick, 180);
    }

    // Generate buttons live inside step 4 — bind in bindEditor after render, not here.
    dishId = (dishes()[0] && dishes()[0].id) || '';
    try {
      render();
    } catch (bootErr) {
      var ed = document.getElementById('editor');
      if (ed) {
        ed.innerHTML = '<div class="plan over"><strong>Menus failed to load</strong>' +
          escapeAttr(String(bootErr && bootErr.message ? bootErr.message : bootErr)) +
          '</div><p class="note">Hard-refresh, or clear site data for this page and try again.</p>';
      }
      if (window.console && console.error) console.error(bootErr);
    }
  </script>
</body>
</html>
