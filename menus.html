    function bindDateField() {
      var uk = document.getElementById('promoDateUk');
      var iso = document.getElementById('promoDate');
      if (!uk || !iso) return;
      function syncFromPicker() {
        uk.value = EBMenus.toUkDate(iso.value) || '';
      }
      function syncFromText() {
        var next = EBMenus.toIsoDate(uk.value);
        if (next) {
          iso.value = next;
          uk.value = EBMenus.toUkDate(next);
        } else if (!String(uk.value || '').trim()) {
          iso.value = '';
        }
      }
      iso.addEventListener('change', syncFromPicker);
      iso.addEventListener('input', syncFromPicker);
      uk.addEventListener('change', syncFromText);
      uk.addEventListener('blur', syncFromText);
    }

    function readPromoDateIso() {
      var isoEl = document.getElementById('promoDate');
      var ukEl = document.getElementById('promoDateUk');
      var fromPicker = isoEl && isoEl.value ? EBMenus.toIsoDate(isoEl.value) : '';

    function scrollToDishForm_() {
      requestAnimationFrame(function () {
        var form = document.getElementById('dishFormCard') || document.querySelector('.form-card');
        if (form) form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        var nameEl = document.getElementById('name');
        if (nameEl && (mode === 'add' || mode === 'adjust' || mode === 'replace')) {
          try { nameEl.focus({ preventScroll: true }); } catch (eF) { try { nameEl.focus(); } catch (e2) {} }
        }
      });
    }

    function renderComplete() {
      var list = EBMenus.sortDishesBySection(dishes());
      var menu = EBMenus.menuById(menuId);
      if ((mode === 'adjust' || mode === 'replace') && list.length && !currentDish()) {
        dishId = list[0].id;
      }
      if (!list.length) {
        var empty = '<p class="note">This menu is empty. Add a dish, or paste a list.</p>';
        if (mode === 'add') empty += renderDishForm(menu, { inline: true });
        return empty;
      }
      var showLunch = menuId !== 'lunch-club';
      var defaults = EBMenus.defaultSectionLayout();
      var menuRules = layoutFor(menuId);
      var html = '';
      var section = '';
      var open = false;
      var formPlaced = false;
      list.forEach(function (d, idx) {
        if (d.section !== section) {
          if (open) {
            if (mode === 'add' && pendingAddSection === section && !formPlaced) {
              html += renderDishForm(menu, { inline: true });
              formPlaced = true;
            }
            html += sectionAddFooter_(section);
            html += '</div></div>';
          }
          section = d.section;
          var rule = menuRules[section] || defaults[section] || { width: 'full', frame: false };
          var widthLabel = (EBMenus.WIDTH_OPTIONS.filter(function (w) { return w.id === rule.width; })[0] || {}).label || rule.width;
          var count = list.filter(function (x) { return x.section === section; }).length;
          html += '<div class="section-block" data-section="' + escapeAttr(section) + '">';
          html += '<div class="section-block-head">';
          html += '<div class="title">' + escapeAttr(section) + '</div>';
          html += '<div class="meta"><span class="chip">' + count + '</span>';
          html += '<span class="chip">' + escapeAttr(widthLabel) + '</span>';
          html += '<span class="chip">' + (rule.frame ? 'Frilly' : 'Plain') + '</span></div></div>';
          html += '<div class="section-block-body">';
          open = true;
        }
        var editing = (mode === 'adjust' || mode === 'replace') && d.id === dishId;
        var m = EBMenus.parseMarks(d.tags);
        html += '<div class="dish-row' + (editing ? ' is-editing' : '') + '" data-id="' + d.id + '">';
        html += '<div><div class="name">' + escapeAttr(d.name);
        if (d.price && menuId !== 'lunch-club') html += ' <span style="font-weight:500">' + escapeAttr(d.price) + '</span>';
        html += '</div>';
        if (d.description) html += '<div class="meta">' + escapeAttr(d.description) + '</div>';
        if (d.tags) html += '<div class="tag">' + escapeAttr(d.tags) + '</div>';
        html += '<label class="field no-print" style="margin:8px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)">Section</label>';
        html += sectionSelectHtml(d.section, 'data-section-id="' + escapeAttr(d.id) + '" class="section-pick" aria-label="Section for ' + escapeAttr(d.name) + '"');
        html += '<div class="opt-row">';
        if (m.gf) html += '<label><input type="checkbox" data-flag="gfOpt" data-id="' + d.id + '"' + (m.gfOpt ? ' checked' : '') + '> gf as option</label>';
        if (m.v) html += '<label><input type="checkbox" data-flag="vOpt" data-id="' + d.id + '"' + (m.vOpt ? ' checked' : '') + '> v as option</label>';
        if (m.vg) html += '<label><input type="checkbox" data-flag="vgOpt" data-id="' + d.id + '"' + (m.vgOpt ? ' checked' : '') + '> vg as option</label>';
        if (m.df) html += '<label><input type="checkbox" data-flag="dfOpt" data-id="' + d.id + '"' + (m.dfOpt ? ' checked' : '') + '> df as option</label>';
        html += '</div></div>';
        html += '<div class="ticks">';
        if (showLunch) html += '<label><input type="checkbox" data-flag="lunchClub" data-id="' + d.id + '"' + (d.lunchClub ? ' checked' : '') + '><span>' + MARK + '</span></label>';
        else html += '<span></span>';
        html += '<label><input type="checkbox" data-flag="gf" data-id="' + d.id + '"' + (m.gf ? ' checked' : '') + '><span class="letter">gf</span></label>';
        html += '<label><input type="checkbox" data-flag="v" data-id="' + d.id + '"' + (m.v ? ' checked' : '') + '><span class="letter">v</span></label>';
        html += '<label><input type="checkbox" data-flag="vg" data-id="' + d.id + '"' + (m.vg ? ' checked' : '') + '><span class="letter">vg</span></label>';
        html += '<label><input type="checkbox" data-flag="df" data-id="' + d.id + '"' + (m.df ? ' checked' : '') + '><span class="letter">df</span></label>';
        html += '</div>';
        html += '<div class="dish-actions no-print">';
        html += '<button type="button" class="link dish-del" data-dish-delete="' + escapeAttr(d.id) +
          '" aria-label="Delete ' + escapeAttr(d.name) + '">Delete</button>';
        html += '<select data-dish-action="' + escapeAttr(d.id) + '" aria-label="Edit ' + escapeAttr(d.name) + '">';
        html += '<option value="">Edit…</option><option value="adjust">Adjust</option><option value="replace">Replace</option>';
        if (idx > 0) html += '<option value="merge-up">Merge ↑ into dish above</option>';
        html += '<option value="remove">Delete</option>';
        html += '</select></div></div>';
        // Adjust / Replace form sits under the dish being edited (not at page top).
        if (editing) {
          html += renderDishForm(menu, { inline: true });
          formPlaced = true;
        }
        if (idx === list.length - 1 && open) {
          if (mode === 'add' && pendingAddSection === section && !formPlaced) {
            html += renderDishForm(menu, { inline: true });
            formPlaced = true;
          }
          html += sectionAddFooter_(section);
          html += '</div></div>';
        }
      });
      if ((mode === 'adjust' || mode === 'replace') && !formPlaced) {
        html += renderDishForm(menu, { inline: true });
      }
      return html;
    }

    function retargetSection_(fromName, toName) {
      var from = String(fromName || '');
      var to = String(toName || 'Mains');
      Object.keys(book || {}).forEach(function (mid) {
        if (!Array.isArray(book[mid])) return;
        book[mid] = book[mid].map(function (d) {
          if ((d.section || '') !== from) return d;
          var copy = {};
          Object.keys(d).forEach(function (k) { copy[k] = d[k]; });
          copy.section = to;
          return copy;
        });
      });
    }

    function bindOwnerExtras_() {
      var addMenu = document.getElementById('doAddExtraMenu');
      if (addMenu) {
        addMenu.onclick = function () {
          var nameEl = document.getElementById('extraMenuName');
          var kindEl = document.getElementById('extraMenuKind');
          var res = EBMenus.addCustomMenu({
            name: nameEl ? nameEl.value : '',
            kind: kindEl ? kindEl.value : 'long'
          });
          if (!res.ok) {
            alert(res.error || 'Could not add menu.');
            return;
          }
          ensureExtraMenuStores();
          menuId = res.menu.id;
          dishId = '';
          mode = 'complete';
          flowStep = 1;
          save();
          render();
        };
      }
      var addSec = document.getElementById('doAddExtraSection');
      if (addSec) {
        addSec.onclick = function () {
          var nameEl = document.getElementById('extraSectionName');
          var res = EBMenus.addCustomSection(nameEl ? nameEl.value : '');
          if (!res.ok) {
            alert(res.error || 'Could not add category.');
            return;
          }
          save();
          render();
        };
      }
      document.querySelectorAll('[data-remove-extra-menu]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-remove-extra-menu');
          var menu = EBMenus.menuById(id);
          var n = (book[id] || []).length;
          var label = (menu && menu.name) || id;
          if (!confirm('Delete ' + label + (n ? ' and its ' + n + ' dish' + (n === 1 ? '' : 'es') : '') + '? This cannot be undone.')) return;
          EBMenus.removeCustomMenu(id);
          delete book[id];
          delete layoutBook[id];
          delete metaBook[id];
          delete includes[id];
          Object.keys(includes).forEach(function (host) {
            if (includes[host]) delete includes[host][id];
          });
          if (promoTicks[id]) delete promoTicks[id];
          if (menuId === id) menuId = 'main';
          ensureExtraMenuStores();
          save();
          render();
        };
      });
      document.querySelectorAll('[data-remove-extra-section]').forEach(function (b) {
        b.onclick = function () {
          var name = b.getAttribute('data-remove-extra-section');
          var used = 0;
          Object.keys(book || {}).forEach(function (mid) {
            (book[mid] || []).forEach(function (d) {
              if ((d.section || '') === name) used += 1;
            });
          });
          var msg = 'Remove category ' + name + '?';
          if (used) msg += ' ' + used + ' dish' + (used === 1 ? '' : 'es') + ' will move to Mains.';
          if (!confirm(msg)) return;
          if (used) retargetSection_(name, 'Mains');
          EBMenus.removeCustomSection(name);
          save();
          render();
        };
      });
      ['extraMenuName', 'extraSectionName'].forEach(function (fid) {
        var el = document.getElementById(fid);
        if (!el) return;
        el.onkeydown = function (ev) {
          if (ev.key !== 'Enter') return;
          ev.preventDefault();
          if (fid === 'extraMenuName' && addMenu) addMenu.click();
          if (fid === 'extraSectionName' && addSec) addSec.click();
        };
      });
    }

    function bindEditor() {
      bindDateField();
      bindOwnerExtras_();
      document.querySelectorAll('[data-view-jump]').forEach(function (b) {
        b.onclick = function () {
          var next = b.getAttribute('data-view-jump');
          if (!next) return;
          viewMode = next;
          render();
        };
      });
      document.querySelectorAll('[data-flow-step]').forEach(function (b) {
        b.onclick = function (ev) {
          ev.preventDefault();
          var next = parseInt(b.getAttribute('data-flow-step'), 10);
          if (!next || next === flowStep) return;
          flowStep = next;
          mode = 'complete';
          render();
        };
      });
      document.querySelectorAll('[data-add-section]').forEach(function (b) {
        b.onclick = function () {
          pendingAddSection = b.getAttribute('data-add-section') || '';
          dishId = '';
          mode = 'add';
          flowStep = 1;
          render();
          scrollToDishForm_();
        };
      });
      document.querySelectorAll('[data-push-section]').forEach(function (b) {
        b.onclick = function () {
          var sec = b.getAttribute('data-push-section') || '';
          var dest = EBMenus.ownPageMenuForSection ? EBMenus.ownPageMenuForSection(sec) : null;
          if (!dest) {
            alert(sec + ' does not have its own menu yet. Add it as a card menu first.');
            return;
          }
          var moving = (dishes() || []).filter(function (d) { return d.section === sec; });
          var destList = book[dest.id] || [];
          var destSection = EBMenus.sectionForTargetMenu
            ? EBMenus.sectionForTargetMenu(sec, '', '', dest.id)
            : sec;

        listEl.querySelectorAll('[data-review-merge]').forEach(function (btn) {
          btn.onclick = function () {
            syncReviewCategories();
            var idx = parseInt(btn.getAttribute('data-review-merge'), 10);
            pendingReview.dishes = EBMenus.mergeDishWithPrevious(pendingReview.dishes, idx);
            paintReviewList();
          };
        });
        listEl.querySelectorAll('[data-review-split]').forEach(function (btn) {
          btn.onclick = function () {
            syncReviewCategories();
            var idx = parseInt(btn.getAttribute('data-review-split'), 10);
            pendingReview.dishes = EBMenus.splitDishAt(pendingReview.dishes, idx);
            paintReviewList();
          };
        });
        listEl.querySelectorAll('[data-review-delete]').forEach(function (btn) {
          btn.onclick = function () {
            syncReviewCategories();
            var idx = parseInt(btn.getAttribute('data-review-delete'), 10);
            pendingReview.dishes = EBMenus.deleteDishAt(pendingReview.dishes, idx);
            paintReviewList();
          };

      paintReviewList();

      document.getElementById('reviewCancel').onclick = function () {
        overlay.parentNode.removeChild(overlay);
        pendingReview = null;
      };
      document.getElementById('reviewAccept').onclick = function () {
        syncReviewCategories();
        var keep = (pendingReview.dishes || []).map(function (d, i) {
          return {
            id: EBMenus.dish(d.section, d.name, d.description, d.price, d.tags, d.lunchClub).id + '-' + i,
            section: d.section,
            name: d.name,
            description: d.description || '',
            price: d.price || '',
            tags: d.tags || '',
            lunchClub: !!d.lunchClub
          };
        });
        if (!keep.length) {
          alert('Nothing left to save — add dishes or cancel.');
          return;
        }
        book[menuId] = EBMenus.sortDishesBySection(EBMenus.tidyOrphanDescriptions(keep));
        if (pendingReview.meta && (pendingReview.meta.title || pendingReview.meta.coursePrices || pendingReview.meta.notes)) {
          metaBook[menuId] = pendingReview.meta;
        }
        dishId = keep[0].id;
        save();
        overlay.parentNode.removeChild(overlay);
        pendingReview = null;
        mode = 'complete';

    function onUpload() {
      var input = document.getElementById('menuFile');
      var note = document.getElementById('uploadNote');
      var btn = document.getElementById('doUpload');
      if (!input || !input.files || !input.files.length) {
        if (note) note.textContent = 'Choose one or more PDF, Word (.docx), or image files first.';
        return;
      }
      if (!window.EBMenuIngest || typeof EBMenuIngest.readFiles !== 'function') {
        if (note) note.textContent = 'Upload reader failed to load. Refresh the page and try again.';
        return;
      }
      var files = input.files;
      var n = files.length;
      if (btn) { btn.disabled = true; btn.textContent = n > 1 ? ('Reading ' + n + ' files…') : 'Reading…'; }
      if (note) note.textContent = n > 1 ? ('Starting ' + n + ' files…') : 'Starting…';
      EBMenuIngest.readFiles(files, function (status) {
        if (note) note.textContent = status;
      }).then(function (result) {
        var area = document.getElementById('paste');
        if (area && result.source !== 'ai' && result.source !== 'mixed') area.value = result.text;
        if (btn) { btn.disabled = false; btn.textContent = 'Read uploaded file(s)'; }
        if (note) note.textContent = (result.warning || 'Ready to review.') + ' (' + result.dishes.length + ' dishes)';
        openReview(result);
      }).catch(function (err) {
        if (note) note.textContent = (err && err.message) ? err.message : 'Could not read those files.';
        if (btn) { btn.disabled = false; btn.textContent = 'Read uploaded file(s)'; }
      });
    }

    function findDish(id) {
      var list = dishes();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function applyFlag(id, flag, on) {
      var item = findDish(id);
      if (!item) return;
      if (flag === 'lunchClub') {
        item.lunchClub = on;
      } else {
        var m = EBMenus.parseMarks(item.tags);
        m[flag] = on;
        if (flag === 'gf' && !on) m.gfOpt = false;
        if (flag === 'v' && !on) m.vOpt = false;
        if (flag === 'vg' && !on) m.vgOpt = false;
        if (flag === 'df' && !on) m.dfOpt = false;
        if (flag === 'gfOpt' && on) m.gf = true;
        if (flag === 'vOpt' && on) m.v = true;
        if (flag === 'vgOpt' && on) m.vg = true;
        if (flag === 'dfOpt' && on) m.df = true;
        item.tags = EBMenus.formatMarks(m);
      }
      save();
      // refresh tags line without full re-render of scroll position
      render();
    }

    function field(label, id, value) {
      return '<label class="field">' + label + '</label><input type="text" id="' + id + '" value="' + escapeAttr(value || '') + '">';
    }
    function escapeAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }
    function blank() {
      var sec = pendingAddSection ||
        (dishes()[0] ? dishes()[0].section : 'Mains');
      return { section: sec, name: '', description: '', price: '', tags: '', lunchClub: false };
    }

    function applyCatalogueEntryToForm(entry) {
      if (!entry) return;
      var sec = document.getElementById('section');
      var nameEl = document.getElementById('name');
      var descEl = document.getElementById('description');
      var priceEl = document.getElementById('price');
      // Replace keeps the slot’s category; Add/Adjust can take the catalogue section.
      if (sec && entry.section && mode !== 'replace') sec.value = entry.section;
      if (nameEl) nameEl.value = entry.name || '';
      if (descEl) descEl.value = entry.description || '';
      if (priceEl) priceEl.value = entry.price || '';
      var marks = EBMenus.parseMarks(entry.tags || '');
      ['gf', 'gfOpt', 'v', 'vOpt', 'vg', 'vgOpt', 'df', 'dfOpt'].forEach(function (k) {
        var el = document.getElementById('form-' + k);
        if (el) el.checked = !!marks[k];
      });
      paintDishSuggest(nameEl ? nameEl.value : '');
    }

    function dishSuggestSection() {
      var secEl = document.getElementById('section');
      if (secEl && secEl.value) return String(secEl.value);
      if (mode === 'replace' || mode === 'adjust') {
        var cur = currentDish();
        if (cur && cur.section) return String(cur.section);
      }
      return '';
    }

    function paintDishSuggest(query) {
      var listEl = document.getElementById('dishSuggestList');
      var hintEl = document.getElementById('dishSuggestHint');
      if (!listEl || !EBMenus.searchDishCatalogue) return;
      var section = dishSuggestSection();
      var sameCategory = mode === 'replace';
      if (hintEl && sameCategory && section) {
        hintEl.innerHTML = 'Past dishes in <strong>' + escapeAttr(section) +
          '</strong>. Click to fill name, description, price and allergens — or keep typing.';
      }
      var matches = EBMenus.searchDishCatalogue(dishCatalogue, query, {
        limit: sameCategory ? 16 : 10,
        section: sameCategory ? section : '',
        allowEmpty: sameCategory
      });
      if (!String(query || '').trim()) {
        if (sameCategory && matches.length) {
          // Fall through — show the category list with no name filter.
        } else if (sameCategory && section) {
          listEl.innerHTML = '<p class="dish-suggest-empty">No past dishes in ' +
            escapeAttr(section) + ' yet — keep typing for a new one.</p>';
          return;
        } else {
          listEl.innerHTML = '<p class="dish-suggest-empty">Start typing a name to see past dishes.</p>';
          return;
        }
      }
      if (!matches.length) {
        listEl.innerHTML = '<p class="dish-suggest-empty">' +
          (sameCategory
            ? 'No match in ' + escapeAttr(section || 'this category') + ' — keep typing for a new dish.'
            : 'No past match — keep typing for a new dish.') +
          '</p>';
        return;
      }
      var html = '';
      matches.forEach(function (m, i) {
        var priceBits = (m.priceHistory || []).slice(0, 3).map(function (h) {
          return (h.price || '—') + ' · ' + h.date;
        }).join(' → ');
        html += '<button type="button" class="dish-suggest-item" data-catalogue-i="' + i + '">';
        html += '<div class="sn">' + escapeAttr(m.name) +
          (m.price ? ' · ' + escapeAttr(m.price) : '') + '</div>';
        if (m.description) html += '<div class="sd">' + escapeAttr(m.description) + '</div>';
        html += '<div class="sm">' + escapeAttr(m.section || '') +
          (m.tags ? ' · ' + escapeAttr(m.tags) : '') +
          (m.lastSeen ? ' · last ' + escapeAttr(m.lastSeen) : '') +
          (priceBits ? ' · ' + escapeAttr(priceBits) : '') + '</div>';
        html += '</button>';
      });
      listEl.innerHTML = html;
      listEl.querySelectorAll('[data-catalogue-i]').forEach(function (btn) {
        btn.onclick = function () {
          var i = parseInt(btn.getAttribute('data-catalogue-i'), 10);
          applyCatalogueEntryToForm(matches[i]);
        };
      });
    }

    function paintSpellHints_(fieldId, boxId, where) {
      var el = document.getElementById(fieldId);
      var box = document.getElementById(boxId);
      if (!el || !box || !EBMenus.suggestSpellingForText) return;
      var extra = catalogueSpellExtra_();
      extra.push(el.value || '');
      var hits = EBMenus.suggestSpellingForText(el.value || '', {
        extra: extra,
        where: where
      });
      if (!hits.length) {
        box.hidden = true;
        box.innerHTML = '';
        return;
      }
      box.hidden = false;
      var html = '';
      hits.forEach(function (f, i) {
        html += '<div><span style="text-decoration:line-through;opacity:.75">' + escapeAttr(f.from) +
          '</span> → <strong>' + escapeAttr(f.to) + '</strong>';
        html += '<button type="button" class="link" data-spell-i="' + i + '">Use this</button></div>';
      });
      box.innerHTML = html;
      box.querySelectorAll('[data-spell-i]').forEach(function (btn) {
        btn.onclick = function () {
          var i = parseInt(btn.getAttribute('data-spell-i'), 10);
          var f = hits[i];
          if (!f) return;
          el.value = EBMenus.autoCorrectSpelling
            ? spellReplaceLive_(el.value, f.from, f.to)
            : el.value;
          paintSpellHints_(fieldId, boxId, where);
        };
      });
    }

    function spellReplaceLive_(text, from, to) {
      var re = new RegExp('\\b' + String(from).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
      return String(text || '').replace(re, to);
    }

    function bindSpellHints() {
      ['name', 'description'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var boxId = id === 'name' ? 'spellHintsName' : 'spellHintsDesc';
        var where = id === 'name' ? 'name' : 'description';
        paintSpellHints_(id, boxId, where);
        el.addEventListener('input', function () {
          paintSpellHints_(id, boxId, where);
        });
      });
    }

    function bindDishSuggest() {
      bindSpellHints();
      var nameEl = document.getElementById('name');
      var listEl = document.getElementById('dishSuggestList');
      var secEl = document.getElementById('section');
      if (!nameEl || !listEl) return;
      paintDishSuggest(nameEl.value || '');
      nameEl.addEventListener('input', function () {
        paintDishSuggest(nameEl.value || '');
      });
      nameEl.addEventListener('focus', function () {
        paintDishSuggest(nameEl.value || '');
      });
      if (secEl) {
        secEl.addEventListener('change', function () {
          paintDishSuggest(nameEl.value || '');
        });
      }
    }

    /** Sunday: pick dishes from this week's Main and/or Specials without retyping. */
    function openWeekPickForSunday() {
      var sources = [
        { id: 'main', label: 'Main menu', dishes: (book.main || []).slice() },
        { id: 'specials', label: 'Specials', dishes: (book.specials || []).slice() }
      ];
      var pickList = [];
      sources.forEach(function (src) {
        src.dishes.forEach(function (d) {
          pickList.push({ source: src.id, sourceLabel: src.label, dish: d });
        });
      });
      if (!pickList.length) {
        alert('Main and Specials are empty — add dishes there first, then pull them onto Sunday.');
        return;
      }
      var existing = document.querySelector('.main-pick-overlay');
      if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
      var overlay = document.createElement('div');
      overlay.className = 'main-pick-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-label', 'Pick from this week’s Main or Specials');
      var card = document.createElement('div');
      card.className = 'main-pick-card';
      var html = '<h3 style="font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 6px">From this week’s Main / Specials</h3>';
      html += '<p class="note" style="margin:0 0 8px">Tick dishes to copy onto Sunday (same title, description, allergens, price). Sunday Roasts stay as they are.</p>';
      html += '<div class="toolbar-row" style="margin:0 0 8px">';
      html += '<button type="button" class="link" id="mainPickAll">Select all</button>';
      html += '<button type="button" class="link" id="mainPickNone">Clear</button>';
      html += '</div>';
      html += '<div class="main-pick-list">';
      var lastGroup = '';
      var lastSec = '';
      pickList.forEach(function (row, i) {
        var group = row.sourceLabel;
        if (group !== lastGroup) {
          lastGroup = group;
          lastSec = '';
          html += '<div class="main-pick-sec" style="margin-top:' + (i ? '16px' : '0') +
            ';font-size:13px;letter-spacing:.06em">' + escapeAttr(group) + '</div>';
        }
        var sec = row.dish.section || 'Dishes';
        if (sec !== lastSec) {
          lastSec = sec;
          html += '<div class="main-pick-sec" style="opacity:.85">' + escapeAttr(sec) + '</div>';
        }
        html += '<label class="main-pick-row">';
        html += '<input type="checkbox" data-week-pick="' + i + '">';
        html += '<span><strong>' + escapeAttr(row.dish.name) + '</strong>';
        if (row.dish.price) html += ' · ' + escapeAttr(row.dish.price);
        if (row.dish.tags) html += ' <em style="color:var(--green)">' + escapeAttr(row.dish.tags) + '</em>';
        if (row.dish.description) {
          html += '<br><span style="color:var(--ink-soft);font-size:13px">' +
            escapeAttr(row.dish.description) + '</span>';
        }
        html += '</span></label>';
      });
      html += '</div>';
      html += '<div class="toolbar-row">';
      html += '<button type="button" class="go" id="mainPickAdd">Add selected to Sunday</button>';
      html += '<button type="button" class="soft" id="mainPickCancel">Cancel</button>';
      html += '</div>';
      card.innerHTML = html;
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      function close() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }
      document.getElementById('mainPickCancel').onclick = close;
      overlay.addEventListener('click', function (ev) {
        if (ev.target === overlay) close();
      });
      document.getElementById('mainPickAll').onclick = function () {
        overlay.querySelectorAll('[data-week-pick]').forEach(function (cb) { cb.checked = true; });
      };
      document.getElementById('mainPickNone').onclick = function () {
        overlay.querySelectorAll('[data-week-pick]').forEach(function (cb) { cb.checked = false; });
      };
      document.getElementById('mainPickAdd').onclick = function () {
        var added = 0;
        var sunday = book.sunday || (book.sunday = []);
        var have = {};
        sunday.forEach(function (d) {
          var k = EBMenus.dishCatalogueKey ? EBMenus.dishCatalogueKey(d.name) : String(d.name || '').toLowerCase();
          if (k) have[k] = true;
        });
        overlay.querySelectorAll('[data-week-pick]:checked').forEach(function (cb) {
          var i = parseInt(cb.getAttribute('data-week-pick'), 10);
          var row = pickList[i];
          var src = row && row.dish;
          if (!src) return;
          var key = EBMenus.dishCatalogueKey ? EBMenus.dishCatalogueKey(src.name) : String(src.name || '').toLowerCase();
          if (key && have[key]) return;
          var clone = EBMenus.dishFromCatalogueEntry
            ? EBMenus.dishFromCatalogueEntry(src, { section: src.section })
            : EBMenus.tidyDishFields({
                id: (src.id || 'd') + '-sun-' + Date.now() + added,
                section: src.section,
                name: src.name,
                description: src.description,
                price: src.price,
                tags: src.tags,
                lunchClub: !!src.lunchClub
              });
          if (row.source === 'specials') clone.fromMenu = 'specials';
          else if (row.source === 'main') clone.fromMenu = 'main';
          sunday.push(clone);
          if (key) have[key] = true;
          added += 1;
        });
        if (!added) {
          alert('Tick at least one dish that is not already on Sunday.');
          return;
        }
        if (EBMenus.sortDishesBySection) book.sunday = EBMenus.sortDishesBySection(sunday);
        save();
        close();
        mode = 'complete';
        render();
      };
    }
    function readMarks(prefix) {
      return EBMenus.formatMarks({
        gf: !!(document.getElementById(prefix + '-gf') && document.getElementById(prefix + '-gf').checked),
        gfOpt: !!(document.getElementById(prefix + '-gfOpt') && document.getElementById(prefix + '-gfOpt').checked),
        v: !!(document.getElementById(prefix + '-v') && document.getElementById(prefix + '-v').checked),
        vOpt: !!(document.getElementById(prefix + '-vOpt') && document.getElementById(prefix + '-vOpt').checked),
        vg: !!(document.getElementById(prefix + '-vg') && document.getElementById(prefix + '-vg').checked),
        vgOpt: !!(document.getElementById(prefix + '-vgOpt') && document.getElementById(prefix + '-vgOpt').checked),
        df: !!(document.getElementById(prefix + '-df') && document.getElementById(prefix + '-df').checked),
        dfOpt: !!(document.getElementById(prefix + '-dfOpt') && document.getElementById(prefix + '-dfOpt').checked)
      });
    }
    function readForm() {
      return {
        section: document.getElementById('section').value.trim() || 'Dishes',
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        price: document.getElementById('price').value.trim(),
        tags: readMarks('form'),
        lunchClub: !!(document.getElementById('form-lunch') && document.getElementById('form-lunch').checked)
      };
    }
    function onSave() {
      var next = readForm();
      if (!next.name) return;
      if (EBMenus.autoCorrectSpelling) {
        next.name = EBMenus.autoCorrectSpelling(next.name).text;
        next.description = EBMenus.autoCorrectSpelling(next.description).text;
      }
      // Keep exactly what staff typed in Name (e.g. Vegan Katsu Curry), after typo fix.
      // tidyDishFields still lifts tags / cleans description, but must not
      // rewrite the printed title on Adjust / Add / Replace.
      var typedName = next.name;
      var staySection = next.section || pendingAddSection || '';
      if (mode === 'add') {
        next.id = EBMenus.dish(next.section, next.name).id + '-' + Date.now();
        next = EBMenus.tidyDishFields(next);
        next.name = (EBMenus.cleanDishName ? EBMenus.cleanDishName(typedName) : typedName) || typedName;
        dishes().push(next);
        dishId = next.id;
        mode = 'complete';
      } else if (mode === 'replace' || mode === 'adjust') {
        var item = currentDish();
        if (!item) return;
        next.id = item.id;
        next.fromMenu = item.fromMenu;
        next = EBMenus.tidyDishFields(next);
        next.name = (EBMenus.cleanDishName ? EBMenus.cleanDishName(typedName) : typedName) || typedName;
        Object.keys(next).forEach(function (k) { item[k] = next[k]; });
        staySection = next.section || item.section || '';
        mode = 'complete';
      }
      // Keep categories together after Add / Adjust (new dishes used to sit at
      // the end and split Desserts / Mains in the Generate preview).
      if (EBMenus.sortDishesBySection) {
        book[menuId] = EBMenus.sortDishesBySection(dishes());
      }
      pendingAddSection = '';
      rememberScroll_(staySection);
      save();
      render();
    }
    function onRemove() {
      removeDishInstant(dishId, null);
      mode = 'complete';
      // Form remove still needs a light re-render so the editor leaves adjust mode.
      render();
    }

    /**
     * Instant delete: melt the row away, keep deleting others while save/cloud
     * continues in the background (no full list reload).
     */
    function removeDishInstant(id, rowEl) {
      if (!id) return;
      book[menuId] = dishes().filter(function (d) { return d.id !== id; });
      if (dishId === id) dishId = (dishes()[0] && dishes()[0].id) || '';
      save();
      var row = rowEl || null;
      if (!row) {
        document.querySelectorAll('.dish-row[data-id]').forEach(function (el) {
          if (el.getAttribute('data-id') === id) row = el;
        });
      }
      if (!row || !row.parentNode) return;
      var sectionBlock = row.closest ? row.closest('.section-block') : null;
      try {
        row.style.maxHeight = row.offsetHeight + 'px';
        // Force layout so max-height transition runs.
        void row.offsetHeight;
      } catch (e0) {}
      row.classList.add('dish-row-melt');
      row.style.maxHeight = '0';
      setTimeout(function () {
        if (row.parentNode) row.parentNode.removeChild(row);
        if (!sectionBlock) return;
        var left = sectionBlock.querySelectorAll('.dish-row:not(.dish-row-melt)');
        if (!left.length) {
          if (sectionBlock.parentNode) sectionBlock.parentNode.removeChild(sectionBlock);
          return;
        }
        var chip = sectionBlock.querySelector('.section-block-head .chip');
        if (chip) chip.textContent = String(left.length);
      }, 300);
    }
    function onPaste() {
      var text = document.getElementById('paste').value;
      var parsed = EBMenus.parsePaste(text).filter(function (d) {
        return !EBMenus.isJunkDishName(d.name);
      });
      var note = document.getElementById('pasteNote');
      if (!parsed.length) {
        if (note) note.textContent = 'Nothing to read. Put each dish on its own line. Use headings like Starters / Mains.';
        return;
      }
      openReview({
        text: text,
        dishes: parsed,

    function planTitle(fit) {

    function composed() {
      var result = EBMenus.sheetPlanFor(book, menuId, hostIncludes());
      var menu = EBMenus.menuById(menuId);
      var sheetLayout = effectiveSectionLayout(menuId);
      result.plan.sectionLayout = sheetLayout;

        var promos = pickedPromosForSheet();
        var layout = EBMenuPrint.planFluidLayout(menu, result.dishes, {
          promos: promos,

    function renderPlanHtml() {
      var result = composed();

      }

        if (d.fromMenu) {

      });
      if (open) html += '</div>';
      html += '</div>';

    function showDropInOfferGate_(result, thenGenerate) {

      var hint = document.getElementById('doPrintHint');
      if (btn) { btn.disabled = false; btn.textContent = 'Generate menu'; }

      var existing = document.getElementById('dropInOfferOverlay');

      var card = document.createElement('div');
      card.setAttribute('style',
        'background:#fffaf4;color:#1c1610;max-width:520px;width:100%;border-radius:16px;padding:22px 24px;box-shadow:0 18px 40px rgba(0,0,0,.25)');
      var html = '<div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5a534a;margin-bottom:8px;font-family:system-ui,sans-serif">Before print</div>';
      html += '<div style="font-family:Georgia,serif;font-size:22px;font-weight:600;margin-bottom:8px">There is space on the sheet</div>';
      html += '<p style="font-family:system-ui,sans-serif;font-size:14px;margin:0 0 12px">Do you want to drop in a sub-menu? Tick one below and we will try it. If that block is too big, we will ask you to untick it and try a different one.</p>';
      html += '<div class="include-box" style="margin:0 0 10px"><h3 style="margin-top:0">Available to drop in</h3>';
      html += '<div class="include-row">';

          escapeAttr(dropInLabel_(m)) + '</label>';

      html += '</div></div>';
      html += '<p id="dropInOfferNote" style="font-family:system-ui,sans-serif;font-size:13px;color:#5a2a2a;margin:0 0 12px;min-height:1.2em"></p>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:10px">';
      html += '<button type="button" id="dropInTry" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:0;border-radius:999px;background:#1c1610;color:#f4eae3;cursor:pointer">Try drop-in</button>';
      html += '<button type="button" id="dropInSkip" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:1px solid #1c1610;border-radius:999px;background:#fff;cursor:pointer">Generate without extras</button>';

          : (EBMenus.sheetPlanFor(book, menuId, trialTicks).plan.fit === 'over');

        closeGate();
        thenGenerate();
      };

    /**
     * One-shot clearance from spellCheckThenGenerate_. generateMenuAfterSpell_
     * refuses to open arrange/print without this — no menu.kind may bypass.
     */
    var spellGatePassed_ = false;

    function generateMenu() {
      var result = composed();
      // Overflow cannot print — spell runs on the next successful Generate.
      if (result.plan.fit === 'over') {
        showOverflowGate_(result);
        return;
      }
      var layout = result.plan.layout;
      var menu = EBMenus.menuById(menuId);
      // Single funnel for every kind (long / card / party / custom):
      // optional drop-in offer → spelling gate → arrange → print preview.
      function afterPreGates_() {
        spellCheckThenGenerate_(generateMenuAfterSpell_);
      }
      if (menu.kind === 'long' && layout && layout.canOfferDropIn && unusedDropIns_().length) {
        showDropInOfferGate_(result, afterPreGates_);
        return;
      }
      afterPreGates_();
    }

    function catalogueSpellExtra_() {
      return (dishCatalogue || []).map(function (e) { return e && e.name; }).filter(Boolean);
    }

    function mergeSpellingFixes_(a, b) {
      return (EBMenus.normalizeSpellingFixes || function (x) { return x || []; })
        ([].concat(a || [], b || []));
    }

    /** Dishes that will print — host sheet plus any ticked drop-ins (e.g. Specials on Main). */
    function spellCheckDishes_() {
      var result = composed();
      var list = (result && result.dishes && result.dishes.length) ? result.dishes : dishes();
      return list || [];
    }

    /**
     * Mandatory spelling gate before print for every Generate path.
     * Local food-typo map always runs (long, card, party). AI is optional extra —
     * if AI times out, local hits still show; if no hits, proceed.
     */
    function spellCheckThenGenerate_(done) {
      spellGatePassed_ = false;
      var list = spellCheckDishes_();
      var btn = document.getElementById('doGenerate');
      if (btn) { btn.disabled = true; btn.textContent = 'Checking spelling…'; }
      var finish = function (fixes, aiOk) {
        var pass = function () {
          spellGatePassed_ = true;
          done();
        };
        if (!fixes.length) {
          if (btn) { btn.disabled = false; btn.textContent = 'Generate menu'; }
          pass();
          return;
        }
        showSpellingGate_(fixes, pass, { aiOk: !!aiOk });
      };
      // Empty sheet: still clear the gate (no words to check) — never skip the funnel.
      if (!list.length || !EBMenus.scanMenuSpelling) {
        finish([], false);
        return;
      }
      var local = EBMenus.scanMenuSpelling(list, { extra: catalogueSpellExtra_() });
      var aiFn = (typeof EBMenuIngest !== 'undefined' && EBMenuIngest.reviewSpelling)
        ? EBMenuIngest.reviewSpelling
        : null;
      var aiP = aiFn ? aiFn(list) : Promise.resolve(null);
      aiP.then(function (ai) {
        var aiFixes = (ai && ai.spellingFixes) ? ai.spellingFixes : [];
        var merged = mergeSpellingFixes_(local, aiFixes);
        var fixes = EBMenus.enrichSpellingFixes
          ? EBMenus.enrichSpellingFixes(list, merged)
          : merged;
        // AI null/timeout/empty still keeps local hits — never block forever.
        finish(fixes, !!(ai && ai.ok !== false && ai));
      }, function () {
        finish(local, false);
      });
    }

    function showSpellingGate_(fixes, done, opts) {
      opts = opts || {};
      var btn = document.getElementById('doGenerate');
      var list = spellCheckDishes_();
      if (EBMenus.enrichSpellingFixes) fixes = EBMenus.enrichSpellingFixes(list, fixes);
      var existing = document.getElementById('spellGateOverlay');
      if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
      var overlay = document.createElement('div');
      overlay.id = 'spellGateOverlay';
      overlay.setAttribute('style',
        'position:fixed;inset:0;z-index:45;background:rgba(28,22,16,.55);display:flex;align-items:center;justify-content:center;padding:24px');
      var card = document.createElement('div');
      card.setAttribute('style',
        'background:#fffaf4;color:#1c1610;max-width:560px;width:100%;border-radius:16px;padding:22px 24px;box-shadow:0 18px 40px rgba(0,0,0,.25);max-height:80vh;overflow:auto');
      var html = '<div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5a534a;margin-bottom:8px;font-family:system-ui,sans-serif">Before print</div>';
      html += '<div style="font-family:Georgia,serif;font-size:22px;font-weight:600;margin-bottom:8px">Spelling check</div>';
      html += '<p style="font-family:system-ui,sans-serif;font-size:14px;margin:0 0 12px">';
      html += opts.aiOk
        ? 'We checked each dish line (local food-typo list + AI). '
        : 'We checked each dish line with the local food-typo list';
      if (!opts.aiOk) html += ' (AI spelling was unavailable — local hits still show). ';
      html += 'Tick <strong>Change</strong> or <strong>Correct as typed</strong> on every suggestion, then generate.</p>';
      html += '<ul class="spell-gate-list">';
      fixes.forEach(function (f, i) {
        var snippet = f.snippet || f.dishName || '';
        var parts = EBMenus.splitSpellSnippet
          ? EBMenus.splitSpellSnippet(snippet, f.from)
          : { before: snippet, hit: '', after: '' };
        var preview = f.preview || snippet;
        html += '<li class="spell-gate-item">';
        html += '<div class="dish">' + escapeAttr(f.dishName || 'Dish') +
          (f.where ? ' <span class="lbl" style="font-weight:400;font-size:12px;color:#5a534a">· ' +
            escapeAttr(f.where) + '</span>' : '') + '</div>';
        html += '<p class="line"><span class="lbl">As written</span>';
        html += escapeAttr(parts.before);
        if (parts.hit) html += '<mark>' + escapeAttr(parts.hit) + '</mark>';
        html += escapeAttr(parts.after) + '</p>';
        html += '<p class="line"><span class="lbl">If changed</span>' + escapeAttr(preview) + '</p>';
        html += '<div class="picks">';
        html += '<label><input type="checkbox" data-spell-i="' + i + '" data-spell-act="change"> Change to “' +
          escapeAttr(f.to) + '”</label>';
        html += '<label><input type="checkbox" data-spell-act="keep" data-spell-i="' + i + '"> Correct as typed</label>';
        html += '</div></li>';
      });
      html += '</ul>';
      html += '<p class="spell-gate-note" id="spellGateNote"></p>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:10px">';
      html += '<button type="button" id="spellGenerateChosen" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:0;border-radius:999px;background:#1c1610;color:#f4eae3;cursor:pointer">Generate</button>';
      html += '<button type="button" id="spellKeepTyped" style="font:600 14px system-ui,sans-serif;padding:10px 16px;border:1px solid #1c1610;border-radius:999px;background:#fff;cursor:pointer">Keep all as typed</button>';
      html += '</div>';
      card.innerHTML = html;
      overlay.appendChild(card);
      document.body.appendChild(overlay);
      function closeGate() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (btn) { btn.disabled = false; btn.textContent = 'Generate menu'; }
      }
      overlay.querySelectorAll('input[data-spell-i]').forEach(function (box) {
        box.addEventListener('change', function () {
          if (!box.checked) return;
          var i = box.getAttribute('data-spell-i');
          var act = box.getAttribute('data-spell-act');
          overlay.querySelectorAll('input[data-spell-i="' + i + '"]').forEach(function (other) {
            if (other.getAttribute('data-spell-act') !== act) other.checked = false;
          });
        });
      });
      document.getElementById('spellGenerateChosen').onclick = function () {
        var chosen = [];
        var missing = 0;
        fixes.forEach(function (f, i) {
          var change = overlay.querySelector('input[data-spell-i="' + i + '"][data-spell-act="change"]');
          var keep = overlay.querySelector('input[data-spell-i="' + i + '"][data-spell-act="keep"]');
          var didChange = change && change.checked;
          var didKeep = keep && keep.checked;

          return;
        }
        if (chosen.length) {
          if (EBMenus.applySpellingFixesToBook) {
            book = EBMenus.applySpellingFixesToBook(book, chosen, menuId);
          } else if (EBMenus.applySpellingFixesToDishes) {
            book[menuId] = EBMenus.applySpellingFixesToDishes(dishes(), chosen);
            if (EBMenus.sortDishesBySection) book[menuId] = EBMenus.sortDishesBySection(book[menuId]);
          }
          save();
        }
        closeGate();
        done();
      };
      document.getElementById('spellKeepTyped').onclick = function () {
        closeGate();
        done();
      };
    }

    function generateMenuAfterSpell_() {

      if (!spellGatePassed_) {
        spellCheckThenGenerate_(generateMenuAfterSpell_);
        return;
      }
      spellGatePassed_ = false;
      var result = composed();
      if (result.plan.fit === 'over') {
        showOverflowGate_(result);
        return;
      }
      var menu = EBMenus.menuById(menuId);
      var btn = document.getElementById('doGenerate');
      var hint = document.getElementById('doPrintHint');
      if (btn) { btn.disabled = true; btn.textContent = 'Arranging…'; }
      if (hint) hint.disabled = true;

      // Layout brain runs here (order + columns + fillers), then we open a preview sheet.
      var promos = (menu.kind === 'long' || menu.kind === 'party') ? pickedPromosForSheet() : [];
      var layout = null;
      if (menu.kind === 'long' && EBMenuPrint.planFluidLayout) {
        var sheetLayout = effectiveSectionLayout(menuId);
        layout = EBMenuPrint.planFluidLayout(menu, result.dishes, {

          sectionLayout: sheetLayout,
          includes: hostIncludes()
        });
        result.plan.layout = layout;
        result.plan.fit = layout.fit;
        result.plan.text = layout.summary;
        result.plan.promos = promos;
        result.plan.sectionLayout = sheetLayout;
        result.plan.includes = hostIncludes();
        if (layout.fit === 'over') {
          if (btn) { btn.disabled = false; btn.textContent = 'Generate menu'; }
          if (hint) hint.disabled = false;

          return;
        }
      } else if (menu.kind === 'party') {
        result.plan.promos = promos;
      }
      result.plan.meta = metaBook[menuId] || EBMenus.emptyMeta();
      if (result.plan.meta.paper === 'a5') result.plan.defaultPaper = 'a5';

      var overlay = document.createElement('div');
      overlay.id = 'arrangeOverlay';
      overlay.setAttribute('style',
        'position:fixed;inset:0;z-index:40;background:rgba(28,22,16,.55);display:flex;align-items:center;justify-content:center;padding:24px');
      var card = document.createElement('div');
      card.setAttribute('style',
        'background:#fffaf4;color:#1c1610;max-width:420px;width:100%;border-radius:16px;padding:22px 24px;box-shadow:0 18px 40px rgba(0,0,0,.25);font-family:Georgia,serif');
      var steps = [
        'Sell order inside each category (dearest first, mixed high/low — not a price ladder)',
        'Ordering sections (Nibbles → Starters → Sharing → Item Boost → Classics → Mains…)',
        'Choosing one or two pages and columns',
        'Keeping Sandwiches, Little Bells and Desserts if you ticked them on Dishes — not only if they fit',
        'Checking leftover column space',
        'Putting the logo on only if there’s room',
        'Opening classy print preview'
      ];
      var html = '<div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5a534a;margin-bottom:8px">Layout</div>';
      html += '<div style="font-size:22px;font-weight:600;margin-bottom:12px">Arranging your menu</div>';
      html += '<ul id="arrangeSteps" style="margin:0;padding-left:18px;line-height:1.55;font-family:system-ui,sans-serif;font-size:14px;color:#333">';
      steps.forEach(function (s, i) {
        html += '<li data-step="' + i + '" style="opacity:.35;margin:0 0 6px">' + s + '</li>';
      });
      html += '</ul>';
      html += '<p id="arrangeSummary" style="display:none;margin:14px 0 0;font-family:system-ui,sans-serif;font-size:13px;line-height:1.45;color:#3a342c"></p>';
      card.innerHTML = html;
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      function layoutPayload() {
        if (!layout) return { kind: menu.kind, pages: 1 };
        var payload = {
          kind: menu.kind,
          pages: layout.pages,
          fit: layout.fit,
          leftover: layout.leftover,
          fillers: layout.fillers || [],
          p1: layout.p1,
          p2: layout.p2,
          sections: (result.dishes || []).reduce(function (acc, d) {
            acc[d.section] = (acc[d.section] || 0) + 1;
            return acc;
          }, {})
        };
        // Units Gemini uses to decide where feature panels must go before release.
        if (EBMenuPrint.measureOppositeColumns) {
          payload.columns = EBMenuPrint.measureOppositeColumns(menu, result.dishes, {
            layout: layout,
            sectionLayout: result.plan.sectionLayout || effectiveSectionLayout(menuId),
            promos: promos
          });
        }
        if (layout) payload.sandwichesLocked = !!layout.sandwichesLocked;
        var sheetRules = result.plan.sectionLayout || {};
        payload.sectionWidths = {};
        payload.bestFit = [];
        Object.keys(sheetRules).forEach(function (sec) {
          var w = sheetRules[sec] && sheetRules[sec].width;
          if (!w) return;
          payload.sectionWidths[sec] = w;
          if (w === 'both') payload.bestFit.push(sec);
        });
        return payload;
      }

      function applyLayoutAdvice(advice) {
        if (!advice || !layout) return;
        if (advice.density) result.plan.forceFillClass = 'fill-' + advice.density;
        if (advice.dropFootLogo) {
          if (layout.p1) layout.p1.footLogo = false;
          if (layout.p2) layout.p2.footLogo = false;
        }
        // JS already placed the food map. Gemini may refine Best-fit widths
        // (column / full / split) and leftover feature panels — not locked widths,
        // and never dump Sides under Sharing.
        var bal = advice.columnBalance;
        if (!bal && advice.columns) bal = advice.columns;
        if (bal && typeof bal === 'object') {
          result.plan.forceColumnFill = {
            page1: bal.page1 || null,
            page2: bal.page2 || null
          };
        }
        var widths = advice.sectionWidths;
        if (widths && typeof widths === 'object' && result.plan.sectionLayout) {
          var bestFit = Array.isArray(advice.bestFit) ? advice.bestFit
            : (layoutPayload().bestFit || []);
          Object.keys(widths).forEach(function (sec) {
            var w = String(widths[sec] || '').toLowerCase();
            if (w !== 'column' && w !== 'full' && w !== 'split') return;
            if (bestFit.length && bestFit.indexOf(sec) === -1) return;
            var cur = result.plan.sectionLayout[sec] || {};
            // Never override a staff Column / Full lock.
            if (EBMenus.isLockedColumnWidth && EBMenus.isLockedColumnWidth(cur.width)) return;
            if (EBMenus.isLockedFullWidth && EBMenus.isLockedFullWidth(cur.width)) return;
            result.plan.sectionLayout[sec] = Object.assign({}, cur, { width: w });
            layout.widthOverrides = layout.widthOverrides || {};
            layout.widthOverrides[sec] = w;
          });
        }
        if (advice.notes) result.plan.layoutReview = advice.notes;
        result.plan.layoutSource = advice.source || 'gemini';
        result.plan.layout = layout;
      }

      /** If Gemini is offline, still force panels under any short column before release. */
      function localColumnBalanceFallback() {
        if (!EBMenuPrint.measureOppositeColumns) return null;
        var cols = EBMenuPrint.measureOppositeColumns(menu, result.dishes, {
          layout: layout,
          sectionLayout: result.plan.sectionLayout || effectiveSectionLayout(menuId),
          promos: promos
        });
        function pageFill(p) {
          if (!p || p.shorter === 'even') return { shorter: 'even', panels: 0 };
          var panels = Math.abs(p.gap || 0) > 9 ? 2 : 1;
          return { shorter: p.shorter, panels: panels };
        }
        var out = {
          ok: true,
          source: 'local-column-fallback',
          columnBalance: {
            page1: pageFill(cols.page1),
            page2: pageFill(cols.page2)
          },
          notes: 'Local column check: fill shorter stacks with feature panels before print.'
        };
        if (layout && layout.p2 && layout.p2.sandwiches) out.sandwichesOn = 'page2';
        else if (layout && layout.p1 && layout.p1.sandwiches) out.sandwichesOn = 'page1';
        if (layout && layout.p2 && layout.p2.sidesOnP2) out.sidesOn = 'page2';
        else if (layout && layout.p1 && layout.p1.sidesOnP1) out.sidesOn = 'page1';
        return out;
      }

      function openPrintPreview() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (btn) { btn.disabled = false; btn.textContent = 'Generate menu'; }
        if (hint) hint.disabled = false;
        result.plan.meta = metaBook[menuId] || EBMenus.emptyMeta();
        if (menu.kind === 'party' && !result.plan.meta.title) {
          result.plan.meta.title = 'Christmas Party Menu';
          result.plan.meta.coursePrices = result.plan.meta.coursePrices || '2 courses £32.95 · 3 courses £39.95';
        }
        if (result.plan.meta.paper === 'a5') result.plan.defaultPaper = 'a5';
        var html = EBMenuPrint.build(menu, result.dishes, result.plan);
        var opened = EBMenuPrint.openPrintHtml && EBMenuPrint.openPrintHtml(html);
        if (!opened) {
          alert('Allow pop-ups to open the menu preview, then Save or Discard.');
        }
        // Preview is Save or Discard only. Save stamps history and returns here.
      }

      var i = 0;
      function tick() {
        var li = overlay.querySelector('[data-step="' + i + '"]');
        if (li) li.style.opacity = '1';
        i += 1;
        if (i < 3) {
          setTimeout(tick, 240);
          return;
        }
        // Step 3: Gemini column-balance gate — hard deadline so Arranging never sticks.
        var reviewPromise = (typeof EBMenuIngest !== 'undefined' && EBMenuIngest.reviewLayout && menu.kind === 'long')
          ? EBMenuIngest.reviewLayout(layoutPayload())
          : Promise.resolve(null);
        var versionPromise = (EBMenuPrint && typeof EBMenuPrint.listPrintHistory === 'function')
          ? EBMenuPrint.listPrintHistory().catch(function () { return []; })
          : Promise.resolve([]);
        var settled = false;
        function finishArrange(advice) {
          if (settled) return;
          settled = true;
          try {
            if (!advice) advice = localColumnBalanceFallback();
            else if (!advice.columnBalance) {
              var local = localColumnBalanceFallback();
              if (local) advice.columnBalance = local.columnBalance;
            }
            var li3 = overlay.querySelector('[data-step="3"]');
            if (li3) {
              li3.style.opacity = '1';
              if (!advice) li3.textContent = 'Balance check skipped';
              else if (advice.source === 'local-column-fallback') {
                li3.textContent = 'Columns checked locally — adding feature panels under shorter stacks';
              } else if (advice.notes) li3.textContent = 'Gemini: ' + advice.notes;
              else li3.textContent = 'Gemini checked opposite columns before release';
            }
            applyLayoutAdvice(advice);
            var sum = document.getElementById('arrangeSummary');
            if (sum) {
              sum.style.display = 'block';
              sum.textContent = (layout && layout.summary ? layout.summary + ' ' : '') +
                (advice && advice.notes ? advice.notes : '');
            }
          } catch (err) {
            if (window.console && console.warn) console.warn('layout advice failed', err);
          }
          var li4 = overlay.querySelector('[data-step="4"]');
          if (li4) li4.style.opacity = '1';
          setTimeout(openPrintPreview, 420);
        }
        // Absolute ceiling — if Gemini/Apps Script hangs, open preview with local fill.
        reviewPromise = Promise.all([reviewPromise, versionPromise]).then(function (pair) {
          return pair[0];
        });
        // Absolute ceiling — if Gemini/Apps Script hangs, open preview with local fill.
        var hangWatch = setTimeout(function () { finishArrange(null); }, 14000);
        reviewPromise.then(function (advice) {
          clearTimeout(hangWatch);
          finishArrange(advice);
        }, function () {
          clearTimeout(hangWatch);
          finishArrange(null);
        });
      }
      setTimeout(tick, 180);
    }

    // Generate buttons live inside step 4 — bind in bindEditor after render, not here.
    document.querySelectorAll('#viewToggle [data-view]').forEach(function (b) {
      b.onclick = function () {
        var next = b.getAttribute('data-view');
        if (!next) return;
        // Re-clicking Print history still does one cloud check (open/refresh).
        if (next === viewMode) {
          if (next === 'history') renderHistory();
          return;
        }
        viewMode = next;
        render();
      };
    });
    dishId = (dishes()[0] && dishes()[0].id) || '';
    try {
      var syncBtn = document.getElementById('doSyncNow');
      if (syncBtn) {
        syncBtn.onclick = function () {
          syncBtn.disabled = true;
          syncNowFromCloud().then(function () {
            syncBtn.disabled = false;
          }, function () {
            syncBtn.disabled = false;
            render();
          });
        };
      }
      // Show dishes already on this phone immediately. Cloud read may run via
      // the outer Varlo page (iOS will not finish an Apps Script GET started
      // inside the Menus iframe until the next tap) — never blank the editor.
      cloudSyncNote = 'Syncing shared menus…';
      render();
      function pullSharedCloud_() {
        return pullMenusFromCloud().then(function () {
          if (EBMenuPrint && typeof EBMenuPrint.pullPrintHistoryFromCloud === 'function') {
            return EBMenuPrint.pullPrintHistoryFromCloud().then(function (hist) {
              if (viewMode === 'history' && hist && hist.rows) {
                paintHistoryRows_(hist.rows, {
                  cloudOk: !hist.cloudUnreachable,
                  updating: false
                });
              }
              return hist;
            }).catch(function () {});
          }
          if (EBMenuPrint && typeof EBMenuPrint.listPrintHistory === 'function') {
            return EBMenuPrint.listPrintHistory().catch(function () {});
          }
        });
      }
      pullSharedCloud_().then(function () { render(); }, function () { render(); });
      // Refresh shared menus/history when returning to the tab — not on a timer
      // while idle on Print history (that reshuffled Main/Sandwiches every ~45s).
      var sharedPullTimer_ = null;
      function scheduleSharedCloudPull_() {
        if (sharedPullTimer_) clearTimeout(sharedPullTimer_);
        sharedPullTimer_ = setTimeout(function () {
          sharedPullTimer_ = null;
          pullSharedCloud_();
        }, 150);
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') scheduleSharedCloudPull_();
      });
      window.addEventListener('focus', function () {
        scheduleSharedCloudPull_();
      });
    } catch (bootErr) {
      var ed = document.getElementById('editor');
      if (ed) {
        ed.innerHTML = '<div class="plan over"><strong>Menus failed to load</strong>' +
          escapeAttr(String(bootErr && bootErr.message ? bootErr.message : bootErr)) +
          '</div><p class="note">Hard-refresh, or clear site data for this page and try again.</p>';
      }
      if (window.console && console.error) console.error(bootErr);
    }
  </script>
</body>
</html>
